<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — ClasseIA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F2;--w:#FFF;--ink:#1B1C20;--ink2:#52545C;--ink3:#93949C;
  --t:#FF6B35;--t2:#FF8F5E;--tp:#FFEDE5;--r:#C8102E;--rp:#FDEEF1;--a:#D98C3D;--ap:#FBF3E9;--g:#22C55E;--gp:#F0FDF4;--br:#E3E4E8;--rd:12px;
}
html{font-size:17.5px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;letter-spacing:normal;}
.topbar{background:var(--w);border-bottom:1px solid var(--br);padding:0 1.4rem;height:58px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:'Inter',sans-serif;font-weight:600;font-size:1.3rem;}
a.back{font-size:.76rem;color:var(--ink3);text-decoration:none;}
a.back:hover{color:var(--t);}
.wrap{max-width:1400px;margin:0 auto;padding:1.6rem 1.2rem 4rem;}
.card{background:var(--w);border-radius:var(--rd);border:1px solid var(--br);box-shadow:0 2px 12px rgba(0,0,0,.04);margin-bottom:1.4rem;}
.ch{padding:1rem 1.3rem;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;}
.ct{font-family:'Inter',sans-serif;font-weight:600;font-size:1.35rem;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:700;background:var(--ap);color:var(--a);}
table{width:100%;border-collapse:collapse;}
th{background:var(--bg);padding:9px 12px;text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);}
td{padding:10px 12px;font-size:.92rem;border-bottom:1px solid var(--br);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.btn{padding:7px 14px;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s;}
.bt{background:var(--t);color:#fff;}.bt:hover{background:var(--t2);}
.bo{background:transparent;border:1.5px solid var(--br);color:var(--ink2);}.bo:hover{border-color:var(--t);color:var(--t);}
