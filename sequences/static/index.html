<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séquences — créez une série de leçons</title>
<style>
:root{--g:#2c6e49;--g2:#f0f9f4;--ink:#1c2420;--mut:#5f6b64;--line:#dfe6e1;--card:#fff;--warn:#bb2e26;--or:#d68c45}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#e6f4ec,#fff 320px) no-repeat #fff;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;max-width:900px;margin:0 auto}
.logo{font-weight:800;font-size:20px;color:var(--g);cursor:pointer;background:none;border:0;padding:0}
main{max-width:760px;margin:0 auto;padding:8px 20px 80px}
h1{font-size:28px;margin:12px 0 4px}h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
label{display:block;font-weight:600;margin:14px 0 6px}label:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;background:var(--g);color:#fff}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.sm{padding:6px 12px;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.steps{display:flex;gap:6px;margin:6px 0 18px;list-style:none;padding:0}
.steps li{flex:1;text-align:center;font-size:13px;color:var(--mut);padding-bottom:6px;border-bottom:4px solid var(--line)}
.steps li.on{color:var(--g);font-weight:700;border-color:var(--g)}.steps li.done{border-color:var(--g)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-weight:500}
.chk input{width:auto;margin-top:5px}
.chk small{display:block;color:var(--mut);font-weight:400}
.err{background:#fdecea;color:var(--warn);border-radius:10px;padding:10px 14px;margin:12px 0}
.ol{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.ol .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g2);color:var(--g);font-weight:700;display:grid;place-items:center;margin-top:8px}
.ol .f{flex:1}.ol input{font-weight:700;margin-bottom:6px}.ol textarea{min-height:56px}
.ol .t{display:flex;flex-direction:column;gap:2px}
.ib{border:0;background:none;cursor:pointer;font-size:16px;padding:2px 6px;color:var(--mut)}.ib:hover{color:var(--g)}.ib:disabled{opacity:.25}
.lrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}.lrow b{display:block}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--g2);color:var(--g);font-weight:600;white-space:nowrap}
.pill.w{background:#fdf2e6;color:var(--or)}.pill.e{background:#fdecea;color:var(--warn)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.saved{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.saved:first-child{border-top:0}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.th{border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;background:#fff;font:inherit;font-size:13px;text-align:center}
.th.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g2)}
.th .mini{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;margin-bottom:4px}

/* ============ diapositives (960×540, mises à l'échelle) ============ */
.fit{position:relative;overflow:hidden}
.sl{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;line-height:1.3}
.sl::before,.sl::after{content:"";position:absolute;background:var(--blob);z-index:0}
.sl::before{right:-130px;top:-120px;width:560px;height:470px;border-radius:58% 42% 52% 48%/48% 58% 42% 52%}
.sl::after{left:-150px;bottom:-190px;width:430px;height:360px;border-radius:46% 54% 60% 40%/55% 45% 55% 45%;opacity:.7}
.sl .in{position:absolute;inset:0;padding:42px 56px;z-index:1;display:flex;flex-direction:column}
.sl h2{font-size:42px;line-height:1.1;color:var(--ti);text-transform:uppercase;margin:0 0 20px;font-weight:800;letter-spacing:-.5px}
.sl ul.bl{margin:0;padding-left:28px;font-size:25px}.sl ul.bl li{margin:0 0 14px}
.sl .body{flex:1;display:flex;gap:30px;min-height:0}
.sl .txt{flex:1.15;min-width:0}
.sl .art{flex:1;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:22px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.06);align-self:center;aspect-ratio:4/3;overflow:hidden}
.sl .art svg{width:100%;height:100%}.sl .art .big{font-size:120px}
.sl .cards{display:grid;gap:14px;flex:1;align-content:start}
.sl .cd{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:16px;padding:12px 18px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.sl .num{flex:none;width:44px;height:44px;border-radius:10px;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center}
.sl .c0{background:var(--ac)}.sl .c1{background:var(--ac2)}.sl .c2{background:#d6336c}.sl .c3{background:#222}.sl .c4{background:#7e22ce}.sl .c5{background:#0891b2}
.sl .cd .tt{font-weight:800;font-size:22px}.sl .cd .xx{font-size:19px;opacity:.9}
.sl .cols{display:grid;gap:20px;flex:1;align-items:start}
.sl .col{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 4px 0 rgba(0,0,0,.06);height:100%}
.sl .col .num{margin-bottom:10px}.sl .col .tt{font-weight:800;font-size:22px;margin-bottom:6px}.sl .col .xx{font-size:19px}
.sl .tl{position:relative;flex:1;display:flex;align-items:flex-start;gap:14px;padding-top:70px}
.sl .tl::before{content:"";position:absolute;left:0;right:0;top:48px;height:5px;background:var(--ac);border-radius:3px}
.sl .ev{flex:1;position:relative;padding-top:22px}
.sl .ev::before{content:"";position:absolute;left:0;top:-30px;width:24px;height:24px;border-radius:50%;background:var(--card);border:6px solid var(--ac2)}
.sl .ev .tt{font-weight:800;font-size:21px;color:var(--ti);margin-bottom:6px}.sl .ev .xx{font-size:17px}
.sl .qt{margin:auto 0;text-align:center}.sl .qt .mark{font-size:120px;line-height:.6;color:var(--ac2);font-family:Georgia,serif}
.sl .qt blockquote{margin:0;font-size:36px;font-style:italic;font-weight:600}.sl .qt cite{display:block;margin-top:20px;font-size:22px;color:var(--ti);font-style:normal;font-weight:700}
.sl .hero{margin:auto 0;text-align:center}.sl .hero .em{font-size:90px}.sl .hero h2{font-size:54px;margin:8px 0 20px}
.sl .hero ul{display:inline-block;text-align:left;font-size:22px;margin:0;padding-left:24px}
.sl.act h2{font-size:30px;margin-bottom:10px}.sl .qq{font-size:26px;font-weight:600;margin:0 0 14px}
.sl .ch{display:flex;gap:16px;align-items:center;background:var(--card);border:3px solid transparent;border-radius:14px;padding:7px 14px;margin-bottom:9px;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.sl .ch.ok{border-color:#16a34a;background:#e7f7ec}.sl .ch.ko{opacity:.55}
.sl .why{margin-top:4px;padding:8px 16px;border-radius:14px;background:var(--card);border-left:6px solid #16a34a;font-size:18px}
.sl .vg{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;align-content:start}
.sl .vg div{background:var(--card);border-radius:14px;padding:12px 16px;font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.06)}.sl .vg b{display:block;color:var(--ti);font-size:21px}
.sl .tabs{display:flex;gap:8px;position:absolute;top:14px;right:18px;z-index:3}
.sl .tabs span{padding:6px 14px;border-radius:99px;font-size:15px;font-weight:700;background:var(--card);cursor:pointer;opacity:.7}.sl .tabs span.on{opacity:1;box-shadow:0 0 0 2px var(--ac)}
.edit [contenteditable]{outline:none;border-radius:6px;cursor:text}
.edit [contenteditable]:hover{box-shadow:0 0 0 2px rgba(0,0,0,.12)}.edit [contenteditable]:focus{box-shadow:0 0 0 2px var(--ac);background:rgba(255,255,255,.5)}
.edit .ch,.edit .num{cursor:pointer}

/* ============ studio & présentation ============ */
#studio,#show{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#f4f6f5}
#studio.on,#show.on{display:flex}
#show{background:#111}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--g);color:#fff;flex-wrap:wrap}
.top .btn{background:#fff;color:var(--g)}.top .btn.pri{background:#f59e0b;color:#111}
.top select{width:auto;padding:6px 10px;color:var(--ink)}
.top b{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbody{flex:1;display:grid;grid-template-columns:170px 1fr;min-height:0}
.thumbs{overflow:auto;padding:10px;background:#e9eeeb;display:flex;flex-direction:column;gap:10px}
.thumb{position:relative;cursor:pointer;border:3px solid transparent;border-radius:8px;background:#fff}
.thumb.on{border-color:var(--g)}
.thumb .k{position:absolute;left:6px;bottom:4px;z-index:5;font-size:12px;font-weight:700;background:#fff;border-radius:6px;padding:0 6px}
.thumb .fit{pointer-events:none;border-radius:5px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
.stage .fit{box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px;background:#fff;border-top:1px solid var(--line)}
.tools select{width:auto;padding:6px 10px}
.ask{display:flex;gap:8px;padding:8px 14px;background:#fff;border-top:1px solid var(--line)}
.ask input{flex:1}
.notesbox{padding:8px 14px 12px;background:#fff}.notesbox textarea{min-height:56px;font-size:14px}
.notesbox small{color:var(--mut)}
@media(max-width:700px){.sbody{grid-template-columns:1fr;grid-template-rows:1fr 90px}.thumbs{order:2;flex-direction:row}.thumb{width:120px;flex:none}}
#show .stage{padding:0}#show .stage .fit{box-shadow:none;border-radius:0}
.showbar{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5;opacity:.0;transition:opacity .2s}
#show:hover .showbar{opacity:1}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block}
#print h1{page-break-before:always;font-size:22px}#print h1:first-child{page-break-before:avoid}
#print .s{break-inside:avoid;margin:0 0 14px;padding-left:12px;border-left:4px solid var(--g)}}

header nav{display:flex;gap:18px;align-items:center}
header nav a{cursor:pointer;color:var(--ink);font-weight:500}header nav a:hover{color:var(--or)}
.chip{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--g);color:var(--g);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer}
.wide{max-width:1180px}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:900;line-height:1.15;margin:20px 0 8px}
.hero p{font-size:20px;font-weight:600;margin:0 0 28px}
.plans{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:stretch}@media(min-width:1000px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{display:flex;flex-direction:column;gap:12px;border:8px solid #ebeff2;border-radius:20px;padding:22px;background:#f7fafc;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.plan.max{background:#fff4f1}.plan.cur{border-color:var(--g)}
.plan h3{margin:0;font-size:28px;font-weight:900;text-transform:uppercase}
.plan .price{font-size:22px;font-weight:700}.plan .bill{min-height:24px;margin:0;color:var(--mut)}
.plan ul{list-style:none;padding:0;margin:6px 0 14px;flex:1}.plan li{display:flex;gap:8px;margin:10px 0}
.seg{display:inline-flex;background:#e5e7eb;border-radius:99px;padding:3px;box-shadow:inset 0 2px 0 rgba(0,0,0,.15)}
.seg button{white-space:nowrap;border:0;border-radius:99px;padding:5px 10px;font:inherit;font-size:14px;font-weight:600;background:none;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg small{white-space:nowrap;font-size:11px;background:#dbeafe;color:#1e40af;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:600}
.pbtn{width:100%;height:56px;border-radius:16px;border:1px solid transparent;font:inherit;font-size:18px;font-weight:900;cursor:pointer;background:var(--g);color:#fff;margin-top:auto}
.pbtn.out{background:transparent;color:var(--g);border-color:var(--g)}.pbtn:disabled{opacity:.55;cursor:default}
.pbtn.grad{border:4px solid #1fda71;box-shadow:0 0 0 0}
.schools{grid-column:1/-1;background:rgba(61,144,144,.07)}.schools h3{color:#3d9090}
.faq{margin:40px 0}.faq h2{color:#d90368;font-size:24px}
.faq details{border:1px solid rgba(0,0,0,.1);border-radius:14px;padding:12px 16px;margin-bottom:10px;background:#fff}
.faq summary{font-weight:700;font-size:18px;cursor:pointer}.faq p{margin:10px 0 0;font-size:17px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}#modal .box{background:#fff;border-radius:18px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
#modal h2{margin-bottom:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:12px;z-index:90;font-weight:600}
.lock{opacity:.6;cursor:pointer}.tag{font-size:11px;font-weight:800;background:#fdf2e6;color:var(--or);border-radius:6px;padding:1px 6px;margin-left:6px}
.sl .badge{position:absolute;right:16px;bottom:10px;z-index:4;font:700 13px var(--font);background:var(--card);color:var(--ti);padding:3px 10px;border-radius:99px;opacity:.9}
.sl .vid{flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}
.sl .vid iframe{width:100%;height:100%;border:0}.sl .vurl{margin-top:8px;font-size:15px;opacity:.8;word-break:break-all}
.sl .vurl [data-e]{display:inline-block;min-width:420px;border-bottom:2px dotted var(--ac)}.sl .vurl [data-e]:empty::before{content:"https://www.youtube.com/watch?v=…";opacity:.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fgrid label{margin:6px 0 2px;font-size:14px}.fgrid input[type=color]{padding:2px;height:38px}

body{background:#fff;font-family:Inter,system-ui,sans-serif;padding:8px}
body.home header{display:none}
#app.home{max-width:none;padding:0}
header{background:linear-gradient(#e6f4ec,#fff);border-radius:16px}
.th-hero{background:#409e9e;color:#fff;border-radius:28px;padding:22px 28px 56px;text-align:center;position:relative;overflow:hidden}
.th-hero::before{content:"";position:absolute;right:-120px;top:-140px;width:460px;height:460px;border-radius:50%;background:rgba(255,255,255,.07)}
.th-hero::after{content:"";position:absolute;left:-140px;bottom:-200px;width:420px;height:420px;border-radius:50%;background:rgba(0,0,0,.06)}
.th-hero>*{position:relative;z-index:1}
.hn{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1280px;margin:0 auto;padding:6px 8px}
.hn .l{display:flex;gap:28px;align-items:center}.hn a{color:#fff;font-size:18px;cursor:pointer;font-weight:500}.hn a:hover{opacity:.8}
.hn .r{display:flex;gap:12px;align-items:center}
.hn .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.ghostw{font:inherit;font-weight:800;font-size:16px;color:#fff;background:transparent;border:2px solid #fff;border-radius:16px;padding:10px 22px;cursor:pointer}
.ghostw:hover{background:#fff;color:#409e9e}
.wm{font:700 clamp(44px,7vw,76px)/1 Fredoka,Inter,sans-serif;margin:44px 0 18px;letter-spacing:-1px;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.th-hero h1{text-wrap:balance;font-size:clamp(32px,5.4vw,66px);line-height:1.15;font-weight:900;color:#0b1f1f;margin:0 auto;max-width:1000px}
.th-hero .sb{font-size:clamp(18px,2.4vw,28px);font-weight:700;color:#0b1f1f;margin:14px auto 30px;max-width:900px}
.hbar{display:flex;gap:8px;align-items:center;background:#fff;border-radius:26px;padding:10px;max-width:820px;margin:0 auto;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.hbar input{border:0;background:#f5f7f7;border-radius:18px;padding:16px 18px;font-size:18px;color:#111;flex:1;min-width:0}
.hbar input:focus{outline:2px solid #2c6e49}
.hbar .go{font:inherit;font-weight:900;font-size:20px;color:#fff;background:#2c6e49;border:0;border-radius:18px;padding:15px 26px;cursor:pointer;white-space:nowrap}
.hbar .go:hover{filter:brightness(1.12)}
.opts{display:flex;gap:10px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.opts select{width:auto;min-width:170px;border-radius:12px;border:0;font-weight:600;color:#0b1f1f}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:980px;margin:18px auto 0}
.chip2{font:inherit;font-weight:600;font-size:17px;color:#0b1f1f;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9);border-radius:99px;padding:8px 16px;cursor:pointer}
.chip2:hover{background:#fff}
.stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:34px;font-weight:700;font-size:17px;color:#fff}
.sec{max-width:1180px;margin:0 auto;padding:56px 20px 0}
.sec h2{font-size:clamp(26px,3.4vw,40px);font-weight:900;margin:0 0 6px;line-height:1.2}
.sec .eb{color:#d90368;font-weight:700;font-size:18px;margin:0 0 4px}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:24px}
.fc{background:#f7fafc;border:8px solid #ebeff2;border-radius:20px;padding:20px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.fc:nth-child(2){background:#fff4f1}.fc:nth-child(3){background:#f0f9f4}.fc:nth-child(4){background:#f4f1ff}
.fc .ic{font-size:38px}.fc h3{margin:8px 0 6px;font-size:22px;font-weight:900}.fc p{margin:0;font-size:16px;color:#374151}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
.mc{background:#fff;border:8px solid #ebeff2;border-radius:20px;padding:16px 18px;box-shadow:0 3px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;gap:8px}
.mc b{font-size:18px;line-height:1.25}.mc small{color:var(--mut)}.mc .row2{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.cta{max-width:1180px;margin:56px auto 0;background:#f0f9f4;border:8px solid #ebeff2;border-radius:24px;padding:36px 24px;text-align:center}
.cta h2{font-size:clamp(26px,3.4vw,40px);font-weight:900;margin:0 0 18px}.cta .btn{font-size:18px;padding:14px 26px;border-radius:16px;margin:4px}
.ft{background:#409e9e;color:#fff;border-radius:20px;margin-top:56px;padding:40px 28px 22px}
.ft .cols{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px}
.ft h4{font-size:22px;margin:0 0 12px}.ft a{display:block;color:#fff;margin:8px 0;cursor:pointer;font-size:16px}
.ft .bt{max-width:1180px;margin:28px auto 0;border-top:1px solid rgba(255,255,255,.25);padding-top:16px;font-size:14px}

</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fredoka:wght@400;700&family=Lora:wght@400;700&family=Nunito:wght@400;800&family=Playfair+Display:wght@400;800&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
</head>
<body>
<header><button class="logo" onclick="go('home')">📚 Séquences</button><nav><a onclick="go('home')">Accueil</a><a onclick="goPricing()">Tarifs</a><a onclick="openContact()">Contact</a><button class="chip" onclick="goPricing()"></button></nav></header>
<main id="app"></main>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="studio"></div>
<div id="show"></div>
<div id="print"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const KEY="sequences.v2";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}};
let warned=false;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{if(!warned){warned=true;alert("Espace de stockage du navigateur plein : supprimez d'anciennes séquences.");}}};
let saved=load();
const LEVELS=["Maternelle","CP","CE1","CE2","CM1","CM2","6e","5e","4e","3e","Seconde","Première","Terminale","Études supérieures","Adultes"];
const FW=[["standard","Standard : modélisation, pratique guidée"],["jfn","Je fais / Nous faisons / Tu fais"],["5e","5E : engager, explorer, expliquer…"],["rosenshine","Principes de Rosenshine"],["imr","Introduction / Activité / Bilan"]];
const THEMES={
  classique:{n:"Classique",bg:"#fdeee8",fg:"#1f2d3d",ti:"#0f766e",ac:"#0f766e",ac2:"#d68c45",card:"#ffffff",blob:"#fbd5c8",font:"'Trebuchet MS',system-ui,sans-serif"},
  menthe:{n:"Menthe",bg:"#e8f6ef",fg:"#16352a",ti:"#2c6e49",ac:"#2c6e49",ac2:"#d68c45",card:"#ffffff",blob:"#cdebdc",font:"'Segoe UI',system-ui,sans-serif"},
  ocean:{n:"Océan",bg:"#e6f1fb",fg:"#12263f",ti:"#1d4ed8",ac:"#1d4ed8",ac2:"#f59e0b",card:"#ffffff",blob:"#cfe3f8",font:"'Segoe UI',system-ui,sans-serif"},
  audacieux:{n:"Audacieux",bg:"#fff4c2",fg:"#1a1a1a",ti:"#e11d48",ac:"#e11d48",ac2:"#2563eb",card:"#ffffff",blob:"#ffe27a",font:"'Arial Black','Arial Bold',system-ui,sans-serif"},
  papier:{n:"Papier",bg:"#faf5ea",fg:"#3b2f22",ti:"#7c2d12",ac:"#7c2d12",ac2:"#0f766e",card:"#fffdf7",blob:"#efe3c8",font:"Georgia,'Times New Roman',serif"},
  violet:{n:"Violet",bg:"#f3e8ff",fg:"#2e1065",ti:"#7e22ce",ac:"#7e22ce",ac2:"#f97316",card:"#ffffff",blob:"#e4ccfb",font:"'Trebuchet MS',system-ui,sans-serif"},
  sombre:{n:"Sombre",bg:"#111827",fg:"#e5e7eb",ti:"#fbbf24",ac:"#fbbf24",ac2:"#60a5fa",card:"#1f2937",blob:"#1e293b",font:"'Segoe UI',system-ui,sans-serif"},
  mono:{n:"Mono",bg:"#ffffff",fg:"#111111",ti:"#111111",ac:"#111111",ac2:"#6b7280",card:"#f5f5f5",blob:"#eeeeee",font:"Arial,Helvetica,sans-serif"}
};
const allThemes=()=>({...THEMES,...((typeof S!=="undefined"&&S&&S.custom)||{})});
const FONTS=[["Trebuchet","'Trebuchet MS',system-ui,sans-serif"],["Segoe UI","'Segoe UI',system-ui,sans-serif"],["Georgia","Georgia,serif"],["Arial Black","'Arial Black',system-ui,sans-serif"],["Poppins","'Poppins',sans-serif"],["Nunito","'Nunito',sans-serif"],["Fredoka","'Fredoka',sans-serif"],["Lora","'Lora',serif"],["Playfair Display","'Playfair Display',serif"]];
const themeStyle=k=>{const t=allThemes()[k]||THEMES.classique;return `--bg:${t.bg};--fg:${t.fg};--ti:${t.ti};--ac:${t.ac};--ac2:${t.ac2};--card:${t.card};--blob:${t.blob};--font:${t.font}`;};
const LAYOUT_NAMES={title:"Titre",text_image:"Texte et image",list:"Liste",timeline:"Chronologie",steps:"Étapes",quote:"Citation",vocab:"Vocabulaire",activity:"Activité",video:"Vidéo YouTube"};
const PICK=["text_image","list","timeline","steps","quote"];

let S=null,step=1,msg="",page="";
const DEV=(()=>{try{let d=localStorage.getItem("seq.dev");if(!d){d=crypto.randomUUID();localStorage.setItem("seq.dev",d);}return d;}catch{return crypto.randomUUID();}})();
let PL=null;
const PNAME={free:"Gratuit",pro:"Pro",max:"Max"};
const CAP=()=>PL?.caps||{series:5,slides:12,curriculum:false,youtube:false,no_badge:false,custom_themes:false};
async function loadPlan(){try{const r=await fetch("/api/plan",{headers:{"X-Seq-Device":DEV}});if(r.ok)PL=await r.json();}catch{}chip();if(page==="pricing")pricing();}
function chip(){const s=PL?`${PNAME[PL.plan]} · ${PL.used}/${PL.limit} ${PL.days===7?"cette semaine":"ce mois-ci"}`:"Tarifs";document.querySelectorAll(".chip").forEach(c=>c.textContent=s);}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500);}
function modal(html){$("#modal").innerHTML=`<div class="box">${html}</div>`;$("#modal").classList.add("on");}
function closeModal(){$("#modal").classList.remove("on");}
const UPG={limit:["Limite atteinte","Vous avez utilisé toutes vos ressources. Passez à un plan supérieur pour en créer davantage."],
 series:["Séquences plus longues","Votre formule limite le nombre de leçons par séquence. Pro va jusqu'à 12 leçons, Max jusqu'à 25."],
 slides:["Leçons plus longues","Votre formule limite le nombre de diapositives par leçon. Pro va jusqu'à 25, Max jusqu'à 35."],
 curriculum:["Alignement sur les programmes","Disponible avec les plans Pro et Max."],
 youtube:["Vidéos YouTube","Ajoutez des vidéos à vos leçons avec les plans Pro et Max."],
 themes:["Thèmes et polices personnalisés","Créez vos propres thèmes et choisissez vos polices avec le plan Max."],
 badge:["Badge « Créé avec Séquences »","Retirez le badge avec les plans Pro et Max."]};
function openUpgrade(k,extra){const [h,d]=UPG[k]||UPG.limit;modal(`<h2>${h}</h2><p>${esc(extra||d)}</p><div class="nav"><button class="btn ghost" onclick="closeModal()">Plus tard</button><button class="btn" onclick="closeModal();goPricing()">Voir les plans</button></div>`);}
function goPricing(){closeStudio();closeShow();page="pricing";render();scrollTo(0,0);}
const blank=()=>({id:uid(),topic:"",level:"6e",language:"français",count:5,instructions:"",framework:"standard",theme:"classique",
  options:{objectives:true,vocabulary:true,quiz:true,images:true,slides:10},title:"",lessons:[]});

/* ---------- API ---------- */
async function api(path,body,method="POST"){
  const hdr={"Content-Type":"application/json","X-Seq-Device":DEV};
  const code=localStorage.getItem("seq.code");if(code)hdr["X-Seq-Code"]=code;
  let r=await fetch(path,{method,headers:hdr,body:JSON.stringify(body)});
  if(r.status===401){
    const c=prompt("Code d'accès :");if(!c)throw new Error("Code d'accès requis.");
    localStorage.setItem("seq.code",c);hdr["X-Seq-Code"]=c;
    r=await fetch(path,{method,headers:hdr,body:JSON.stringify(body)});
  }
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(d.error||"Erreur "+r.status);e.code=d.code;throw e;}
  return d;
}
const payload=()=>({curriculum:S.curriculum||"",topic:S.topic,level:S.level,language:S.language,instructions:S.instructions,framework:S.framework,options:S.options,title:S.title,
  lessons:S.lessons.map(l=>({title:l.title,summary:l.summary}))});

/* ---------- navigation ---------- */
function go(v){if(v==="home"){S=null;step=1;msg="";}page="";closeStudio();closeShow();render();}
function save(){const i=saved.findIndex(x=>x.id===S.id);i<0?saved.unshift(S):saved[i]=S;persist();}
function render(){const isHome=!S&&page==="";document.body.classList.toggle("home",isHome);$("#app").classList.toggle("home",isHome);$("#app").classList.toggle("wide",page==="pricing");if(page==="pricing")return pricing();if(!S)return home();if(step===5)return series();[null,s1,s2,s3,s4][step]();}
const stepsBar=()=>`<ol class="steps">${["Sujet","Réglages","Plan","Génération"].map((n,i)=>`<li class="${i+1===step?"on":i+1<step?"done":""}">${n}</li>`).join("")}</ol>`;
const errBox=()=>msg?`<div class="err">${esc(msg)}</div>`:"";

/* ---------- accueil ---------- */
const SUGG=[["☀️","Le système solaire"],["🌊","Le cycle de l'eau"],["🏛️","L'Empire romain"],["➗","Les fractions et les décimaux"],["🧬","La cellule"],["⚔️","Les Vikings"],["⚡","Électricité et circuits"],["📖","La poésie"],["🌍","Les volcans et les séismes"],["🥗","L'alimentation équilibrée"]];
const PH=["Le cycle de l'eau…","Les fractions…","La Révolution française…","La photosynthèse…","Le système solaire…"];
let phTimer=null;
function home(){
  $("#app").innerHTML=`<section class="th-hero">
   <div class="hn"><div class="l"><a onclick="go('home')">Accueil</a><a onclick="goPricing()">Tarifs</a><a onclick="openContact()">Contact</a></div><div class="r"><button class="chip" onclick="goPricing()"></button><button class="ghostw" onclick="loadExample()">Voir un exemple</button></div></div>
   <div class="wm">📚 Séquences</div>
   <h1>Votre meilleure séquence.<br>À chaque leçon.</h1>
   <p class="sb">Alignée sur le programme, adaptée à chaque élève, prête en quelques minutes.</p>
   <form class="hbar" onsubmit="heroGo(event)"><input id="hq" maxlength="300" placeholder="${PH[0]}" aria-label="Sujet de la séquence"><button class="go" type="submit">✨ Créer</button></form>
   <div class="opts"><select id="hl" aria-label="Niveau">${LEVELS.map(l=>`<option ${l==="6e"?"selected":""}>${l}</option>`).join("")}</select><select id="hg" aria-label="Langue">${["français","anglais","arabe","espagnol","allemand"].map(l=>`<option>${l}</option>`).join("")}</select></div>
   <div class="chips">${SUGG.map(([e,s])=>`<button class="chip2" onclick="heroGo(null,'${s.replace(/'/g,"\\'")}')">${e} ${s}</button>`).join("")}</div>
   <div class="stats"><span>Séquences complètes</span><span>•</span><span>Diapositives illustrées</span><span>•</span><span>Export PowerPoint</span></div>
  </section>
  ${saved.length?`<section class="sec"><h2>Mes séquences</h2><div class="mine">${saved.map(x=>`<div class="mc"><b>${esc(x.title||x.topic)}</b><small>${esc(x.level)} · ${x.lessons.length} leçons · ${x.lessons.filter(l=>l.slides).length} prêtes</small><div class="row2"><button class="btn sm" onclick="openS('${x.id}')">Ouvrir</button><button class="ib" title="Supprimer" onclick="del('${x.id}')">🗑</button></div></div>`).join("")}</div></section>`:""}
  <section class="sec"><p class="eb">Ce que vous pouvez créer</p><h2>Des leçons que vous rêviez de donner</h2>
   <div class="fcards">
    <div class="fc"><div class="ic">🗂️</div><h3>Séquences</h3><p>Une série complète planifiée en une seule fois. Chaque leçon s'appuie sur la précédente.</p></div>
    <div class="fc"><div class="ic">🎨</div><h3>Diapositives illustrées</h3><p>Thèmes, schémas et mises en page variées, modifiables en un clic ou avec l'aide de l'IA.</p></div>
    <div class="fc"><div class="ic">✅</div><h3>Quiz et notes</h3><p>Des questions corrigées et des notes de l'enseignant sur chaque leçon.</p></div>
    <div class="fc"><div class="ic">⬇️</div><h3>Export</h3><p>PowerPoint, Google Slides ou PDF, pour enseigner avec l'outil de votre choix.</p></div>
   </div></section>
  <section class="cta"><h2>Essayez Séquences dès aujourd'hui</h2><button class="btn" onclick="document.getElementById('hq').focus();scrollTo({top:0,behavior:'smooth'})">Créer une séquence</button><button class="btn ghost" onclick="loadExample()">Voir un exemple</button></section>
  <footer class="ft"><div class="cols"><div><h4>Liens utiles</h4><a onclick="go('home')">Accueil</a><a onclick="goPricing()">Tarifs</a><a onclick="openContact()">Contact</a></div>
   <div><h4>Fonctionnalités</h4><a onclick="loadExample()">Séquences de leçons</a><a onclick="loadExample()">Diapositives illustrées</a><a onclick="goPricing()">Thèmes personnalisés</a></div></div>
   <div class="bt">Séquences 2026</div></footer>`;
  chip();clearInterval(phTimer);let k=0;
  phTimer=setInterval(()=>{const q=$("#hq");if(!q){clearInterval(phTimer);return;}k=(k+1)%PH.length;q.placeholder=PH[k];},2600);
}
function heroGo(e,topic){
  if(e)e.preventDefault();
  const q=$("#hq"),v=(topic||q.value).trim();
  if(!v){q.placeholder="Ajoutez un sujet ou choisissez une suggestion ci-dessous";q.focus();return;}
  const lv=$("#hl").value,lg=$("#hg").value;
  S=blank();S.topic=v;S.level=lv;S.language=lg;step=1;msg="";render();
}
async function loadExample(){
  try{const d=await (await fetch("/exemple.json")).json();d.id=uid();d.title+=" (exemple)";S=d;step=5;msg="";save();render();}
  catch{alert("Exemple indisponible.");}
}
function openS(id){S=saved.find(x=>x.id===id);step=S.started?5:3;msg="";render();}
function del(id){if(confirm("Supprimer cette séquence ?")){saved=saved.filter(x=>x.id!==id);persist();render();}}

/* ---------- étape 1 : sujet ---------- */
function s1(){
  $("#app").innerHTML=`${stepsBar()}<h2>Choisissez le sujet de votre séquence</h2><p class="sub">Soyez aussi précis que vous voulez.</p>
  <div class="card"><label>Sujet de la séquence</label><input id="topic" maxlength="300" placeholder="Ex. Le système solaire, les fractions, la Révolution française…" value="${esc(S.topic)}">
  <div class="row"><div><label>Niveau</label><select id="level">${LEVELS.map(l=>`<option ${l===S.level?"selected":""}>${l}</option>`).join("")}</select></div>
  <div><label>Langue</label><select id="lang">${["français","anglais","arabe","espagnol","allemand"].map(l=>`<option ${l===S.language?"selected":""}>${l}</option>`).join("")}</select></div></div>
  <label>Nombre de leçons</label><select id="count">${[2,3,4,5,6,7,8,9,10,12,15,20,25].map(n=>`<option ${n==S.count?"selected":""} ${n>CAP().series?"disabled":""}>${n}${n>CAP().series?" 🔒":""}</option>`).join("")}</select>
  <small style="color:var(--mut)">Votre formule : séquences jusqu'à ${CAP().series} leçons. <a href="#" onclick="goPricing();return false">Voir les plans</a></small>
  <label>Consignes supplémentaires <small style="font-weight:400;color:var(--mut)">(facultatif)</small></label><textarea id="ins" maxlength="3000" placeholder="Thèmes à aborder, contraintes, programme à suivre…">${esc(S.instructions)}</textarea></div>
  ${errBox()}<div class="nav"><button class="btn ghost" onclick="go('home')">Annuler</button><button class="btn" onclick="from1()">Continuer</button></div>`;
}
function read1(){S.topic=$("#topic").value.trim();S.level=$("#level").value;S.language=$("#lang").value;S.count=Math.min(parseInt($("#count").value),CAP().series);S.instructions=$("#ins").value.trim();}
function from1(){read1();if(!S.topic){msg="Saisissez un sujet.";return s1();}msg="";step=2;render();}

/* ---------- étape 2 : réglages ---------- */
function themePicker(cur,fn){
  return `<div class="themes">${Object.entries(allThemes()).map(([k,t])=>`<button class="th ${k===cur?"on":""}" onclick="${fn}('${k}')"><div class="mini fit" style="${themeStyle(k)};background:var(--bg)"><div style="position:absolute;right:-12%;top:-30%;width:60%;height:90%;background:var(--blob);border-radius:50%"></div><div style="position:absolute;left:12%;top:24%;font:800 13px var(--font);color:var(--ti)">TITRE</div><div style="position:absolute;left:12%;top:52%;width:45%;height:8px;background:var(--fg);opacity:.5;border-radius:4px"></div><div style="position:absolute;left:12%;top:70%;width:30%;height:8px;background:var(--ac2);border-radius:4px"></div></div>${esc(t.n)}</button>`).join("")}<button class="th ${CAP().custom_themes?"":"lock"}" onclick="newTheme()"><div class="mini" style="display:grid;place-items:center;background:#f3f4f6;font-size:26px">＋</div>Personnalisé${CAP().custom_themes?"":'<span class="tag">MAX</span>'}</button></div>`;
}
function pickTheme(k){read2();S.theme=k;s2();}
function s2(){
  const o=S.options;
  $("#app").innerHTML=`${stepsBar()}<h2>Affinez votre séquence</h2><p class="sub">Tout est facultatif, on s'occupe du reste.</p>
  <div class="card"><label>Thème</label>${themePicker(S.theme,"pickTheme")}
  <label>Cadre de leçon</label><select id="fw">${FW.map(([v,t])=>`<option value="${v}" ${v===S.framework?"selected":""}>${t}</option>`).join("")}</select>
  <label>Diapositives par leçon</label><select id="sl">${[6,8,10,12,15,20,25,30,35].map(n=>`<option value="${n}" ${n==o.slides?"selected":""} ${n>CAP().slides?"disabled":""}>${n}${n>CAP().slides?" 🔒":""}</option>`).join("")}</select>
  <label onclick="if(!CAP().curriculum)openUpgrade('curriculum')">Alignement sur le programme${CAP().curriculum?"":'<span class="tag">PRO</span>'}</label>
  <input id="cur" maxlength="200" placeholder="Ex. Programme officiel, cycle 3 — sciences et technologie" value="${esc(S.curriculum||"")}" ${CAP().curriculum?"":'readonly onclick="openUpgrade(\'curriculum\')" class="lock"'}>
  <label>Contenu à inclure</label>
  <label class="chk"><input type="checkbox" id="o4" ${o.images?"checked":""}><span>Illustrations<small>Schémas dessinés par l'IA sur les diapositives (génération un peu plus longue)</small></span></label>
  <label class="chk"><input type="checkbox" id="o1" ${o.objectives?"checked":""}><span>Objectifs d'apprentissage<small>Ce que les élèves sauront à la fin</small></span></label>
  <label class="chk"><input type="checkbox" id="o2" ${o.vocabulary?"checked":""}><span>Vocabulaire clé<small>Mots importants avec leur définition</small></span></label>
  <label class="chk"><input type="checkbox" id="o3" ${o.quiz?"checked":""}><span>Quiz de fin de leçon<small>4 questions à choix multiples avec explications</small></span></label></div>
  ${errBox()}<div class="nav"><button class="btn ghost" onclick="read2();step=1;render()">Retour</button><button class="btn" id="go" onclick="outline()">Générer le plan</button></div>`;
}
function read2(){S.framework=$("#fw").value;if(CAP().curriculum)S.curriculum=$("#cur").value.trim();S.options={objectives:$("#o1").checked,vocabulary:$("#o2").checked,quiz:$("#o3").checked,images:$("#o4").checked,slides:Math.min(+$("#sl").value,CAP().slides)};}
async function outline(){
  read2();msg="";const b=$("#go");b.disabled=true;b.innerHTML='<span class="spin"></span> Création du plan…';
  try{
    const d=await api("/api/outline",{topic:S.topic,level:S.level,language:S.language,instructions:S.instructions,count:S.count});
    S.title=d.title;S.lessons=d.lessons.map(l=>({...l}));step=3;save();render();
  }catch(e){msg=e.message;s2();}
}

/* ---------- étape 3 : plan ---------- */
function s3(){
  const n=S.lessons.length;
  $("#app").innerHTML=`${stepsBar()}<h2>Vérifiez le plan</h2><p class="sub">Modifiez les titres et les résumés, réordonnez, supprimez ou ajoutez des leçons.</p>
  <div class="card"><label>Titre de la séquence</label><input id="st" value="${esc(S.title)}" oninput="S.title=this.value">
  <label>Leçons</label>${S.lessons.map((l,i)=>`<div class="ol"><div class="n">${i+1}</div><div class="f"><input value="${esc(l.title)}" oninput="S.lessons[${i}].title=this.value" placeholder="Titre de la leçon"><textarea oninput="S.lessons[${i}].summary=this.value" placeholder="Ce que couvre cette leçon">${esc(l.summary)}</textarea></div>
  <div class="t"><button class="ib" ${i?"":"disabled"} onclick="mv(${i},-1)" title="Monter">▲</button><button class="ib" ${i<n-1?"":"disabled"} onclick="mv(${i},1)" title="Descendre">▼</button><button class="ib" ${n>2?"":"disabled"} onclick="rm(${i})" title="Supprimer">🗑</button></div></div>`).join("")}
  <button class="btn sm ghost" onclick="add()">＋ Ajouter une leçon</button> <small style="color:var(--mut)">${n}/${CAP().series}</small></div>
  ${errBox()}<div class="nav"><button class="btn ghost" onclick="step=2;render()">Retour</button><button class="btn" onclick="start()">Générer la séquence</button></div>`;
}
function mv(i,d){const a=S.lessons;[a[i],a[i+d]]=[a[i+d],a[i]];s3();}
function rm(i){S.lessons.splice(i,1);s3();}
function add(){if(S.lessons.length>=CAP().series){openUpgrade("series");return;}S.lessons.push({title:"",summary:""});s3();}
function start(){
  if(S.lessons.some(l=>!l.title.trim())){msg="Donnez un titre à chaque leçon.";return s3();}
  S.lessons.forEach(l=>{l.title=l.title.trim();delete l.slides;delete l.err;});
  msg="";S.started=true;step=4;save();render();generate();
}

/* ---------- étape 4 : génération ---------- */
let running=false;
function buildSlides(d){
  const out=[{layout:"title",title:d.title,emoji:"📖",bullets:d.objectives||[],notes:"",items:[]}];
  d.slides.forEach(x=>out.push(x));
  const v=d.vocabulary||[];
  for(let i=0;i<v.length;i+=6)out.push({layout:"vocab",title:"Vocabulaire clé",vocab:v.slice(i,i+6),bullets:[],items:[],notes:""});
  (d.quiz||[]).forEach((q,i)=>out.push({layout:"activity",title:`Vérification des acquis ${i+1}/${d.quiz.length}`,q,bullets:[],items:[],notes:""}));
  out.forEach(x=>x.id=uid());

}
function s4(){

  ${S.lessons.some(l=>l.err)?`<div class="err">${esc(S.lessons.find(l=>l.err).err)}</div>`:""}</div>

async function generate(){
  if(running)return;running=true;
  for(let i=0;i<S.lessons.length;i++){
    const l=S.lessons[i];if(l.slides)continue;
    l.busy=true;delete l.err;if(step===4)s4();
    try{const d=await api("/api/lesson",{...payload(),index:i});l.slides=buildSlides(d);}
    catch(e){l.err=e.message;
      if(e.code==="limit"){l.busy=false;openUpgrade("limit",e.message);break;}
      if(["access","no_key","rate_limited","device"].includes(e.code)){l.busy=false;break;}}
    l.busy=false;save();loadPlan();if(step===4)s4();
  }

}

const ytId=u=>(String(u||"").match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/)||[])[1];
const ITEM_LAYOUTS=["list","timeline","steps"];
function normalize(sl){
  sl.bullets=sl.bullets||[];sl.items=sl.items||[];
  if(ITEM_LAYOUTS.includes(sl.layout)&&!sl.items.length)sl.items=sl.bullets.map(b=>({t:b,x:""}));
  if(sl.layout==="text_image"&&!sl.bullets.length)sl.bullets=sl.items.map(i=>i.x?`${i.t} : ${i.x}`:i.t);
  if(sl.layout==="video"&&sl.url===undefined)sl.url="";
  if(sl.layout==="vocab"&&!sl.vocab)sl.vocab=[{term:"Mot",definition:"Définition"}];
  if(sl.layout==="activity"&&!sl.q)sl.q={q:"Question ?",choices:["Réponse A","Réponse B","Réponse C","Réponse D"],answer:0,why:""};
  return sl;
}
function slideHTML(sl,o={}){
  const ed=o.edit,E=(p,txt,tag="span",cls="")=>`<${tag} class="${cls}" ${ed?`contenteditable="plaintext-only" data-e="${p}"`:""}>${esc(txt)}</${tag}>`;
  const t=sl.title!==undefined?E("title",sl.title,"h2"):"";
  let b="";
  switch(sl.layout){
    case "title":
      b=`<div class="hero"><div class="em">${esc(sl.emoji||"📖")}</div>${t}${sl.bullets.length?`<ul>${sl.bullets.map((x,i)=>`<li>${E("bullets."+i,x)}</li>`).join("")}</ul>`:""}</div>`;break;
    case "list":
      b=`${t}<div class="cards">${sl.items.map((it,i)=>`<div class="cd"><div class="num c${i%6}">${i+1}</div><div><div class="tt">${E("items."+i+".t",it.t)}</div><div class="xx">${E("items."+i+".x",it.x)}</div></div></div>`).join("")}</div>`;break;
    case "steps":
      b=`${t}<div class="cols" style="grid-template-columns:repeat(${Math.max(sl.items.length,1)},1fr)">${sl.items.map((it,i)=>`<div class="col"><div class="num c${i%6}">${i+1}</div><div class="tt">${E("items."+i+".t",it.t)}</div><div class="xx">${E("items."+i+".x",it.x)}</div></div>`).join("")}</div>`;break;
    case "timeline":
      b=`${t}<div class="tl">${sl.items.map((it,i)=>`<div class="ev"><div class="tt">${E("items."+i+".t",it.t)}</div><div class="xx">${E("items."+i+".x",it.x)}</div></div>`).join("")}</div>`;break;
    case "quote":
      b=`<div class="qt"><div class="mark">“</div><blockquote>${E("quote",sl.quote)}</blockquote><cite>${E("author",sl.author)}</cite></div>${sl.title?`<div style="text-align:center;opacity:.6">${E("title",sl.title)}</div>`:""}`;break;
    case "vocab":
      b=`${t}<div class="vg">${sl.vocab.map((v,i)=>`<div><b>${E("vocab."+i+".term",v.term)}</b>${E("vocab."+i+".definition",v.definition,"span")}</div>`).join("")}</div>`;break;
    case "activity":{
      const rev=o.tab==="a",q=sl.q;
      b=`${t}<p class="qq">${E("q.q",q.q)}</p>${q.choices.map((c,i)=>`<div class="ch ${rev?(i===q.answer?"ok":"ko"):""}" ${ed&&rev?`data-ans="${i}" title="Cliquer pour marquer comme bonne réponse"`:""}><div class="num c${i%4}" ${ed&&rev?"":'style="pointer-events:none"'}>${i+1}</div>${E("q.choices."+i,c)}${rev&&i===q.answer?" ✓":""}</div>`).join("")}${rev?`<div class="why"><b>Explication :</b> ${E("q.why",q.why)}</div>`:""}`;break;}
    case "video":{
      const id=ytId(sl.url);
      b=`${t}<div class="vid">${o.thumb?"▶":id?`<iframe src="https://www.youtube-nocookie.com/embed/${id}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`:"Collez un lien YouTube ci-dessous"}</div>${ed?`<div class="vurl">Lien : ${E("url",sl.url||"")}</div>`:""}`;break;}
    default:
      b=`${t}<div class="body"><div class="txt"><ul class="bl">${sl.bullets.map((x,i)=>`<li>${E("bullets."+i,x)}</li>`).join("")}</ul></div><div class="art">${sl.svg?sl.svg:`<div class="big">${esc(sl.emoji||"💡")}</div>`}</div></div>`;
  }
  const tabs=sl.layout==="activity"?`<div class="tabs"><span data-tab="q" class="${o.tab!=="a"?"on":""}">Question</span><span data-tab="a" class="${o.tab==="a"?"on":""}">Réponse</span></div>`:"";
  return `<div class="sl ${ed?"edit":""} ${sl.layout==="activity"?"act":""}" style="${themeStyle(o.theme)}">${tabs}<div class="in">${b}</div>${CAP().no_badge?"":'<div class="badge">Créé avec Séquences</div>'}</div>`;
}

const svgPng=svg=>new Promise(res=>{
  const src=svg.includes("xmlns")?svg:svg.replace("<svg",'<svg xmlns="http://www.w3.org/2000/svg"'),img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=800;c.height=600;c.getContext("2d").drawImage(img,0,0,800,600);res(c.toDataURL("image/png"));};
  img.onerror=()=>res(null);img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(src);
});
async function pptxSlide(pptx,sl,th){

  const cols=[th.ac,th.ac2,"#D6336C","#222222","#7E22CE","#0891B2"].map(hx);
  const s=pptx.addSlide();s.background={color:hx(th.bg)};
  s.addShape("ellipse",{x:6.6,y:-1.8,w:5.2,h:4.2,fill:{color:hx(th.blob)},line:{color:hx(th.blob)}});
  const T=(txt,o)=>s.addText(txt,{fontFace:font,color:hx(th.fg),...o});
  const card=(x,y,w,h)=>s.addShape("roundRect",{x,y,w,h,fill:{color:hx(th.card)},line:{color:hx(th.blob),width:1},rectRadius:.12});
  const badge=(x,y,n,i,sz=.5)=>{s.addShape("roundRect",{x,y,w:sz,h:sz,fill:{color:cols[i%6]},line:{color:cols[i%6]},rectRadius:.08});T(String(n),{x,y,w:sz,h:sz,align:"center",valign:"middle",bold:true,color:"FFFFFF",fontSize:16});};
  let notes=sl.notes||"";
  if(!["quote","title"].includes(sl.layout))T((sl.title||"").toUpperCase(),{x:.5,y:.3,w:9,h:.9,fontSize:28,bold:true,color:hx(th.ti),valign:"middle"});
  const items=sl.items||[];
  switch(sl.layout){
    case "title":
      T(sl.emoji||"📖",{x:0,y:.5,w:10,h:1.2,fontSize:54,align:"center"});
      T((sl.title||"").toUpperCase(),{x:.5,y:1.7,w:9,h:1.2,fontSize:36,bold:true,color:hx(th.ti),align:"center",valign:"middle"});
      if(sl.bullets?.length)T(sl.bullets.map(b=>({text:b,options:{bullet:true,breakLine:true}})),{x:2,y:3.1,w:6,h:2,fontSize:16,valign:"top"});break;
    case "list":{const n=Math.max(items.length,1),h=Math.min(.85,3.7/n);
      items.forEach((it,i)=>{const y=1.4+i*(h+.1);card(.5,y,9,h);badge(.65,y+(h-.5)/2,i+1,i);T([{text:it.t,options:{bold:true,breakLine:true,fontSize:16}},{text:it.x||"",options:{fontSize:13}}],{x:1.3,y,w:8.1,h,valign:"middle"});});break;}
    case "steps":{const n=Math.max(items.length,1),w=(9-.2*(n-1))/n;
      items.forEach((it,i)=>{const x=.5+i*(w+.2);card(x,1.5,w,3.4);badge(x+.15,1.65,i+1,i);T([{text:it.t,options:{bold:true,breakLine:true,fontSize:16}},{text:it.x||"",options:{fontSize:13}}],{x:x+.1,y:2.3,w:w-.2,h:2.5,valign:"top"});});break;}
    case "timeline":{const n=Math.max(items.length,1),w=9/n;
      s.addShape("rect",{x:.5,y:2.1,w:9,h:.06,fill:{color:cols[0]},line:{color:cols[0]}});
      items.forEach((it,i)=>{const x=.5+i*w;s.addShape("ellipse",{x:x+.05,y:1.95,w:.35,h:.35,fill:{color:hx(th.card)},line:{color:cols[1],width:3}});T([{text:it.t,options:{bold:true,breakLine:true,fontSize:15,color:hx(th.ti)}},{text:it.x||"",options:{fontSize:12}}],{x,y:2.5,w:w-.1,h:2.4,valign:"top"});});break;}
    case "quote":
      T(`“${sl.quote||""}”`,{x:1,y:1,w:8,h:2.8,fontSize:28,italic:true,align:"center",valign:"middle"});
      T("— "+(sl.author||""),{x:1,y:3.9,w:8,h:.6,fontSize:18,bold:true,color:hx(th.ti),align:"center"});break;
    case "vocab":
      (sl.vocab||[]).forEach((v,i)=>{const x=.5+(i%2)*4.6,y=1.4+Math.floor(i/2)*1.25;card(x,y,4.4,1.1);T([{text:v.term,options:{bold:true,breakLine:true,fontSize:15,color:hx(th.ti)}},{text:v.definition,options:{fontSize:12}}],{x:x+.1,y,w:4.2,h:1.1,valign:"middle"});});break;
    case "activity":{const q=sl.q;
      T(q.q,{x:.5,y:1.3,w:9,h:.9,fontSize:20,bold:true,valign:"middle"});
      q.choices.forEach((c,i)=>{const y=2.3+i*.62;card(.5,y,9,.52);badge(.58,y+.03,i+1,i,.46);T(c,{x:1.2,y,w:8.2,h:.52,fontSize:15,valign:"middle"});});
      notes=(notes?notes+"\n\n":"")+`Réponse : ${q.answer+1}. ${q.choices[q.answer]}${q.why?" — "+q.why:""}`;break;}
    case "video":
      T("Vidéo YouTube",{x:.5,y:1.5,w:9,h:.6,fontSize:20,bold:true});
      if(sl.url)T([{text:sl.url,options:{hyperlink:{url:sl.url}}}],{x:.5,y:2.2,w:9,h:.6,fontSize:18,color:"0563C1"});break;
    default:{
      T((sl.bullets||[]).map(b=>({text:b,options:{bullet:true,breakLine:true}})),{x:.5,y:1.4,w:5.3,h:3.6,fontSize:18,valign:"top",paraSpaceAfter:8});
      card(6.1,1.5,3.4,2.55);
      const png=sl.svg?await svgPng(sl.svg):null;
      if(png)s.addImage({data:png,x:6.2,y:1.55,w:3.2,h:2.4});else T(sl.emoji||"💡",{x:6.1,y:1.6,w:3.4,h:2.3,fontSize:70,align:"center",valign:"middle"});}
  }
  if(!CAP().no_badge)T("Créé avec Séquences",{x:7,y:5.2,w:2.8,h:.3,fontSize:10,align:"right",color:hx(th.ti)});
  if(notes)s.addNotes(notes);
}
async function exportPptx(li){
  if(typeof PptxGenJS==="undefined")return alert("La bibliothèque d'export n'a pas pu se charger. Vérifiez votre connexion et rechargez la page.");
  const th=allThemes()[S.theme]||THEMES.classique,pptx=new PptxGenJS();pptx.layout="LAYOUT_16x9";pptx.title=S.title;
  const lessons=li==null?S.lessons.filter(l=>l.slides):[S.lessons[li]];
  toast("Création du fichier PowerPoint…");
  try{
    for(const l of lessons)for(const sl of l.slides)await pptxSlide(pptx,normalize(sl),th);
    const name=((li==null?S.title:S.lessons[li].title)||"sequence").replace(/[^\p{L}\p{N} _-]/gu,"").trim().slice(0,60)||"sequence";
    await pptx.writeFile({fileName:name+".pptx"});
  }catch(e){alert("Export impossible : "+e.message);}
}

/* ============ page Tarifs ============ */
const BILL={pro:"annual",max:"annual"};
const EUR=n=>n.toFixed(2).replace(".",",")+" €";
const PR={pro:{monthly:9.99,annual:6.65},max:{monthly:18.99,annual:12.49}};
function setBill(p,b){BILL[p]=b;pricing();}
function pricing(){
  const cur=PL?.plan||"free",pr=PL?.prices||PR;
  const feats=a=>`<ul>${a.map(x=>`<li><span>✅</span><span>${x}</span></li>`).join("")}</ul>`;
  const paid=(p,name,list,grad)=>{
    const b=BILL[p],price=pr[p][b],mine=cur===p;
    return `<div class="plan ${p} ${mine?"cur":""}"><h3>${name}</h3>
    <div><div class="price">${EUR(price)}/mois</div><p class="bill">${b==="annual"?EUR(price*12)+" facturé annuellement":""}</p></div>
    <div class="seg"><button class="${b==="monthly"?"on":""}" onclick="setBill('${p}','monthly')">Mensuel</button><button class="${b==="annual"?"on":""}" onclick="setBill('${p}','annual')">Annuel<small>💰 4 mois offerts</small></button></div>
    ${feats(list)}
    <button class="pbtn ${grad?"grad":""}" ${mine?"disabled":""} onclick="subscribe('${p}')">${mine?"Votre plan actuel":"Passer à "+name.toUpperCase()}</button>
    ${mine&&PL?`<p class="bill" style="text-align:center">${PL.cancelled?"Prend fin":"Actif"} jusqu'au ${new Date(PL.until*1000).toLocaleDateString("fr-FR")}${PL.cancelled?"":` · <a href="#" onclick="cancelPlan();return false">Annuler</a>`}</p>`:""}</div>`;};
  const demo=PL?.payment==="demo";
  $("#app").innerHTML=`<section class="hero"><h1>Choisissez le plan qui vous convient</h1><p>Un moyen simple et abordable de gagner des heures de votre temps. ⏳</p></section>
  ${demo?`<div class="err" style="background:#fff7e6;color:#8a5a00">Phase de test : les plans Pro et Max s'activent sans paiement.</div>`:""}
  <div class="plans">
   <div class="plan ${cur==="free"?"cur":""}"><h3>Gratuit</h3><div class="price">0,00 €/mois</div>${feats(["Aucune carte requise","Créez des leçons et des activités","Exportation vers Google &amp; Microsoft","Créez 5 ressources chaque semaine"])}
    <button class="pbtn" onclick="go('home')">Commencer</button></div>
   ${paid("pro","Pro",["Alignement sur les programmes","Supprimer le badge « Séquences »","Ajoutez des vidéos YouTube","Créez 200 ressources par mois","Séquences jusqu'à 12 leçons","Leçons jusqu'à 25 diapositives"])}
   ${paid("max","Max",["Thèmes et polices personnalisés","Créez 400 ressources par mois","Séquences jusqu'à 25 leçons","Leçons jusqu'à 35 diapositives"],true)}
   <div class="plan schools"><div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between"><div><h3>Écoles</h3><div class="price" style="margin-top:10px">Discutons</div></div>
    <ul style="flex:1;min-width:260px;margin:0">${["Leçons personnalisées","Comptes enseignants liés","Contrôles et suivi administrateur","Facturation centralisée"].map(x=>`<li><span>✅</span><span>${x}</span></li>`).join("")}</ul>
    <button class="pbtn out" style="width:auto;padding:0 28px" onclick="openContact(true)">Contactez-nous</button></div></div>
  </div>
  <section class="faq"><h2>Foire aux questions...</h2>
   <details><summary>Puis-je annuler ou modifier mon abonnement à tout moment ?</summary><p>Oui ! Vous pouvez modifier, mettre à niveau ou annuler à tout moment. Les modifications prennent effet à la fin de votre période de facturation en cours.</p></details>
   <details><summary>Quels modes de paiement acceptez-vous ?</summary><p>${demo?"Le paiement en ligne n'est pas encore ouvert : pendant la phase de test, les plans Pro et Max s'activent sans paiement.":"Les abonnements ouvriront bientôt. Écrivez-nous via la page Contact pour être prévenu."}</p></details>
   <details><summary>Combien de leçons puis-je créer avec le plan gratuit ?</summary><p>Vous pouvez créer jusqu'à 5 leçons complètes tous les 7 jours. Celles-ci peuvent être des leçons ou faire partie d'une séquence de leçons.</p></details>
   <details><summary>Qu'advient-il de mes leçons si j'annule mon abonnement Pro ou Max ?</summary><p>Rien ! Vous pouvez toujours accéder à toutes les leçons que vous avez déjà créées. Vous perdrez simplement l'accès aux fonctionnalités Pro ou Max, selon votre abonnement.</p></details>
  </section>`;
}
async function subscribe(p){
  if(PL?.payment!=="demo")return modal(`<h2>Bientôt disponible</h2><p>Les abonnements ne sont pas encore ouverts. Laissez-nous un message et nous vous préviendrons.</p><div class="nav"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" onclick="closeModal();openContact()">Nous écrire</button></div>`);
  if(!confirm(`Phase de test : aucun paiement n'est demandé. Activer le plan ${PNAME[p]} (${BILL[p]==="annual"?"annuel":"mensuel"}) ?`))return;
  try{PL=await api("/api/plan/subscribe",{plan:p,billing:BILL[p]});chip();pricing();toast(`Plan ${PNAME[p]} activé`);}catch(e){alert(e.message);}
}
async function cancelPlan(){
  if(!confirm("Annuler l'abonnement ? Il reste actif jusqu'à la fin de la période en cours."))return;
  try{PL=await api("/api/plan/cancel",{});chip();pricing();toast("Abonnement annulé : il prendra fin à l'échéance");}catch(e){alert(e.message);}
}
function openContact(school){
  modal(`<h2>${school?"Contactez-nous pour votre établissement":"Contact"}</h2><p class="sub">Nous répondons sous 24 h.</p>
  <label>Nom</label><input id="ct_name"><label>E-mail</label><input id="ct_email" type="email">
  ${school?`<label>Établissement</label><input id="ct_school"><label>Nombre de licences</label><input id="ct_lic" placeholder="Au moins 5">`:""}
  <label>Message</label><textarea id="ct_msg" maxlength="2000"></textarea><div id="ct_err"></div>
  <div class="nav"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="ct_go" onclick="sendContact()">Envoyer</button></div>`);
}
async function sendContact(){
  const v=i=>($("#"+i)?.value||"").trim(),b=$("#ct_go");b.disabled=true;
  try{await api("/api/contact",{name:v("ct_name"),email:v("ct_email"),school:v("ct_school")||"(non précisé)",licenses:v("ct_lic"),message:v("ct_msg")});closeModal();toast("Message envoyé, merci !");}
  catch(e){$("#ct_err").innerHTML=`<div class="err">${esc(e.message)}</div>`;b.disabled=false;}
}
render();loadPlan();
