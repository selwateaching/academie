<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séquences — créez une série de leçons</title>
<style>
:root{--g:#2c6e49;--g2:#f0f9f4;--ink:#1c2420;--mut:#5f6b64;--line:#dfe6e1;--card:#fff;--warn:#bb2e26;--or:#d68c45}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#e6f4ec,#fff 320px) no-repeat #fff;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:14px 20px;max-width:1180px;margin:0 auto}
.logo{font-weight:800;font-size:20px;color:var(--g);cursor:pointer;background:none;border:0;padding:0}
main{max-width:760px;margin:0 auto;padding:8px 20px 80px}
h1{font-size:28px;margin:12px 0 4px}h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
label{display:block;font-weight:600;margin:14px 0 6px}label:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;background:var(--g);color:#fff}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.sm{padding:6px 12px;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.steps{display:flex;gap:6px;margin:6px 0 18px;list-style:none;padding:0}
.steps li{flex:1;text-align:center;font-size:13px;color:var(--mut);padding-bottom:6px;border-bottom:4px solid var(--line)}
.steps li.on{color:var(--g);font-weight:700;border-color:var(--g)}.steps li.done{border-color:var(--g)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-weight:500}
.chk input{width:auto;margin-top:5px}
.chk small{display:block;color:var(--mut);font-weight:400}
.err{background:#fdecea;color:var(--warn);border-radius:10px;padding:10px 14px;margin:12px 0}
.ol{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.ol .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g2);color:var(--g);font-weight:700;display:grid;place-items:center;margin-top:8px}
.ol .f{flex:1}.ol input{font-weight:700;margin-bottom:6px}.ol textarea{min-height:56px}
.ol .t{display:flex;flex-direction:column;gap:2px}
.ib{border:0;background:none;cursor:pointer;font-size:16px;padding:2px 6px;color:var(--mut)}.ib:hover{color:var(--g)}.ib:disabled{opacity:.25}
.lrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}.lrow b{display:block}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--g2);color:var(--g);font-weight:600;white-space:nowrap}
.pill.w{background:#fdf2e6;color:var(--or)}.pill.e{background:#fdecea;color:var(--warn)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.saved{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.saved:first-child{border-top:0}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.th{border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;background:#fff;font:inherit;font-size:13px;text-align:center}
.th.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g2)}
.th .mini{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;margin-bottom:4px}

/* ============ diapositives (960×540, mises à l'échelle) ============ */
.fit{position:relative;overflow:hidden}
.sl{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;line-height:1.3}
.sl::before,.sl::after{content:"";position:absolute;background:var(--blob);z-index:0}
.sl::before{right:-130px;top:-120px;width:560px;height:470px;border-radius:58% 42% 52% 48%/48% 58% 42% 52%}
.sl::after{left:-150px;bottom:-190px;width:430px;height:360px;border-radius:46% 54% 60% 40%/55% 45% 55% 45%;opacity:.7}
.sl .in{position:absolute;inset:0;padding:42px 56px;z-index:1;display:flex;flex-direction:column}
.sl h2{font-size:42px;line-height:1.1;color:var(--ti);text-transform:uppercase;margin:0 0 20px;font-weight:800;letter-spacing:-.5px}
.sl ul.bl{margin:0;padding-left:28px;font-size:25px}.sl ul.bl li{margin:0 0 14px}
.sl .body{flex:1;display:flex;gap:30px;min-height:0}
.sl .txt{flex:1.15;min-width:0}
.sl .art{flex:1;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:22px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.06);align-self:center;aspect-ratio:4/3;overflow:hidden}
.sl .art svg{width:100%;height:100%}.sl .art .big{font-size:120px}
.sl .cards{display:grid;gap:14px;flex:1;align-content:start}
.sl .cd{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:16px;padding:12px 18px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.sl .num{flex:none;width:44px;height:44px;border-radius:10px;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center}
.sl .c0{background:var(--ac)}.sl .c1{background:var(--ac2)}.sl .c2{background:#d6336c}.sl .c3{background:#222}.sl .c4{background:#7e22ce}.sl .c5{background:#0891b2}
.sl .cd .tt{font-weight:800;font-size:22px}.sl .cd .xx{font-size:19px;opacity:.9}
.sl .cols{display:grid;gap:20px;flex:1;align-items:start}
.sl .col{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 4px 0 rgba(0,0,0,.06);height:100%}
.sl .col .num{margin-bottom:10px}.sl .col .tt{font-weight:800;font-size:22px;margin-bottom:6px}.sl .col .xx{font-size:19px}
.sl .tl{position:relative;flex:1;display:flex;align-items:flex-start;gap:14px;padding-top:70px}
.sl .tl::before{content:"";position:absolute;left:0;right:0;top:48px;height:5px;background:var(--ac);border-radius:3px}
.sl .ev{flex:1;position:relative;padding-top:22px}
.sl .ev::before{content:"";position:absolute;left:0;top:-30px;width:24px;height:24px;border-radius:50%;background:var(--card);border:6px solid var(--ac2)}
.sl .ev .tt{font-weight:800;font-size:21px;color:var(--ti);margin-bottom:6px}.sl .ev .xx{font-size:17px}
.sl .qt{margin:auto 0;text-align:center}.sl .qt .mark{font-size:120px;line-height:.6;color:var(--ac2);font-family:Georgia,serif}
.sl .qt blockquote{margin:0;font-size:36px;font-style:italic;font-weight:600}.sl .qt cite{display:block;margin-top:20px;font-size:22px;color:var(--ti);font-style:normal;font-weight:700}
.sl .hero{margin:auto 0;text-align:center}.sl .hero .em{font-size:90px}.sl .hero h2{font-size:54px;margin:8px 0 20px}
.sl .hero ul{display:inline-block;text-align:left;font-size:22px;margin:0;padding-left:24px}
.sl.act h2{font-size:30px;margin-bottom:10px}.sl .qq{font-size:26px;font-weight:600;margin:0 0 14px}
.sl .ch{display:flex;gap:16px;align-items:center;background:var(--card);border:3px solid transparent;border-radius:14px;padding:7px 14px;margin-bottom:9px;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.sl .ch.ok{border-color:#16a34a;background:#e7f7ec}.sl .ch.ko{opacity:.55}
.sl .why{margin-top:4px;padding:8px 16px;border-radius:14px;background:var(--card);border-left:6px solid #16a34a;font-size:18px}
.sl .vg{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;align-content:start}
.sl .vg div{background:var(--card);border-radius:14px;padding:12px 16px;font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.06)}.sl .vg b{display:block;color:var(--ti);font-size:21px}
.sl .tabs{display:flex;gap:8px;position:absolute;top:14px;right:18px;z-index:3}
.sl .tabs span{padding:6px 14px;border-radius:99px;font-size:15px;font-weight:700;background:var(--card);cursor:pointer;opacity:.7}.sl .tabs span.on{opacity:1;box-shadow:0 0 0 2px var(--ac)}
.edit [contenteditable]{outline:none;border-radius:6px;cursor:text}
.edit [contenteditable]:hover{box-shadow:0 0 0 2px rgba(0,0,0,.12)}.edit [contenteditable]:focus{box-shadow:0 0 0 2px var(--ac);background:rgba(255,255,255,.5)}
.edit .ch,.edit .num{cursor:pointer}

/* ============ studio & présentation ============ */
#studio,#show{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#f4f6f5}
#studio.on,#show.on{display:flex}
#show{background:#111}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--g);color:#fff;flex-wrap:wrap}
.top .btn{background:#fff;color:var(--g)}.top .btn.pri{background:#f59e0b;color:#111}
.top select{width:auto;padding:6px 10px;color:var(--ink)}
.top b{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbody{flex:1;display:grid;grid-template-columns:170px 1fr;min-height:0}
.thumbs{overflow:auto;padding:10px;background:#e9eeeb;display:flex;flex-direction:column;gap:10px}
.thumb{position:relative;cursor:pointer;border:3px solid transparent;border-radius:8px;background:#fff}
.thumb.on{border-color:var(--g)}
.thumb .k{position:absolute;left:6px;bottom:4px;z-index:5;font-size:12px;font-weight:700;background:#fff;border-radius:6px;padding:0 6px}
.thumb .fit{pointer-events:none;border-radius:5px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
.stage .fit{box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px;background:#fff;border-top:1px solid var(--line)}
.tools select{width:auto;padding:6px 10px}
.ask{display:flex;gap:8px;padding:8px 14px;background:#fff;border-top:1px solid var(--line)}
.ask input{flex:1}
.notesbox{padding:8px 14px 12px;background:#fff}.notesbox textarea{min-height:56px;font-size:14px}
.notesbox small{color:var(--mut)}
@media(max-width:700px){.sbody{grid-template-columns:1fr;grid-template-rows:1fr 90px}.thumbs{order:2;flex-direction:row}.thumb{width:120px;flex:none}}
#show .stage{padding:0}#show .stage .fit{box-shadow:none;border-radius:0}
.showbar{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5;opacity:.0;transition:opacity .2s}
#show:hover .showbar{opacity:1}
#print{display:none}
#print.slides .tabs{display:none}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{padding:0!important;background:#fff!important}body>*:not(#print){display:none!important}#print{display:block}
#print.slides .pg{width:960px;height:539px;position:relative;overflow:hidden;break-after:page;page-break-after:always}#print.slides .pg:last-child{break-after:auto;page-break-after:auto}html,body{height:auto!important;margin:0!important}
#print.slides .sl{position:absolute;left:0;top:0;transform:none!important}
#print h1{page-break-before:always;font-size:22px}#print h1:first-child{page-break-before:avoid}
#print .s{break-inside:avoid;margin:0 0 14px;padding-left:12px;border-left:4px solid var(--g)}}

header nav{display:flex;gap:18px;align-items:center}
header nav a{cursor:pointer;color:var(--ink);font-weight:500}header nav a:hover{color:var(--or)}
.chip{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--g);color:var(--g);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer}
.wide{max-width:1180px}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:900;line-height:1.15;margin:20px 0 8px}
.hero p{font-size:20px;font-weight:600;margin:0 0 28px}
.plans{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:stretch}@media(min-width:1000px){.plans{grid-template-columns:repeat(3,1fr)}}
.pcd{display:flex;flex-direction:column;gap:12px;border:8px solid #ebeff2;border-radius:20px;padding:22px;background:#f7fafc;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.pcd.max{background:#fff4f1}.pcd.cur{border-color:var(--g)}
.pcd h3{margin:0;font-size:28px;font-weight:900;text-transform:uppercase}
.pcd .price{font-size:22px;font-weight:700}.pcd .bill{min-height:24px;margin:0;color:var(--mut)}
.pcd ul{list-style:none;padding:0;margin:6px 0 14px;flex:1}.pcd li{display:flex;gap:8px;margin:10px 0}
.seg{display:inline-flex;background:#e5e7eb;border-radius:99px;padding:3px;box-shadow:inset 0 2px 0 rgba(0,0,0,.15)}
.seg button{white-space:nowrap;border:0;border-radius:99px;padding:5px 10px;font:inherit;font-size:14px;font-weight:600;background:none;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg small{white-space:nowrap;font-size:11px;background:#dbeafe;color:#1e40af;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:600}
.pbtn{width:100%;height:56px;border-radius:16px;border:1px solid transparent;font:inherit;font-size:18px;font-weight:900;cursor:pointer;background:var(--g);color:#fff;margin-top:auto}
.pbtn.out{background:transparent;color:var(--g);border-color:var(--g)}.pbtn:disabled{opacity:.55;cursor:default}
.pbtn.grad{border:4px solid #1fda71;box-shadow:0 0 0 0}
.schools{grid-column:1/-1;background:rgba(61,144,144,.07)}.schools h3{color:#3d9090}
.faq{margin:40px 0}.faq h2{color:#d90368;font-size:24px}
.faq details{border:1px solid rgba(0,0,0,.1);border-radius:14px;padding:12px 16px;margin-bottom:10px;background:#fff}
.faq summary{font-weight:700;font-size:18px;cursor:pointer}.faq p{margin:10px 0 0;font-size:17px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}#modal .box{background:#fff;border-radius:18px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
#modal h2{margin-bottom:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:12px;z-index:90;font-weight:600}
.lock{opacity:.6;cursor:pointer}.tag{font-size:11px;font-weight:800;background:#fdf2e6;color:var(--or);border-radius:6px;padding:1px 6px;margin-left:6px}
.sl .badge{position:absolute;right:16px;bottom:10px;z-index:4;font:700 13px var(--font);background:var(--card);color:var(--ti);padding:3px 10px;border-radius:99px;opacity:.9}
.sl .vid{flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}
.sl .vid iframe{width:100%;height:100%;border:0}.sl .vurl{margin-top:8px;font-size:15px;opacity:.8;word-break:break-all}
.sl .vurl [data-e]{display:inline-block;min-width:420px;border-bottom:2px dotted var(--ac)}.sl .vurl [data-e]:empty::before{content:"https://www.youtube.com/watch?v=…";opacity:.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fgrid label{margin:6px 0 2px;font-size:14px}.fgrid input[type=color]{padding:2px;height:38px}

body{background:#fff;font-family:Inter,system-ui,sans-serif;padding:8px}
body.home header{display:none}
#app.home{max-width:none;padding:0}
header{background:linear-gradient(#e6f4ec,#fff);border-radius:16px}
.th-hero{background:#409e9e;color:#fff;border-radius:28px;padding:22px 28px 56px;text-align:center;position:relative;overflow:hidden}
.th-hero::before{content:"";position:absolute;right:-120px;top:-140px;width:460px;height:460px;border-radius:50%;background:rgba(255,255,255,.07)}
.th-hero::after{content:"";position:absolute;left:-140px;bottom:-200px;width:420px;height:420px;border-radius:50%;background:rgba(0,0,0,.06)}
.th-hero>*{position:relative;z-index:1}
.hn{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1280px;margin:0 auto;padding:6px 8px}
.hn .l{display:flex;gap:28px;align-items:center}.hn a{color:#fff;font-size:18px;cursor:pointer;font-weight:500}.hn a:hover{opacity:.8}
.hn .r{display:flex;gap:12px;align-items:center}
.hn .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.ghostw{font:inherit;font-weight:800;font-size:16px;color:#fff;background:transparent;border:2px solid #fff;border-radius:16px;padding:10px 22px;cursor:pointer}
.ghostw:hover{background:#fff;color:#409e9e}
.wm{font:700 clamp(44px,7vw,76px)/1 Fredoka,Inter,sans-serif;margin:44px 0 18px;letter-spacing:-1px;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.th-hero h1{text-wrap:balance;font-size:clamp(32px,5.4vw,66px);line-height:1.15;font-weight:900;color:#0b1f1f;margin:0 auto;max-width:1000px}
.th-hero .sb{font-size:clamp(18px,2.4vw,28px);font-weight:700;color:#0b1f1f;margin:14px auto 30px;max-width:900px}
.hbar{display:flex;gap:8px;align-items:center;background:#fff;border-radius:26px;padding:10px;max-width:820px;margin:0 auto;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.hbar input{border:0;background:#f5f7f7;border-radius:18px;padding:16px 18px;font-size:18px;color:#111;flex:1;min-width:0}
.hbar input:focus{outline:2px solid #2c6e49}
.hbar .go{font:inherit;font-weight:900;font-size:20px;color:#fff;background:#2c6e49;border:0;border-radius:18px;padding:15px 26px;cursor:pointer;white-space:nowrap}
.hbar .go:hover{filter:brightness(1.12)}
.opts{display:flex;gap:10px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.opts select{width:auto;min-width:170px;border-radius:12px;border:0;font-weight:600;color:#0b1f1f}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:980px;margin:18px auto 0}
.chip2{font:inherit;font-weight:600;font-size:17px;color:#0b1f1f;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9);border-radius:99px;padding:8px 16px;cursor:pointer}
.chip2:hover{background:#fff}
.kinds{display:flex;gap:10px;justify-content:center;align-items:center;margin:16px 0 0;flex-wrap:wrap;font-weight:700;color:#0b1f1f}.chip2.kd{background:#fff;font-weight:800}
.stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:34px;font-weight:700;font-size:17px;color:#fff}
.sec{max-width:1180px;margin:0 auto;padding:56px 20px 0}
.sec h2{font-size:clamp(26px,3.4vw,40px);font-weight:900;margin:0 0 6px;line-height:1.2}
.sec .eb{color:#d90368;font-weight:700;font-size:18px;margin:0 0 4px}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:24px}
.fc{background:#f7fafc;border:8px solid #ebeff2;border-radius:20px;padding:20px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.fc:nth-child(2){background:#fff4f1}.fc:nth-child(3){background:#f0f9f4}.fc:nth-child(4){background:#f4f1ff}
.fc .ic{font-size:38px}.fc h3{margin:8px 0 6px;font-size:22px;font-weight:900}.fc p{margin:0;font-size:16px;color:#374151}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
.mc{background:#fff;border:8px solid #ebeff2;border-radius:20px;padding:16px 18px;box-shadow:0 3px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;gap:8px}

const TOK=()=>{try{return localStorage.getItem("seq.tok");}catch{return null;}};

async function api(path,body,method="POST"){
  const hdr={"Content-Type":"application/json","X-Seq-Device":DEV};
  const code=localStorage.getItem("seq.code");if(code)hdr["X-Seq-Code"]=code;
  const tok=TOK();if(tok)hdr["Authorization"]="Bearer "+tok;
  const go=()=>fetch(path,{method,headers:hdr,body:body==null?undefined:JSON.stringify(body)});
  let r=await go(),d=await r.json().catch(()=>({}));
  if(r.status===401&&d.code==="access"){
    const c=prompt("Code d'accès :");if(!c)throw new Error("Code d'accès requis.");
    localStorage.setItem("seq.code",c);hdr["X-Seq-Code"]=c;r=await go();d=await r.json().catch(()=>({}));
  }
  if(!r.ok){
    if(d.code==="auth"&&!path.startsWith("/api/auth/")&&tok){clearAuth();render();}
    const e=new Error(d.error||"Erreur "+r.status);e.code=d.code;throw e;
  }
  return d;
}

async function generate(){

const ytId=u=>(String(u||"").match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/)||[])[1];
const ITEM_LAYOUTS=["list","timeline","steps"];
function normalize(sl){
  sl.bullets=sl.bullets||[];sl.items=sl.items||[];
  if(ITEM_LAYOUTS.includes(sl.layout)&&!sl.items.length)sl.items=sl.bullets.map(b=>({t:b,x:""}));
  if(sl.layout==="text_image"&&!sl.bullets.length)sl.bullets=sl.items.map(i=>i.x?`${i.t} : ${i.x}`:i.t);

  if(sl.layout==="vocab"&&!sl.vocab)sl.vocab=[{term:"Mot",definition:"Définition"}];
  if(sl.layout==="activity"&&!sl.q)sl.q={q:"Question ?",choices:["Réponse A","Réponse B","Réponse C","Réponse D"],answer:0,why:""};

}

let ST=null;
function openStudio(li,n=0){ST={li,n,tab:"q",busy:false};S.lessons[li].slides.forEach(normalize);$("#studio").classList.add("on");studio();}
function closeStudio(){ST=null;$("#studio").classList.remove("on");if(S&&step===5)series();}
const SL=()=>S.lessons[ST.li].slides;
function studio(){
  const sl=SL(),cur=sl[ST.n];
  $("#studio").innerHTML=`<div class="top"><button class="btn sm" onclick="closeStudio()">←</button><b>${esc(S.lessons[ST.li].title)}</b>
   <select onchange="S.theme=this.value;save();studio()" title="Thème">${Object.entries(allThemes()).map(([k,t])=>`<option value="${k}" ${k===S.theme?"selected":""}>${esc(t.n)}</option>`).join("")}</select>
   <button class="btn sm" onclick="${(S.custom||{})[S.theme]?"editTheme(S.theme)":"newTheme()"}" title="Thème personnalisé (Max)">🎨</button>
   <button class="btn sm" onclick="exportPptx(${ST.li})" title="PowerPoint, compatible Google Slides">⬇ PPTX</button><button class="btn sm" onclick="exportPdf(${ST.li})" title="PDF des diapositives">⬇ PDF</button><button class="btn sm pri" onclick="play(${ST.li},${ST.n})">▶ Enseigner</button></div>
  <div class="sbody"><div class="thumbs" id="thumbs">${sl.map((x,i)=>`<div class="thumb ${i===ST.n?"on":""}" onclick="ST.n=${i};ST.tab='q';studio()">${fitBox(slideHTML(x,{theme:S.theme,thumb:true}),"100%","0",'th-fit')}<span class="k">${i+1}</span></div>`).join("")}</div>
  <div class="main"><div class="stage" id="stage"><div class="fit" id="big" style="width:100%;height:100%">${slideHTML(cur,{edit:true,theme:S.theme,tab:ST.tab})}</div></div>
   <div class="tools"><span style="font-size:13px;color:var(--mut)">${ST.n+1} / ${sl.length}</span>
    <select id="lay" onchange="setLayout(this.value)">${Object.entries(LAYOUT_NAMES).map(([k,v])=>`<option value="${k}" ${k===cur.layout?"selected":""}>${v}${k==="video"&&!CAP().youtube?" 🔒":""}</option>`).join("")}</select>
    <button class="btn sm ghost" onclick="mvSlide(-1)" ${ST.n?"":"disabled"} title="Monter">◀</button><button class="btn sm ghost" onclick="mvSlide(1)" ${ST.n<sl.length-1?"":"disabled"} title="Descendre">▶</button>
    <button class="btn sm ghost" onclick="addItem(1)" title="Ajouter une puce ou un élément">＋ élément</button><button class="btn sm ghost" onclick="addItem(-1)" title="Retirer le dernier élément">− élément</button>
    <button class="btn sm ghost" onclick="addVideo()">▶ Vidéo</button><button class="btn sm ghost" onclick="dupSlide()">⧉ Dupliquer</button><button class="btn sm ghost" onclick="newSlide()">＋ Diapositive</button><button class="btn sm ghost" onclick="delSlide()" ${sl.length>1?"":"disabled"}>🗑</button></div>
   <div class="ask"><input id="ai" placeholder="Demander à Claude… ex. « ajoute un exemple concret », « simplifie », « fais-en une chronologie »" onkeydown="if(event.key==='Enter')askAI()"><button class="btn sm" id="aib" onclick="askAI()">✨ Envoyer</button></div>
   <div class="notesbox"><small>Notes de l'enseignant (invisibles pour les élèves)</small><textarea oninput="SL()[ST.n].notes=this.value;persist()" onchange="save()">${esc(cur.notes||"")}</textarea></div></div></div>`;
  layoutFit();
}
function layoutFit(){
  const big=$("#big");if(!big)return;
  const st=$("#stage"),w=Math.min(st.clientWidth-28,(st.clientHeight-28)*16/9);
  big.style.width=w+"px";big.style.height=w*9/16+"px";fit(big);
  document.querySelectorAll(".th-fit").forEach(b=>{b.style.height=b.clientWidth*9/16+"px";fit(b);});
}
addEventListener("resize",()=>{if(ST)layoutFit();if(P)layoutShow();});
document.addEventListener("focusout",e=>{
  const el=e.target.closest&&e.target.closest("[data-e]");if(!el||!ST)return;
  const p=el.dataset.e,v=el.textContent.replace(/\s+/g," ").trim();
  setPath(SL()[ST.n],p,v);save();
  if(p==="url")return studio();
  const th=document.querySelectorAll(".thumb")[ST.n];if(th){th.querySelector(".fit").innerHTML=slideHTML(SL()[ST.n],{theme:S.theme,thumb:true});layoutFit();}
});
document.addEventListener("keydown",e=>{if(e.target.matches&&e.target.matches("[data-e]")&&e.key==="Enter"){e.preventDefault();e.target.blur();}});
document.addEventListener("click",e=>{
  if(ST){
    const tab=e.target.closest("[data-tab]");if(tab){ST.tab=tab.dataset.tab;studio();return;}
    const a=e.target.closest("[data-ans]");if(a&&!e.target.closest("[data-e]")){SL()[ST.n].q.answer=+a.dataset.ans;save();studio();}
  }else if(P){
    const tab=e.target.closest("[data-tab]");if(tab){P.tab=tab.dataset.tab;showSlide();}
  }
});
function setLayout(l){if(l==="video"&&!CAP().youtube){openUpgrade("youtube");return studio();}const sl=SL()[ST.n];sl.layout=l;normalize(sl);save();studio();}
function mvSlide(d){const a=SL();[a[ST.n],a[ST.n+d]]=[a[ST.n+d],a[ST.n]];ST.n+=d;save();studio();}
function addVideo(){if(!CAP().youtube)return openUpgrade("youtube");SL().splice(ST.n+1,0,{id:uid(),layout:"video",title:"Vidéo",url:"",bullets:[],items:[],notes:""});ST.n++;save();studio();}
function dupSlide(){const a=SL(),c=JSON.parse(JSON.stringify(a[ST.n]));c.id=uid();a.splice(ST.n+1,0,c);ST.n++;save();studio();}
function delSlide(){const a=SL();if(a.length<2||!confirm("Supprimer cette diapositive ?"))return;a.splice(ST.n,1);ST.n=Math.min(ST.n,a.length-1);save();studio();}
function newSlide(){SL().splice(ST.n+1,0,{id:uid(),layout:"text_image",title:"Nouveau titre",bullets:["Votre texte ici"],items:[],emoji:"💡",notes:""});ST.n++;save();studio();}
function addItem(d){
  const sl=SL()[ST.n];
  if(sl.layout==="vocab"){d>0?sl.vocab.push({term:"Mot",definition:"Définition"}):sl.vocab.length>1&&sl.vocab.pop();}
  else if(sl.layout==="activity"){d>0?sl.q.choices.length<6&&sl.q.choices.push("Nouvelle réponse"):sl.q.choices.length>2&&(sl.q.choices.pop(),sl.q.answer=Math.min(sl.q.answer,sl.q.choices.length-1));}
  else if(ITEM_LAYOUTS.includes(sl.layout)){d>0?sl.items.length<6&&sl.items.push({t:"Titre",x:"Description"}):sl.items.length>1&&sl.items.pop();}
  else{d>0?sl.bullets.length<8&&sl.bullets.push("Nouveau point"):sl.bullets.length>0&&sl.bullets.pop();}
  save();studio();
}
async function askAI(){
  const inp=$("#ai"),ins=inp.value.trim();if(!ins||ST.busy)return;
  ST.busy=true;const b=$("#aib");b.disabled=true;b.innerHTML='<span class="spin"></span>';
  const {li,n}=ST,cur=SL()[n];
  try{
    const r=await api("/api/slide",{topic:S.topic,level:S.level,language:S.language,lesson:S.lessons[li].title,instruction:ins,slide:{...cur,svg:undefined}});
    r.id=cur.id;if(!r.svg&&cur.layout===r.layout&&cur.svg)r.svg=cur.svg;if(r.notes===""&&cur.notes)r.notes=cur.notes;
    S.lessons[li].slides[n]=normalize(r);save();
  }catch(e){alert(e.message);}
  if(ST&&ST.li===li){ST.busy=false;studio();}
}

/* ============ mode Enseigner ============ */
let P=null;
function play(li,n=0){closeStudio();S.lessons[li].slides.forEach(normalize);P={li,n,tab:"q"};$("#show").classList.add("on");showSlide();}
function showSlide(){
  const sl=S.lessons[P.li].slides,cur=sl[P.n];
  $("#show").innerHTML=`<div class="stage"><div class="fit" id="sbig">${slideHTML(cur,{theme:S.theme,tab:P.tab})}</div></div>
  <div class="showbar"><button class="btn sm" onclick="nav(-1)">◀</button><button class="btn sm" onclick="${cur.layout==="activity"?"P.tab=P.tab==='q'?'a':'q';showSlide()":"nav(1)"}">${cur.layout==="activity"?(P.tab==="q"?"Voir la réponse":"Masquer"):"▶"}</button><button class="btn sm" onclick="nav(1)">Suivant ▶</button><span style="color:#fff;align-self:center;font-size:14px">${P.n+1}/${sl.length}</span><button class="btn sm" onclick="closeShow()">✕</button></div>`;
  layoutShow();
}
function layoutShow(){const b=$("#sbig");if(!b)return;const st=b.parentNode,w=Math.min(st.clientWidth,st.clientHeight*16/9);b.style.width=w+"px";b.style.height=w*9/16+"px";fit(b);}
function nav(d){const len=S.lessons[P.li].slides.length;P.n=Math.max(0,Math.min(len-1,P.n+d));P.tab="q";showSlide();}
function closeShow(){P=null;$("#show").classList.remove("on");}
document.addEventListener("keydown",e=>{
  if(!P)return;const cur=S.lessons[P.li].slides[P.n];
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();if(cur.layout==="activity"&&P.tab==="q"){P.tab="a";showSlide();}else nav(1);}
  else if(e.key==="ArrowLeft")nav(-1);else if(e.key==="Escape")closeShow();
});

/* ---------- impression ---------- */
function printAll(){
  const txt=x=>{switch(x.layout){
    case "list":case "steps":case "timeline":return `<ul>${x.items.map(i=>`<li><b>${esc(i.t)}</b> ${esc(i.x)}</li>`).join("")}</ul>`;
    case "quote":return `<blockquote>${esc(x.quote)} — ${esc(x.author)}</blockquote>`;
    case "vocab":return `<ul>${x.vocab.map(v=>`<li><b>${esc(v.term)}</b> : ${esc(v.definition)}</li>`).join("")}</ul>`;
    case "activity":return `<p>${esc(x.q.q)}</p><ol>${x.q.choices.map((c,j)=>`<li>${j===x.q.answer?"<b>":""}${esc(c)}${j===x.q.answer?" ✓</b>":""}</li>`).join("")}</ol><i>${esc(x.q.why)}</i>`;
    default:return `<ul>${(x.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`;}};
  $("#print").className="";$("#print").innerHTML=S.lessons.filter(l=>l.slides).map((l,i)=>`<h1>${i+1}. ${esc(l.title)}</h1>`+l.slides.map(x=>`<div class="s"><b>${esc(x.emoji||"")} ${esc(x.title||"")}</b>${txt(x)}${x.notes?`<i>Notes : ${esc(x.notes)}</i>`:""}</div>`).join("")).join("");
  window.print();
}


/* ============ comptes ============ */
function clearAuth(){try{localStorage.removeItem("seq.tok");}catch{}ACC=null;}
async function boot(){
  if(TOK()){try{ACC=await api("/api/me",null,"GET");}catch(e){if(e.code==="auth")clearAuth();}}
  await loadPlan();
  if(ACC)await syncSeries();
  render();
}
async function syncSeries(){
  try{
    const remote=await api("/api/series",null,"GET"),rm=new Map(remote.map(x=>[x.id,x]));
    for(const x of remote){const i=saved.findIndex(s=>s.id===x.id);if(i<0)saved.push(x);else if((x.updated||0)>(saved[i].updated||0))saved[i]=x;}
    saved.sort((a,b)=>(b.updated||0)-(a.updated||0));persist();
    for(const l of saved){const r=rm.get(l.id);if(!r||(l.updated||0)>(r.updated||0))await pushSeries(l);}
  }catch{}
}
function openAuth(mode,after){
  AUTH_AFTER=after||null;const reg=mode!=="login";
  modal(`<h2>${reg?"Inscrivez-vous et gagnez du temps":"Bon retour parmi nous !"}</h2><p class="sub">${reg?"La manière rapide de créer des séquences de leçons ⚡️":"Saisissez vos identifiants pour continuer 💪"}</p>
  ${reg?'<label>Prénom et nom</label><input id="au_name" autocomplete="name" maxlength="80">':""}
  <label>E-mail</label><input id="au_email" type="email" autocomplete="email">
  <label>Mot de passe${reg?" (8 caractères minimum)":""}</label><input id="au_pw" type="password" autocomplete="${reg?"new-password":"current-password"}">
  <div id="au_err"></div>
  <button class="btn" id="au_go" style="width:100%;margin-top:14px;height:48px;font-size:17px" onclick="submitAuth('${reg?"register":"login"}')">${reg?"S'inscrire":"Se connecter"}</button>
  <p style="text-align:center;margin:14px 0 0">${reg?`J'ai déjà un compte · <a href="#" onclick="openAuth('login',AUTH_AFTER);return false">Se connecter</a>`:`Pas encore de compte ? <a href="#" onclick="openAuth('register',AUTH_AFTER);return false">Inscription gratuite</a>`}</p>`);
  document.querySelectorAll("#modal input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")submitAuth(reg?"register":"login");}));
  setTimeout(()=>$(reg?"#au_name":"#au_email")?.focus(),50);
}
async function submitAuth(mode){
  const v=i=>($("#"+i)?.value||"").trim(),b=$("#au_go");b.disabled=true;
  try{
    const r=await api("/api/auth/"+mode,{email:v("au_email"),password:$("#au_pw").value,name:v("au_name")});
    localStorage.setItem("seq.tok",r.token);ACC=r.account;closeModal();
    await syncSeries();await loadPlan();toast(mode==="register"?"Bienvenue ! Votre compte est créé.":"Content de vous revoir !");
    const cb=AUTH_AFTER;AUTH_AFTER=null;render();if(cb)cb();
  }catch(e){$("#au_err").innerHTML=`<div class="err">${esc(e.message)}</div>`;b.disabled=false;}
}
async function logout(){
  try{await api("/api/auth/logout",{});}catch{}
  clearAuth();saved=[];persist();S=null;page="";step=1;PL=null;await loadPlan();render();toast("Vous êtes déconnecté");
}
function startFree(){ACC?go("home"):openAuth("register");}

function newSeries(single){S=blank();if(single)S.count=1;step=1;msg="";page="";render();scrollTo(0,0);}
const when=ts=>{if(!ts)return "";const d=new Date(ts),n=new Date();if(n-d<120000)return "À l'instant";return d.toDateString()===n.toDateString()?"aujourd'hui":d.toLocaleDateString("fr-FR");};
const TPL={};  /* modèles de fiches d'activités, remplis plus bas */
const isWB=x=>x.kind==="workbook",isSheet=x=>x.kind==="sheet",isFolder=x=>x.kind==="folder",isDoc=x=>isWB(x)||isSheet(x);
const isLesson=x=>!isDoc(x)&&!isFolder(x)&&x.lessons&&x.lessons.length===1,isSeq=x=>!isDoc(x)&&!isFolder(x)&&!isLesson(x);
const DIFFN={support:"Soutien",core:"Standard",challenge:"Approfondissement"};
function statusOf(x){const L=isDoc(x)?x.sections:x.lessons,n=L.filter(l=>isDoc(x)?l.data:l.slides).length;return n&&n===L.length?"Terminée":n?"En cours":"Brouillon";}
function metaOf(x){if(isFolder(x))return "📁 Dossier";return isSheet(x)?"📄 Fiche d'activités":isWB(x)?`📘 ${x.sections.length} sections`:`📚 ${x.lessons.length} ${x.lessons.length>1?"leçons":"leçon"}`;}
function coverHTML(x){
  if(isDoc(x))return `<div class="cover pfit" style="aspect-ratio:16/9"><div class="pin">${paperHTML(false,false,x)}</div></div>`;
  const l=x.lessons.find(l=>l.slides),sl=l&&l.slides[0];if(!sl)return `<div class="cover" style="aspect-ratio:16/9">📚</div>`;
  const prev=S;S=x;let h;try{h=slideHTML(normalize(sl),{theme:x.theme,thumb:true});}finally{S=prev;}
  return `<div class="cover fit" style="aspect-ratio:16/9">${h}</div>`;
}
let Q="",GK="",FOLDER="";
const kindOK=x=>GK===""||(GK==="wb"?isWB(x):GK==="sheet"?isSheet(x):GK==="lesson"?isLesson(x):isSeq(x));
function cards(){
  const q=Q.toLowerCase(),match=x=>!q||(x.title||x.topic||"").toLowerCase().includes(q);
  const list=saved.filter(x=>{
    if(isFolder(x))return GK===""&&!FOLDER&&match(x);
    if(!kindOK(x)||!match(x))return false;
    return q||GK!==""?true:(x.folder||"")===FOLDER;
  }).sort((a,b)=>(isFolder(b)-isFolder(a)));
  if(!list.length)return `<div class="empty" style="grid-column:1/-1">${q?"Aucun résultat pour cette recherche.":"Il n'y a rien ici pour l'instant ✨<br>Ce que vous créez apparaîtra ici."}</div>`;
  return list.map(x=>isFolder(x)?`<div class="rc fold" onclick="openFolder('${x.id}')"><div class="cover" style="aspect-ratio:16/9">${FOLDERI}</div><div class="bd"><div class="tt"><b>${esc(x.title)}</b><button class="ib" title="Options" onclick="event.stopPropagation();openMenu('${x.id}')">⋯</button></div><div class="mt"><span class="pl">📁 ${saved.filter(s=>s.folder===x.id).length} élément(s)</span></div></div></div>`:
   `<div class="rc" onclick="openS('${x.id}')">${coverHTML(x)}<div class="bd"><div class="tt"><b>${esc(x.title||x.topic)}</b><button class="ib" title="Options" onclick="event.stopPropagation();openMenu('${x.id}')">⋯</button></div>
   <div class="mt">${isSheet(x)?`<span class="pl pk">Fiche d'activités</span><span class="pl pk">${DIFFN[x.difficulty||"core"]}</span>`:`<span class="pl">${metaOf(x)}</span>`}<span>${statusOf(x)} • ${when(x.updated)}</span></div></div></div>`).join("");
}

async function wbGenerate(){
  if(wrunning)return;wrunning=true;const doc=W,here=()=>W===doc&&page==="wb"&&wstep===4;
  const ctx=doc.src==="series"?seriesContext(doc.seriesId):"",o=doc.options;
  for(let i=0;i<doc.sections.length;i++){
    const l=doc.sections[i];if(l.data)continue;
    l.busy=true;delete l.err;if(here())wb4();
    try{
      l.data=await api("/api/workbook/section",{topic:doc.topic,level:doc.level,language:doc.language,instructions:doc.instructions,curriculum:doc.curriculum,title:doc.title,context:ctx,index:i,
        sections:doc.sections.map(x=>({title:x.title,summary:x.summary})),options:{explain:o.explain,objectives:o.objectives,support:o.support,challenge:o.challenge,questions:LEN[o.length].q}});
    }catch(e){l.err=e.message;
      if(e.code==="limit"){l.busy=false;openUpgrade("limit",e.message);break;}
      if(["access","no_key","rate_limited","device"].includes(e.code)){l.busy=false;break;}}
    l.busy=false;saveDoc(doc);if(i===0)loadPlan();if(here())wb4();
  }
  wrunning=false;if(here()){if(doc.sections.every(l=>l.data)){wstep=5;render();toast("Document prêt ! Votre cahier a été créé.");}else wb4();}
}
const RICH="\u0001",OKCOL=/^(#[0-9a-f]{3,8}|rgb\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\))$/i;
function cleanHTML(html){
  const doc=new DOMParser().parseFromString("<body>"+html+"</body>","text/html"),ALLOW=new Set(["B","STRONG","I","EM","U","A","SPAN","UL","OL","LI","BR","DIV","SUB","SUP","H3","H4","P"]);
  const walk=n=>{for(const c of [...n.childNodes]){
    if(c.nodeType===3)continue;if(c.nodeType!==1){c.remove();continue;}
    if(!ALLOW.has(c.tagName)){walk(c);while(c.firstChild)c.parentNode.insertBefore(c.firstChild,c);c.remove();continue;}
    for(const a of [...c.attributes]){const k=a.name.toLowerCase();
      if(c.tagName==="A"&&k==="href"&&/^(https?:|mailto:)/i.test(a.value))continue;
      if(c.tagName==="SPAN"&&k==="style"){const m=a.value.match(/(?:^|;)\s*color:\s*([^;]+)/i);if(m&&OKCOL.test(m[1].trim())){c.setAttribute("style","color:"+m[1].trim());continue;}}
      if(c.tagName==="SPAN"&&k==="class"&&a.value==="eq")continue;
      c.removeAttribute(a.name);}
    if(c.tagName==="A"){c.setAttribute("target","_blank");c.setAttribute("rel","noopener noreferrer");}
    walk(c);}};
  walk(doc.body);return doc.body.innerHTML;
}
const fmt=v=>String(v??"").startsWith(RICH)?cleanHTML(String(v).slice(1)):esc(v);
const getPath=(o,p)=>p.split(".").reduce((c,k)=>c==null?c:c[k],o);
const LET="ABCDEFGH";
function paperHTML(edit,ans,D=W){
  const E=(pth,txt,tag="span",cls="",rich=false)=>`<${tag} class="${cls}" ${edit?(rich?`contenteditable="true" data-r="1" data-w="${pth}"`:`contenteditable="plaintext-only" data-w="${pth}"`):""}>${rich?fmt(txt):esc(txt)}</${tag}>`;
  let n=0,sn=0,total=0;const sheet=D.kind==="sheet",secAns={};
  const wsGrid=(q,hlOn)=>{const hl=new Set(hlOn?(q.placed||[]).flatMap(w=>w.cells.map(c=>c.join(","))):[]);return `<table class="wsg">${q.grid.map((row,r)=>`<tr>${[...row].map((ch,c)=>`<td class="${hl.has(r+","+c)?"hl":""}">${esc(ch)}</td>`).join("")}</tr>`).join("")}</table>`;};
  const ansRow=(q,Q,num)=>{
    let a;
    if(q.type==="qcm"){const k=+q.answer||0;a=`<b>${LET[k]}</b> : ${fmt(q.choices[k]||"")}`;}
    else if(q.type==="match")a=`<div class="am">${q.pairs.map((pr,i)=>`<div><b>${i+1}-${LET[q.order.indexOf(i)]}</b> : ${esc(pr.term)} → ${fmt(pr.def)}</div>`).join("")}</div>`;
    else if(q.type==="wordsearch")a=`Mots à retrouver : <b>${q.words.map(esc).join(", ")}</b>${wsGrid(q,true)}`;
    else a=E(Q+".answer",q.answer);
    const why=q.type==="match"||q.type==="wordsearch"?"":(q.why||edit?` <span class="why">— ${E(Q+".why",q.why||"")}</span>`:"");
    return `<div class="ar"><b class="an">${num}.</b><span>${a}${why}</span></div>`;
  };
  const body=D.sections.map((s,si)=>{
    const d=s.data;if(!d)return "";sn++;const P=`sections.${si}.data`;
    const qs=d.questions.map((q,qi)=>{
      n++;total+=+q.marks||0;const Q=`${P}.questions.${qi}`;let a="";
      if(q.type==="qcm")a=q.choices.map((c,ci)=>`<div class="ch">${E(Q+".choices."+ci,c,"span","",true)}</div>`).join("");
      else if(q.type==="long")a='<div class="ln"></div>'.repeat(5);
      else if(q.type==="short")a='<div class="ln"></div><div class="ln"></div>';
      else if(q.type==="match"){
        const o=q.order;
        a=`<div class="match">${q.pairs.map((pr,i)=>`<div><b>${i+1}.</b> ${E(Q+".pairs."+i+".term",pr.term,"span","",true)}</div><div class="mbx"></div><div><b>${LET[i]}.</b> ${E(Q+".pairs."+o[i]+".def",q.pairs[o[i]].def,"span","",true)}</div>`).join("")}</div>`;
      }else if(q.type==="wordsearch"){
        a=`${wsGrid(q,false)}<div class="wsw">${q.words.map((w,wi)=>`<span>${E(Q+".words."+wi,w)}</span>`).join("")}</div>`;
      }
      (secAns[si]=secAns[si]||[]).push(ansRow(q,Q,n));
      return `<div class="q"><div class="qh"><span class="qn">${q.challenge?'<span class="star">⭐ Défi</span> ':""}${n}.</span>${E(Q+".q",q.q,"span","",true)}<span class="mk">${q.marks} pt${q.marks>1?"s":""}</span>${edit?`<button class="del" data-del="${Q}" title="Supprimer la question">✕</button>`:""}</div>${a}${q.hint?`<div class="hint">💡 ${E(Q+".hint",q.hint,"span","",true)}</div>`:""}</div>`;
    }).join("");
    const head=sheet&&D.sections.length===1?"":`<h2 class="sec"><span>${sn}. ${E(P+".title",d.title)}</span>${edit?`<button class="del" data-del="sections.${si}" title="Supprimer la section">✕</button>`:""}</h2>`;
    return `${head}${d.objective?`<div class="obj">🎯 ${E(P+".objective",d.objective,"span","",true)}</div>`:""}${d.keywords?.length?`<div class="kw">${d.keywords.map((k,ki)=>`<span>${E(P+".keywords."+ki,k)}</span>`).join("")}</div>`:""}
      ${d.explanation?.length?`<div class="ex">${d.explanation.map((x,xi)=>E(P+".explanation."+xi,x,"div","",true)).join("")}</div>`:""}${qs}`;
  }).join("");
  const tag=sheet?`<p class="sub2">${esc(D.level)} · ${esc(D.topic)}${D.tpl&&TPL[D.tpl]&&TPL[D.tpl].total?` · <b>Total : … / ${total}</b>`:""}</p>`:`<p class="sub2">${esc(D.level)} · ${esc(D.topic)}</p>`;
  const ansCard=ans?`<div class="paper pans ${edit?"edit":""}" style="${themeStyle(D.theme)}"><h1>Réponses</h1><p class="sub2">${esc(D.title)}</p>${D.sections.map((s,si)=>s.data?`${sheet&&D.sections.length===1?"":`<div class="as">${esc(s.data.title)}</div>`}${(secAns[si]||[]).join("")}`:"").join("")}</div>`:"";
  return `<div class="paper ${edit?"edit":""}" style="${themeStyle(D.theme)}">${E("title",D.title,"h1")}${tag}<div class="nd"><span>Nom :</span><span>Prénom :</span><span>Date :</span></div>${body}</div>${ansCard}`;
}

async function pptxSlide(pptx,sl,th){
  const hx=c=>String(c).replace("#",""),font=th.font.split(",")[0].replace(/['"]/g,"").trim();
  const cols=[th.ac,th.ac2,"#D6336C","#222222","#7E22CE","#0891B2"].map(hx);
  const s=pptx.addSlide();s.background={color:hx(th.bg)};
  s.addShape("ellipse",{x:6.6,y:-1.8,w:5.2,h:4.2,fill:{color:hx(th.blob)},line:{color:hx(th.blob)}});
  const T=(txt,o)=>s.addText(txt,{fontFace:font,color:hx(th.fg),...o});
  const card=(x,y,w,h)=>s.addShape("roundRect",{x,y,w,h,fill:{color:hx(th.card)},line:{color:hx(th.blob),width:1},rectRadius:.12});
  const badge=(x,y,n,i,sz=.5)=>{s.addShape("roundRect",{x,y,w:sz,h:sz,fill:{color:cols[i%6]},line:{color:cols[i%6]},rectRadius:.08});T(String(n),{x,y,w:sz,h:sz,align:"center",valign:"middle",bold:true,color:"FFFFFF",fontSize:16});};
  let notes=sl.notes||"";
  if(!["quote","title"].includes(sl.layout))T((sl.title||"").toUpperCase(),{x:.5,y:.3,w:9,h:.9,fontSize:28,bold:true,color:hx(th.ti),valign:"middle"});
  const items=sl.items||[];
  switch(sl.layout){
    case "title":
      T(sl.emoji||"📖",{x:0,y:.5,w:10,h:1.2,fontSize:54,align:"center"});
      T((sl.title||"").toUpperCase(),{x:.5,y:1.7,w:9,h:1.2,fontSize:36,bold:true,color:hx(th.ti),align:"center",valign:"middle"});
      if(sl.bullets?.length)T(sl.bullets.map(b=>({text:b,options:{bullet:true,breakLine:true}})),{x:2,y:3.1,w:6,h:2,fontSize:16,valign:"top"});break;
    case "list":{const n=Math.max(items.length,1),h=Math.min(.85,3.7/n);
      items.forEach((it,i)=>{const y=1.4+i*(h+.1);card(.5,y,9,h);badge(.65,y+(h-.5)/2,i+1,i);T([{text:it.t,options:{bold:true,breakLine:true,fontSize:16}},{text:it.x||"",options:{fontSize:13}}],{x:1.3,y,w:8.1,h,valign:"middle"});});break;}
    case "steps":{const n=Math.max(items.length,1),w=(9-.2*(n-1))/n;
      items.forEach((it,i)=>{const x=.5+i*(w+.2);card(x,1.5,w,3.4);badge(x+.15,1.65,i+1,i);T([{text:it.t,options:{bold:true,breakLine:true,fontSize:16}},{text:it.x||"",options:{fontSize:13}}],{x:x+.1,y:2.3,w:w-.2,h:2.5,valign:"top"});});break;}
    case "timeline":{const n=Math.max(items.length,1),w=9/n;
      s.addShape("rect",{x:.5,y:2.1,w:9,h:.06,fill:{color:cols[0]},line:{color:cols[0]}});
      items.forEach((it,i)=>{const x=.5+i*w;s.addShape("ellipse",{x:x+.05,y:1.95,w:.35,h:.35,fill:{color:hx(th.card)},line:{color:cols[1],width:3}});T([{text:it.t,options:{bold:true,breakLine:true,fontSize:15,color:hx(th.ti)}},{text:it.x||"",options:{fontSize:12}}],{x,y:2.5,w:w-.1,h:2.4,valign:"top"});});break;}
    case "quote":
      T(`“${sl.quote||""}”`,{x:1,y:1,w:8,h:2.8,fontSize:28,italic:true,align:"center",valign:"middle"});
      T("— "+(sl.author||""),{x:1,y:3.9,w:8,h:.6,fontSize:18,bold:true,color:hx(th.ti),align:"center"});break;
    case "vocab":
      (sl.vocab||[]).forEach((v,i)=>{const x=.5+(i%2)*4.6,y=1.4+Math.floor(i/2)*1.25;card(x,y,4.4,1.1);T([{text:v.term,options:{bold:true,breakLine:true,fontSize:15,color:hx(th.ti)}},{text:v.definition,options:{fontSize:12}}],{x:x+.1,y,w:4.2,h:1.1,valign:"middle"});});break;
    case "activity":{const q=sl.q;
      T(q.q,{x:.5,y:1.3,w:9,h:.9,fontSize:20,bold:true,valign:"middle"});
      q.choices.forEach((c,i)=>{const y=2.3+i*.62;card(.5,y,9,.52);badge(.58,y+.03,i+1,i,.46);T(c,{x:1.2,y,w:8.2,h:.52,fontSize:15,valign:"middle"});});
      notes=(notes?notes+"\n\n":"")+`Réponse : ${q.answer+1}. ${q.choices[q.answer]}${q.why?" — "+q.why:""}`;break;}
    case "video":
      T("Vidéo YouTube",{x:.5,y:1.5,w:9,h:.6,fontSize:20,bold:true});
      if(sl.url)T([{text:sl.url,options:{hyperlink:{url:sl.url}}}],{x:.5,y:2.2,w:9,h:.6,fontSize:18,color:"0563C1"});break;
    default:{
      T((sl.bullets||[]).map(b=>({text:b,options:{bullet:true,breakLine:true}})),{x:.5,y:1.4,w:5.3,h:3.6,fontSize:18,valign:"top",paraSpaceAfter:8});
      card(6.1,1.5,3.4,2.55);
      const png=sl.svg?await svgPng(sl.svg):null;
      if(png)s.addImage({data:png,x:6.2,y:1.55,w:3.2,h:2.4});else T(sl.emoji||"💡",{x:6.1,y:1.6,w:3.4,h:2.3,fontSize:70,align:"center",valign:"middle"});}
  }
  if(!CAP().no_badge)T("Créé avec Séquences",{x:7,y:5.2,w:2.8,h:.3,fontSize:10,align:"right",color:hx(th.ti)});
  if(notes)s.addNotes(notes);
}
async function ensurePptx(){
  if(typeof PptxGenJS!=="undefined")return true;
  await new Promise(res=>{const s=document.createElement("script");s.src="/pptxgen.bundle.js?"+Date.now();s.onload=res;s.onerror=res;document.head.appendChild(s);});
  return typeof PptxGenJS!=="undefined";
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
const fname=s=>((s||"sequence").replace(/[^\p{L}\p{N} _-]/gu,"").trim().slice(0,60)||"sequence");
async function exportPptx(li){
  if(!(await ensurePptx()))return alert("Le module d'export PowerPoint n'a pas pu être chargé depuis le site (/pptxgen.bundle.js). Rechargez la page avec Ctrl+F5. Si cela persiste, utilisez « PDF » en attendant.");
  const th=allThemes()[S.theme]||THEMES.classique,pptx=new PptxGenJS();pptx.layout="LAYOUT_16x9";pptx.title=S.title;
  const lessons=li==null?S.lessons.filter(l=>l.slides):[S.lessons[li]];
  toast("Création du fichier PowerPoint…");
  try{
    for(const l of lessons)for(const sl of l.slides)await pptxSlide(pptx,normalize(sl),th);
    const blob=await pptx.write({outputType:"blob"});
    download(blob,fname(li==null?S.title:S.lessons[li].title)+".pptx");
  }catch(e){alert("Export PowerPoint impossible : "+(e&&e.message||e));}
}
/* PDF des diapositives : la boîte d'impression du navigateur, réglée sur des pages 16:9 */
function exportPdf(li){
  const lessons=li==null?S.lessons.filter(l=>l.slides):[S.lessons[li]],el=$("#print");let h="";
  for(const l of lessons)for(const sl of l.slides){normalize(sl);
    h+=`<div class="pg">${slideHTML(sl,{theme:S.theme,tab:"q"})}</div>`;
    if(sl.layout==="activity")h+=`<div class="pg">${slideHTML(sl,{theme:S.theme,tab:"a"})}</div>`;}
  const st=document.createElement("style");st.id="pgstyle";st.textContent="@page{size:960px 540px;margin:0}";document.head.appendChild(st);
  el.className="slides";el.innerHTML=h;
  const done=()=>{st.remove();el.className="";el.innerHTML="";removeEventListener("afterprint",done);};
  addEventListener("afterprint",done);
  toast("Dans la fenêtre d'impression, choisissez « Enregistrer au format PDF ».");
  setTimeout(()=>window.print(),400);
}

/* ============ page Tarifs ============ */
const BILL={pro:"annual",max:"annual"};
const EUR=n=>n.toFixed(2).replace(".",",")+" €";
const PR={pro:{monthly:9.99,annual:6.65},max:{monthly:18.99,annual:12.49}};
const TICK='<svg class="tk" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#2c6e49"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const prices=()=>PL?.prices||PR;
function tween(el,from,to){const t0=performance.now(),d=480;(function f(now){const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);el.textContent=EUR(from+(to-from)*e);if(k<1)requestAnimationFrame(f);})(t0);requestAnimationFrame(()=>{});}
function setBillAll(b){
  BILL.pro=BILL.max=b;const seg=$("#seg");if(!seg)return;seg.dataset.b=b;
  seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.b===b));
  for(const p of ["pro","max"]){
    const el=document.querySelector(`.amt[data-p=${p}]`),to=prices()[p][b];
    if(el)tween(el,parseFloat(el.textContent.replace(",",".")),to);
    const bill=document.querySelector(`[data-bill=${p}]`);if(bill)bill.textContent=b==="annual"?EUR(to*12)+" facturé annuellement":"Facturé chaque mois";
    const sv=document.querySelector(`[data-save=${p}]`);if(sv)sv.classList.toggle("off",b!=="annual");
  }
}
function selPlan(el){const g=$(".plans");const was=el.classList.contains("sel");document.querySelectorAll(".pcd.sel").forEach(x=>x.classList.remove("sel"));g.classList.toggle("has-sel",!was);if(!was)el.classList.add("sel");}
function toggleCmp(){const c=$("#cmp"),o=c.classList.toggle("open");$("#cmpb").textContent=o?"Masquer la comparaison ▴":"Comparer les plans ▾";}
function pricing(){
  const cur=PL?.plan||"free",pr=prices(),b0=BILL.pro;
  const feats=a=>`<ul>${a.map((x,i)=>`<li style="--d:${i*70}ms">${TICK}<span>${x}</span></li>`).join("")}</ul>`;
  const pct=PL?Math.min(100,Math.round(PL.used/PL.limit*100)):0;
  const meter=p=>PL&&cur===p?`<div><div class="meter"><i style="width:0" data-w="${pct}"></i></div><p class="bill" style="margin:6px 0 0">${PL.used} / ${PL.limit} ressources ${PL.days===7?"cette semaine":"ce mois-ci"}</p></div>`:"";
  const paid=(p,name,list,grad)=>{
    const mine=cur===p,price=pr[p][b0],save=(pr[p].monthly-pr[p].annual)*12;
    return `<div class="pcd ${p} ${mine?"cur":""} ${p==="pro"?"pop":""}" onclick="selPlan(this)">${p==="pro"?'<div class="ribbon">⭐ Populaire</div>':""}<h3>${name}${mine?' <span class="tag" style="background:#e7f7ec;color:#166534">Votre plan</span>':""}</h3>
    <div><div class="price"><span class="amt" data-p="${p}">${EUR(price)}</span><span class="per">/mois</span></div><p class="bill" data-bill="${p}">${b0==="annual"?EUR(price*12)+" facturé annuellement":"Facturé chaque mois"}</p></div>
    <div><span class="save ${b0==="annual"?"":"off"}" data-save="${p}">💰 Économisez ${EUR(save)} par an</span></div>
    ${meter(p)}${feats(list)}
    <button class="pbtn ${grad?"grad":""}" ${mine?"disabled":""} onclick="event.stopPropagation();subscribe('${p}')">${mine?"Votre plan actuel":"Passer à "+name.toUpperCase()}</button>
    ${mine&&PL?`<p class="bill" style="text-align:center">${PL.cancelled?"Prend fin":"Actif"} jusqu'au ${new Date(PL.until*1000).toLocaleDateString("fr-FR")}${PL.cancelled?"":` · <a href="#" onclick="event.stopPropagation();cancelPlan();return false">Annuler</a>`}</p>`:""}</div>`;};
  const demo=PL?.payment==="demo",row=(l,a,b,c)=>`<tr><td>${l}</td><td>${a}</td><td>${b}</td><td>${c}</td></tr>`,Y="✔",N="–";
  $("#app").innerHTML=`<section class="hero"><h1>Choisissez le plan qui vous convient</h1><p>Un moyen simple et abordable de gagner des heures de votre temps. ⏳</p></section>
  ${demo?`<div class="err" style="background:#fff7e6;color:#8a5a00">Phase de test : les plans Pro et Max s'activent sans paiement.</div>`:""}
  <div class="seg big" id="seg" data-b="${b0}"><i class="knob"></i><button data-b="monthly" class="${b0==="monthly"?"on":""}" onclick="setBillAll('monthly')">Mensuel</button><button data-b="annual" class="${b0==="annual"?"on":""}" onclick="setBillAll('annual')">Annuel <small>💰 4 mois offerts</small></button></div>
  <div class="plans">
   <div class="pcd ${cur==="free"?"cur":""}" onclick="selPlan(this)"><h3>Gratuit${cur==="free"?' <span class="tag" style="background:#e7f7ec;color:#166534">Votre plan</span>':""}</h3><div class="price"><span class="amt">0,00 €</span><span class="per">/mois</span></div>${meter("free")}${feats(["Aucune carte requise","Créez des leçons et des activités","Exportation vers Google &amp; Microsoft","Créez 5 ressources chaque semaine"])}
    <button class="pbtn" onclick="event.stopPropagation();startFree()">Commencer</button></div>
   ${paid("pro","Pro",["Alignement sur les programmes","Supprimer le badge « Séquences »","Ajoutez des vidéos YouTube","Créez 200 ressources par mois","Séquences jusqu'à 12 leçons","Leçons jusqu'à 25 diapositives"])}
   ${paid("max","Max",["Thèmes et polices personnalisés","Créez 400 ressources par mois","Séquences jusqu'à 25 leçons","Leçons jusqu'à 35 diapositives"],true)}
   <div class="pcd schools"><div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between"><div><h3>Écoles</h3><div class="price" style="margin-top:10px"><span class="amt" style="font-size:24px">Discutons</span></div></div>
    <ul style="flex:1;min-width:260px;margin:0">${["Leçons personnalisées","Comptes enseignants liés","Contrôles et suivi administrateur","Facturation centralisée"].map((x,i)=>`<li style="--d:${i*70}ms">${TICK}<span>${x}</span></li>`).join("")}</ul>
    <button class="pbtn out" style="width:auto;padding:0 28px" onclick="openContact(true)">Contactez-nous</button></div></div>
  </div>
  <button class="cmpbtn" id="cmpb" onclick="toggleCmp()">Comparer les plans ▾</button>
  <div class="cmp" id="cmp"><table><tr><th></th><th>Gratuit</th><th>Pro</th><th>Max</th></tr>
   ${row("Ressources","5 / semaine","200 / mois","400 / mois")}${row("Leçons par séquence","5","12","25")}${row("Diapositives par leçon","12","25","35")}
   ${row("Alignement sur les programmes",N,Y,Y)}${row("Vidéos YouTube",N,Y,Y)}${row("Sans badge « Séquences »",N,Y,Y)}${row("Thèmes et polices personnalisés",N,N,Y)}${row("Export PowerPoint et PDF",Y,Y,Y)}</table></div>
  <section class="faq"><h2>Foire aux questions...</h2>
   <details><summary>Puis-je annuler ou modifier mon abonnement à tout moment ?</summary><p>Oui ! Vous pouvez modifier, mettre à niveau ou annuler à tout moment. Les modifications prennent effet à la fin de votre période de facturation en cours.</p></details>
   <details><summary>Quels modes de paiement acceptez-vous ?</summary><p>${demo?"Le paiement en ligne n'est pas encore ouvert : pendant la phase de test, les plans Pro et Max s'activent sans paiement.":"Les abonnements ouvriront bientôt. Écrivez-nous via la page Contact pour être prévenu."}</p></details>
   <details><summary>Combien de leçons puis-je créer avec le plan gratuit ?</summary><p>Vous pouvez créer jusqu'à 5 leçons complètes tous les 7 jours. Celles-ci peuvent être des leçons ou faire partie d'une séquence de leçons.</p></details>
   <details><summary>Qu'advient-il de mes leçons si j'annule mon abonnement Pro ou Max ?</summary><p>Rien ! Vous pouvez toujours accéder à toutes les leçons que vous avez déjà créées. Vous perdrez simplement l'accès aux fonctionnalités Pro ou Max, selon votre abonnement.</p></details>
  </section>`;
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".meter i[data-w]").forEach(i=>i.style.width=i.dataset.w+"%"),250));
}
async function subscribe(p){
  if(PL?.payment!=="demo")return modal(`<h2>Bientôt disponible</h2><p>Les abonnements ne sont pas encore ouverts. Laissez-nous un message et nous vous préviendrons.</p><div class="nav"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" onclick="closeModal();openContact()">Nous écrire</button></div>`);
  if(!ACC)return openAuth("register",()=>subscribe(p));
  if(!confirm(`Phase de test : aucun paiement n'est demandé. Activer le plan ${PNAME[p]} (${BILL[p]==="annual"?"annuel":"mensuel"}) ?`))return;
  try{PL=await api("/api/plan/subscribe",{plan:p,billing:BILL[p]});chip();pricing();toast(`Plan ${PNAME[p]} activé`);}catch(e){alert(e.message);}
}
async function cancelPlan(){
  if(!confirm("Annuler l'abonnement ? Il reste actif jusqu'à la fin de la période en cours."))return;
  try{PL=await api("/api/plan/cancel",{});chip();pricing();toast("Abonnement annulé : il prendra fin à l'échéance");}catch(e){alert(e.message);}
}
function openContact(school){
  modal(`<h2>${school?"Contactez-nous pour votre établissement":"Contact"}</h2><p class="sub">Nous répondons sous 24 h.</p>
  <label>Nom</label><input id="ct_name"><label>E-mail</label><input id="ct_email" type="email">
  ${school?`<label>Établissement</label><input id="ct_school"><label>Nombre de licences</label><input id="ct_lic" placeholder="Au moins 5">`:""}
  <label>Message</label><textarea id="ct_msg" maxlength="2000"></textarea><div id="ct_err"></div>
  <div class="nav"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="ct_go" onclick="sendContact()">Envoyer</button></div>`);
}
async function sendContact(){
  const v=i=>($("#"+i)?.value||"").trim(),b=$("#ct_go");b.disabled=true;
  try{await api("/api/contact",{name:v("ct_name"),email:v("ct_email"),school:v("ct_school")||"(non précisé)",licenses:v("ct_lic"),message:v("ct_msg")});closeModal();toast("Message envoyé, merci !");}
  catch(e){$("#ct_err").innerHTML=`<div class="err">${esc(e.message)}</div>`;b.disabled=false;}
}
render();boot();
