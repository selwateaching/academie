<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planning – BTP Manager</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .week-grid { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; }
  .day-col { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); min-height: 220px; padding: 8px; }
  .day-col.today { border-color: var(--color-primary); border-width: 2px; }
  .day-col h4 { margin: 0 0 8px; font-size: 0.85rem; text-transform: capitalize; }
  .plan-item { background: #f1f5f9; border-radius: 6px; padding: 5px 7px; margin-bottom: 5px; font-size: 0.78rem; }
  .plan-item.appt { border-left: 3px solid var(--color-primary); }
  .plan-item.task { border-left: 3px solid var(--color-warning); }
  .week-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="app-layout">
    <nav id="sidebar"></nav>
    <div class="main-area">
      <header id="topbar"></header>
      <main class="content">
        <h1>Planning de la semaine</h1>
        <div class="week-nav">
          <button class="btn btn-sm" id="prev-week-btn">← Semaine précédente</button>
          <strong id="week-label"></strong>
          <button class="btn btn-sm" id="next-week-btn">Semaine suivante →</button>
          <button class="btn btn-sm" id="today-btn">Aujourd'hui</button>
        </div>
        <p style="color:var(--color-text-muted);">
          <span class="plan-item appt" style="display:inline-block;">Rendez-vous</span>
          <span class="plan-item task" style="display:inline-block; margin-left:6px;">Tâche à échéance</span>
          — pour créer ou modifier, utilise les pages Agenda / Tâches.
        </p>
        <div class="week-grid" id="week-grid"></div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/planning.js"></script>
</body>
</html>
