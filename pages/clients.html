<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clients – BTP Manager</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-layout">
    <nav id="sidebar"></nav>
    <div class="main-area">
      <header id="topbar"></header>
      <main class="content">
        <h1>Clients</h1>

        <div class="toolbar">
          <div class="toolbar-filters">
            <input type="search" id="search" placeholder="Rechercher un client (nom, entreprise, email, téléphone)…" />
            <select id="filter-type">
              <option value="">Tous les types</option>
              <option value="particulier">Particulier</option>
              <option value="entreprise">Entreprise</option>
            </select>
          </div>
          <button class="btn btn-primary" id="new-btn">+ Nouveau client</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-sort="nom">Nom / Entreprise</th>
                <th data-sort="type">Type</th>
                <th data-sort="telephone">Téléphone</th>
                <th data-sort="email">Email</th>
                <th data-sort="ville">Ville</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="clients-tbody">
              <tr><td colspan="6">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
        <p id="empty-msg" class="empty-state" style="display:none;">Aucun client pour le moment. Cliquez sur "Nouveau client" pour commencer.</p>
      </main>
    </div>
  </div>

  <!-- Modale création / modification -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">Nouveau client</h2>
      <form id="client-form">
        <input type="hidden" id="client-id" />

        <div class="form-group">
          <label>Type de client</label>
          <div class="form-row">
            <label style="font-weight:400;"><input type="radio" name="type" value="particulier" checked style="width:auto;" /> Particulier</label>
            <label style="font-weight:400;"><input type="radio" name="type" value="entreprise" style="width:auto;" /> Entreprise</label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group"><label for="prenom">Prénom</label><input id="prenom" /></div>
          <div class="form-group"><label for="nom">Nom</label><input id="nom" /></div>
        </div>

        <div class="form-group" id="entreprise-group" style="display:none;">
          <label for="entreprise">Nom de l'entreprise</label>
          <input id="entreprise" />
        </div>

        <div class="form-row">
          <div class="form-group"><label for="telephone">Téléphone</label><input id="telephone" /></div>
          <div class="form-group"><label for="email">Email</label><input type="email" id="email" /></div>
        </div>

        <div class="form-group"><label for="adresse">Adresse</label><input id="adresse" /></div>
        <div class="form-row">
          <div class="form-group"><label for="code_postal">Code postal</label><input id="code_postal" /></div>
          <div class="form-group"><label for="ville">Ville</label><input id="ville" /></div>
        </div>

        <div class="form-row" id="siret-group" style="display:none;">
          <div class="form-group"><label for="siret">SIRET</label><input id="siret" /></div>
          <div class="form-group"><label for="numero_tva">N° TVA</label><input id="numero_tva" /></div>
        </div>

        <div class="form-group"><label for="notes">Notes</label><textarea id="notes" rows="3"></textarea></div>

        <p class="form-msg" id="form-msg"></p>

        <div class="modal-actions">
          <button type="button" class="btn" id="cancel-btn">Annuler</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/clients.js"></script>
</body>
</html>
