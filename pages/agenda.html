<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agenda – BTP Manager</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .day-group { margin-bottom: 22px; }
  .day-group h3 { font-size: 0.95rem; margin: 0 0 8px; color: var(--color-text-muted); text-transform: capitalize; }
  .appt-card {
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .appt-time { font-weight: 700; min-width: 52px; }
  .appt-info { flex: 1; }
  .appt-info .appt-title { font-weight: 600; }
  .appt-info .appt-meta { font-size: 0.82rem; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="app-layout">
    <nav id="sidebar"></nav>
    <div class="main-area">
      <header id="topbar"></header>
      <main class="content">
        <h1>Agenda</h1>

        <div class="toolbar">
          <div class="toolbar-filters">
            <input type="date" id="filter-from" />
            <span style="align-self:center;">→</span>
            <input type="date" id="filter-to" />
          </div>
          <button class="btn btn-primary" id="new-btn">+ Nouveau rendez-vous</button>
        </div>

        <div id="appt-list"><p class="empty-state">Chargement…</p></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">Nouveau rendez-vous</h2>
      <form id="appt-form">
        <input type="hidden" id="appt-id" />
        <div class="form-group"><label for="titre">Titre *</label><input id="titre" required /></div>

        <div class="form-row">
          <div class="form-group">
            <label for="type">Type</label>
            <select id="type">
              <option value="client">Rendez-vous client</option>
              <option value="visite_chantier">Visite de chantier</option>
              <option value="reunion">Réunion</option>
              <option value="livraison">Livraison</option>
              <option value="intervention">Intervention</option>
              <option value="fournisseur">Rendez-vous fournisseur</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div class="form-group"><label for="lieu">Lieu</label><input id="lieu" /></div>
        </div>

        <div class="form-row">
          <div class="form-group"><label for="date_debut">Date et heure de début *</label><input type="datetime-local" id="date_debut" required /></div>
          <div class="form-group"><label for="date_fin">Date et heure de fin</label><input type="datetime-local" id="date_fin" /></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="client_id">Client (optionnel)</label>
            <select id="client_id"><option value="">— Aucun —</option></select>
          </div>
          <div class="form-group">
            <label for="project_id">Chantier (optionnel)</label>
            <select id="project_id"><option value="">— Aucun —</option></select>
          </div>
        </div>

        <div class="form-group"><label for="notes">Notes</label><textarea id="notes" rows="2"></textarea></div>

        <p class="form-msg" id="form-msg"></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancel-btn">Annuler</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/agenda.js"></script>
</body>
</html>
