<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notifications – BTP Manager</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .notif-group { margin-bottom: 22px; }
  .notif-group h3 { font-size: 0.95rem; margin: 0 0 8px; }
  .notif-item {
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem;
  }
  .notif-item a { color: var(--color-text); }
</style>
</head>
<body>
  <div class="app-layout">
    <nav id="sidebar"></nav>
    <div class="main-area">
      <header id="topbar"></header>
      <main class="content">
        <h1>Centre de notifications</h1>
        <div id="notif-container"><p class="empty-state">Chargement…</p></div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/notifications.js"></script>
</body>
</html>
