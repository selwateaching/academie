<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formation dessalement</title><link rel="stylesheet" href="/css/base.css"></head>
<body>
<script>
fetch('/api/me').then(r=>r.ok?r.json():null).then(j=>{
  if(!j){location.replace('/connexion');return}
  const u=j.user;location.replace(u.must_change?'/mot-de-passe':u.role==='learner'?'/formation':'/tableau-de-bord');
}).catch(()=>location.replace('/connexion'));
</script>
</body>
</html>
