<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mot de passe · Formation dessalement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Source+Sans+3:wght@400;600&family=Noto+Kufi+Arabic:wght@700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="/css/base.css">
</head>
<body>
<main class="gate">
  <div class="gatecard">
    <div class="gatetop">
      <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8 8 5.5 11.5 5.5 15a6.5 6.5 0 0 0 13 0c0-3.5-2.5-7-6.5-12.5z" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-g="brand"></span></div>
      <div class="lang" role="group" aria-label="Langue / اللغة"><button type="button" id="l-fr" lang="fr">FR</button><button type="button" id="l-ar" lang="ar">عربي</button></div>
    </div>
    <h1 data-g="pwH"></h1>
    <p data-g="pwP"></p>
    <form id="f" novalidate>
      <div class="field"><label for="cur" data-g="cur"></label><input id="cur" type="password" autocomplete="current-password" dir="ltr"></div>
      <div class="field"><label for="nw" data-g="nw"></label><input id="nw" type="password" autocomplete="new-password" minlength="8" dir="ltr"></div>
      <div class="field"><label for="nw2" data-g="nw2"></label><input id="nw2" type="password" autocomplete="new-password" minlength="8" dir="ltr"></div>
      <p class="err" id="err" role="alert" hidden></p>
      <button class="btn main" id="go" type="submit" data-g="save"></button>
    </form>
  </div>
</main>
<script src="/js/gate.js"></script>
<script>
let ME=null;
fetch('/api/me').then(r=>{if(r.status===401)location.href='/connexion';return r.json()}).then(j=>{ME=j.user}).catch(()=>{});
$('f').onsubmit=async e=>{e.preventDefault();const b=$('go'),er=$('err');er.hidden=true;
  const nw=$('nw').value;
  if(nw.length<8){er.textContent=G[lang].short;er.hidden=false;return}
  if(nw!==$('nw2').value){er.textContent=G[lang].mismatch;er.hidden=false;return}
  busy(b,'saving',true);
  try{const r=await post('/api/password',{current:$('cur').value,new:nw});
    if(r.ok){location.href=home(Object.assign({},ME||{role:'learner'},{must_change:false}));return}
    er.textContent=r.j.error||G[lang].net;er.hidden=false}
  catch(x){er.textContent=G[lang].net;er.hidden=false}
  busy(b,'save',false)};
</script>
</body>
</html>
