services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garage}
      POSTGRES_DB: garage
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://garage:${POSTGRES_PASSWORD:-garage}@db:5432/garage
    ports: ["8000:8000"]
    depends_on: [db]
    restart: unless-stopped
volumes:
  pgdata:
