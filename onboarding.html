<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finalisation du compte – BTP Manager</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card" id="card">
    <h1>Un instant…</h1>
    <p id="text">Vérification de ton compte en cours.</p>
    <button class="btn btn-primary btn-block" id="retry-btn" style="display:none;">Vérifier à nouveau</button>
    <button class="btn btn-block" id="logout-btn" style="display:none; margin-top:10px;">Déconnexion</button>
  </div>

  <script type="module">
    import { getSession, getProfile, createCompanyAndOwner, signOut } from "./js/auth.js";

    const text = document.getElementById("text");
    const retryBtn = document.getElementById("retry-btn");
    const logoutBtn = document.getElementById("logout-btn");

    async function run() {
      const session = await getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }

      const profile = await getProfile();
      if (profile) {
        window.location.href = "dashboard.html";
        return;
      }

      const pending = JSON.parse(localStorage.getItem("pendingSignup") || "null");

      if (pending && pending.mode === "create") {
        const { error } = await createCompanyAndOwner(pending.raisonSociale, pending.nom, pending.prenom);
        if (error) {
          text.textContent = "Erreur lors de la création de l'entreprise : " + error.message;
          retryBtn.style.display = "block";
          logoutBtn.style.display = "block";
          return;
        }
        localStorage.removeItem("pendingSignup");
        window.location.href = "dashboard.html";
        return;
      }

      text.textContent =
        "Ton compte est créé mais aucune entreprise ne t'est encore associée. " +
        "Si tu as été invité(e), demande à ton administrateur de vérifier que l'invitation " +
        "a bien été envoyée à cette adresse email, puis clique sur \"Vérifier à nouveau\".";
      retryBtn.style.display = "block";
      logoutBtn.style.display = "block";
    }

    retryBtn.addEventListener("click", run);
    logoutBtn.addEventListener("click", async () => {
      await signOut();
      window.location.href = "login.html";
    });

    run();
  </script>
</body>
</html>
