<header class="paper-entete">{% if e.a_logo %}<img src="{{ url_for('logo_entete') }}?v={{ e.a_logo|int }}" alt="" class="paper-logo">{% endif %}
<div>{% if e.ligne_haut %}<div class="pe-haut">{{ e.ligne_haut }}</div>{% endif %}<div class="pe-nom">{{ e.nom_affiche }}</div>{% if e.adresse %}<div class="pe-ligne">{{ e.adresse }}</div>{% endif %}{% if e.contact %}<div class="pe-ligne">{{ e.contact }}</div>{% endif %}</div></header>
