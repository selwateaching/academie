{% extends 'base.html' %}{% block title %}Historique{% endblock %}{% block body %}
<div class="top"><h1>Historique des actions</h1></div><div class="card scroll"><table><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Détail</th></tr>
{% for r in rows %}<tr><td>{{ r.created_at.replace('T',' ') }}</td><td>{{ r.user_nom }}</td><td>{{ r.action }}</td><td>{{ r.detail }}</td></tr>{% else %}<tr><td colspan="4" class="mute">Rien pour l'instant.</td></tr>{% endfor %}</table></div>{% endblock %}
