{% extends "base.html" %}
{% load widget_tweaks %}
{% block titre %}Nouveau devoir{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card-academie p-4 p-md-5">
      <h3 class="fw-bold mb-4">Créer un devoir pour « {{ classe.nom }} »</h3>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            {{ field|add_class:"form-control" }}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary fw-semibold">Publier le devoir</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
