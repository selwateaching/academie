{% extends "base.html" %}
{% load widget_tweaks %}
{% block titre %}Nouveau dossier{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card-academie p-4 p-md-5">
      <h3 class="fw-bold mb-4">Nouveau dossier</h3>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            {{ field|add_class:"form-control" }}
            {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary fw-semibold">Créer</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
