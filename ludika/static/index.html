<style>
/* ============ 1. JETONS DE DESIGN ============ */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#18302A; --soft:#5A6E68; --line:#D6E0DC;
  --board:#1F6F5C; --board-d:#164F42; --pencil:#F6B93B; --coral:#EF6F5E; --sky:#3E8ED0; --plum:#8B5CC7;
  --ok:#23945F; --ok-bg:#E2F5EA; --bad:#D6453A; --bad-bg:#FBE6E3;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 0 rgba(24,48,42,.06),0 8px 24px -12px rgba(24,48,42,.25);
  --fs:17px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A17; --surface:#16241F; --surface2:#1C2E28; --ink:#E7F0EC; --soft:#9DB3AB; --line:#2B423A;
    --board:#3FB08F; --board-d:#2E8D71; --ok-bg:#153A28; --bad-bg:#3D1C19;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#16241F; --surface2:#1C2E28; --ink:#E7F0EC; --soft:#9DB3AB; --line:#2B423A;
  --board:#3FB08F; --board-d:#2E8D71; --ok-bg:#153A28; --bad-bg:#3D1C19;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;font-size:var(--fs);line-height:1.55;-webkit-font-smoothing:antialiased}
body.dys{letter-spacing:.06em;word-spacing:.18em;line-height:1.8}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.01em}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ============ 2. COMPOSANTS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:700;background:var(--surface);border:1.5px solid var(--line);transition:transform .1s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.97)}

/* Store : ce qui appartient à l'enseignant sur cet appareil (jeux, classes, historique, réglages). */
const Store={
  KEY:"ludika-v1",
  data:null,
  defaults(){return {games:[],classes:[],sessions:[],plays:[],settings:{teacher:"",dys:false,big:false,chrono:true,leaderboard:true,sound:true,tts:true},seeded:false};},
  load(){try{const r=localStorage.getItem(this.KEY);this.data=r?Object.assign(this.defaults(),JSON.parse(r)):this.defaults();}catch(e){this.data=this.defaults();}
    this.data.settings=Object.assign(this.defaults().settings,this.data.settings);},
  save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.data));}catch(e){toast("Sauvegarde impossible sur cet appareil (stockage plein ou désactivé).");}},
  get games(){return this.data.games},
  get settings(){return this.data.settings},
  game(id){return this.data.games.find(g=>g.id===id)},
  upsertGame(g){g.updatedAt=Date.now();const i=this.data.games.findIndex(x=>x.id===g.id);if(i>=0)this.data.games[i]=g;else this.data.games.unshift(g);this.save();},
  removeGame(id){this.data.games=this.data.games.filter(g=>g.id!==id);this.save();},
  addPlay(p){this.data.plays.unshift(p);this.data.plays=this.data.plays.slice(0,300);this.save();},
  upsertSession(s){const i=this.data.sessions.findIndex(x=>x.code===s.code);if(i>=0)this.data.sessions[i]=Object.assign(this.data.sessions[i],s);else this.data.sessions.unshift(s);this.save();}
};

/* Cloud : base partagée (capacité db) pour le mode classe en direct. */
/* HttpDB : même interface que la capacité db, mais sur votre propre serveur (hébergement Render, etc.).
   Les mises à jour « en direct » sont relevées toutes les 2,5 secondes. */
const HttpDB=base=>{
  const K="ludika-owner-";
  const tok=p=>{try{return localStorage.getItem(K+p)||"";}catch(e){return "";}};
  const req=async(method,p,body)=>{const h={"Content-Type":"application/json"};const t=tok(p);if(t)h["X-Ludika-Owner"]=t;
    let r;try{r=await fetch(base+"/"+p,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:"no-store"});}catch(e){throw {code:"unavailable",message:"réseau"};}
    const d=await r.json().catch(()=>({}));if(!r.ok)throw {code:d.code||"unavailable",message:d.error||("HTTP "+r.status)};
    if(d.owner){try{localStorage.setItem(K+p,d.owner);}catch(e){}}return d;};
  const snap=(id,d)=>({id,exists:!!d.exists,data:()=>d.data==null?undefined:d.data,metadata:{fromCache:false,hasPendingWrites:false}});
  const qsnap=d=>{const docs=(d.docs||[]).map(x=>snap(x.id,{exists:true,data:x.data}));return {docs,size:docs.length,empty:!docs.length};};
  const poll=(p,wrap,fn,err)=>{let last=null,stop=false,fails=0,t;
    const tick=async()=>{if(stop)return;try{const d=await req("GET",p);fails=0;const s=JSON.stringify(d);if(s!==last){last=s;fn(wrap(d));}}
      catch(e){fails++;if(fails===5&&err)err(e);}
      if(!stop)t=setTimeout(tick,document.hidden?8000:2500);};
    t=setTimeout(tick,0);return ()=>{stop=true;clearTimeout(t);};};
  return {
    doc(p){const id=p.split("/").pop();return {id,path:p,get:async()=>snap(id,await req("GET",p)),set:async d=>{await req("PUT",p,d);},update:async d=>{await req("PATCH",p,d);},
      onSnapshot:(fn,err)=>poll(p,d=>snap(id,d),fn,err)};},
    collection(p){return {path:p,get:async()=>qsnap(await req("GET",p)),onSnapshot:(fn,err)=>poll(p,qsnap,fn,err)};}
  };
};
const Cloud={
  db:null, ready:false,
  async init(){try{if(window.LUDIKA_CLOUD_URL){this.db=HttpDB(window.LUDIKA_CLOUD_URL);}else if(window.claude){this.db=await claude.use("db");}}catch(e){this.db=null;}this.ready=true;},
  get on(){return !!this.db},
  async codeFree(code){const s=await this.db.doc(`sessions/${code}`).get();return !s.exists;},
  async createSession(code,data){await this.db.doc(`sessions/${code}`).set(data);},
  async getSession(code){const s=await this.db.doc(`sessions/${code}`).get();return s.exists?s.data():null;},
  async updateSession(code,patch){await this.db.doc(`sessions/${code}`).update(patch);},
  watchSession(code,fn,err){return this.db.doc(`sessions/${code}`).onSnapshot(s=>fn(s.exists?s.data():null),err);},
  watchPlayers(code,fn,err){return this.db.collection(`sessions/${code}/players`).onSnapshot(q=>fn(q.docs.map(d=>Object.assign({id:d.id},d.data()))),err);},
  async getPlayers(code){const q=await this.db.collection(`sessions/${code}/players`).get();return q.docs.map(d=>Object.assign({id:d.id},d.data()));},
  /* une écriture à la fois par document : file d'attente */
  _q:{},
  writePlayer(code,pid,data){const k=code+"/"+pid;const run=async()=>{try{await this.db.doc(`sessions/${code}/players/${pid}`).set(data);}catch(e){console.warn(e);}};
    this._q[k]=(this._q[k]||Promise.resolve()).then(run);return this._q[k];}
};

/* ============ 4. MOTEUR IA ============ */
/* Un fournisseur = un objet { name, images, json(prompt, {images, signal}) }.
   - ClaudeProvider : utilise Claude quand l'app est ouverte dans claude.ai (aucune clé nécessaire).
   - HttpProvider   : pour votre propre hébergement, appelle VOTRE serveur (qui détient la clé API).
   Pour changer de fournisseur : définir window.LUDIKA_API_URL avant ce script. */
const ClaudeProvider=sample=>({
  name:"Claude (intégré)", images:false,
  async json(prompt,opts={}){const o={signal:opts.signal,modelTier:"default",cache:false};if(opts.images)o.images=opts.images;return sample.json(prompt,o);}
});
const HttpProvider=url=>({
  name:"Serveur Ludika", images:true,
  async json(prompt,opts={},retry=true){
    const body={prompt};let code="";try{code=localStorage.getItem("ludika-access")||"";}catch(e){}
    if(opts.images){const f=opts.images;body.image={media_type:f.type,data:await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.onerror=j;fr.readAsDataURL(f);})};}
    let res;try{res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","X-Ludika-Code":code},body:JSON.stringify(body),signal:opts.signal});}
    catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled"};throw {code:"server",message:String(e)};}
    if(res.status===401&&retry){const c=window.prompt("Code d'accès enseignant (défini sur le serveur) :");
      if(!c)throw {code:"access"};try{localStorage.setItem("ludika-access",c.trim());}catch(e){}return this.json(prompt,opts,false);}
    if(!res.ok){const d=await res.json().catch(()=>({}));throw {code:d.code||"server",message:d.error||("HTTP "+res.status)};}
    const d=await res.json();return typeof d==="string"?JSON.parse(d.replace(/```json|```/g,"").trim()):d;
  }
});
const AI={
  provider:null,
  async init(){
    if(window.LUDIKA_API_URL){this.provider=HttpProvider(window.LUDIKA_API_URL);return;}
    try{const s=window.claude?await claude.use("sample"):null;
      if(s){this.provider=ClaudeProvider(s);try{const L=await s.limits();this.provider.images=!!(L&&L.images);this.provider.imageTypes=L&&L.images?L.images.mediaTypes:[];}catch(e){}}}catch(e){}
  },
  get on(){return !!this.provider},
  errorText(e){const c=e&&e.code;return ({not_granted:"Autorisez Ludika à utiliser Claude (fenêtre d'autorisation) pour générer une activité. Aucune clé API n'est nécessaire.",rate_limited:"Trop de demandes en même temps. Réessayez dans une minute.",
    cancelled:"Génération arrêtée.",image_rejected:"Cette image n'est pas lisible. Essayez une autre photo ou collez le texte.",images_unavailable:"Les photos ne sont pas disponibles ici : collez le texte du cours.",
    invalid:"L'IA a produit une activité incomplète. Relancez la génération.",server:"Le serveur de génération ne répond pas.",
    access:"Code d'accès enseignant manquant ou incorrect.",
    no_key:"Le serveur n'a pas encore de clé API : ajoutez ANTHROPIC_API_KEY dans les réglages Render (Environment).",
    no_ai:"L'IA n'est disponible que lorsque Ludika est ouvert dans Claude (aucune clé API nécessaire).",
    invalid_json:"La réponse de l'IA était trop longue ou incomplète. Réessayez avec moins de questions ou une durée plus courte.",
    prompt_too_large:"Le cours fourni est trop long : raccourcissez-le (quelques pages maximum).",
    sampling_disabled:"Claude n'est pas disponible pour ce compte ou cette organisation.",
    not_declared:"Cette page n'a pas accès à Claude. Rechargez-la.",capability_disabled:"Claude n'est pas disponible dans cette vue.",capability_removed:"Mettez à jour l'application Claude pour utiliser la génération.",
    session_expired:"Votre session Claude a expiré : reconnectez-vous puis réessayez.",
    refused:"Claude a refusé cette demande. Reformulez le thème ou le cours.",
    empty_completion:"L'IA n'a rien renvoyé. Simplifiez la demande et réessayez.",
    upstream_error:"Connexion à Claude interrompue. Réessayez dans un instant."})[c]||"La génération a échoué. Réessayez, ou simplifiez le cours fourni.";},

  SCHEMA:`FORMAT DE SORTIE — réponds UNIQUEMENT avec un objet JSON valide, sans texte ni balises autour :
{
 "titre": "titre court et motivant",
 "scenario": "2 phrases : l'histoire ou la mission qui donne du sens au jeu",
 "regles": "2 à 3 phrases simples adressées à l'élève",
 "objectif": "objectif pédagogique (commence par un verbe : Savoir..., Être capable de...)",
 "competence": "compétence travaillée",
 "prerequis": "ce que l'élève doit déjà savoir",
 "etapes": [
  {"nom":"Découverte","but":"ce que l'étape fait travailler","chrono":0,"texte":"(facultatif) texte support à lire pour la compréhension","questions":[ ... ]}
 ]
}
Chaque question a un champ "type" parmi ces 6 formes, plus "consigne" (étiquette pédagogique courte : Trouver l'intrus, Mot mystère, Corriger une phrase, Associer mot et définition, Chronologie, Calcul mental...), "question", "explication" (1 à 2 phrases qui expliquent la règle, pas seulement la réponse) et "indice" (aide courte qui ne donne pas la réponse) :
 {"type":"qcm","question":"… (utilise ___ pour un trou)","choix":["…","…","…","…"],"reponse":"copie exacte d'un choix"}
 {"type":"vf","question":"affirmation","reponse":"Vrai" ou "Faux"}
 {"type":"saisie","question":"… ___ …","reponse":"réponse courte (1 à 4 mots ou un nombre)","autres":["autres écritures acceptées"]}
 {"type":"ordre","question":"Remets … dans l'ordre","unite":"mots" ou "lettres" ou "elements","elements":["dans","le","BON","ordre"]}
 {"type":"association","question":"Associe …","paires":[["gauche","droite"],["…","…"]]}   (3 à 5 paires)
 {"type":"classement","question":"Classe …","categories":["A","B"],"elements":[["élément","A"],["élément","B"]]}   (4 à 8 éléments)`,

  RULES:`EXIGENCES DE QUALITÉ PÉDAGOGIQUE :
- Chaque question a UNE SEULE bonne réponse, sans ambiguïté possible. Pas de question d'opinion. Vérifie chaque réponse deux fois.
- Les distracteurs sont plausibles et correspondent aux erreurs typiques des élèves de ce niveau.
- Progression logique : Découverte (repérer, reconnaître) → Entraînement (appliquer la règle) → Maîtrise (phrases, contexte) → Défi (plus rapide ou plus complexe) → Challenge final (mélange et réinvestissement).
- Varie les types de questions à l'intérieur de chaque étape. Pour "ordre" en unité "lettres", un seul mot sans espace.
- "chrono" en secondes par question : 0 pour Découverte et Entraînement, 30 à 45 pour Défi, 25 à 40 pour Challenge final (adapte à la longueur des questions et au niveau).
- Langue correcte, orthographe parfaite avec accents, vocabulaire adapté à l'âge. Aucune référence à une marque, à la violence ou à un contenu sensible.`,

  buildPrompt(p){
    const S=subj(p.subject);
    const n=p.count;
    const stages=n<10?"3 étapes : Découverte, Entraînement, Challenge final":"5 étapes : Découverte, Entraînement, Maîtrise, Défi, Challenge final";
    const type=p.gameType==="auto"?`Choisis toi-même les formats de jeu les plus efficaces pour ce contenu, parmi ceux adaptés à la matière.`:
      p.gameType==="mixte"?`Activité MIXTE : chaque étape privilégie une famille différente (ex. vocabulaire, puis phrases, puis grammaire, puis défi final).`:
      `Type de jeu demandé : ${GAME_TYPES.find(g=>g.id===p.gameType).name}. Oriente la majorité des questions vers ce type${p.gameType==="defi"?" (chrono actif sur toutes les étapes sauf Découverte)":""}${p.gameType==="comprehension"?" : chaque étape (sauf Découverte) contient un court \"texte\" support à lire, et les questions portent sur ce texte":""}.`;
    return `Tu es à la fois concepteur de jeux éducatifs et expert en didactique de la matière. Tu transformes une leçon en activité de gamification pédagogique complète, prête à être jouée en classe.

CONTEXTE
- Matière : ${S.name}${S.note?` (${S.note})`:""}
- Niveau des élèves : ${p.level}
- Thème / leçon : ${p.theme}
- Difficulté : ${p.difficulty}${p.adapt?`\n- Adaptation demandée : ${p.adapt}`:""}
- Durée visée : ${p.duration} minutes, soit exactement ${n} questions au total, réparties en ${stages}.
${p.students?`- Nombre d'élèves : ${p.students}\n`:""}- ${type}
- Formats adaptés à cette matière : ${S.games}.
${p.course?`\nCOURS FOURNI PAR L'ENSEIGNANT (base-toi UNIQUEMENT sur ces informations, n'invente pas de notions absentes) :\n"""\n${p.course}\n"""`:""}${p.hasImage?`\nL'image jointe est une page de cours photographiée par l'enseignant : lis-la et base toutes les questions sur son contenu.`:""}${!p.course&&!p.hasImage?`\nAucun cours fourni : appuie-toi sur les programmes scolaires officiels pour ce niveau.`:""}${p.instructions?`\nCONSIGNES PARTICULIÈRES DE L'ENSEIGNANT : ${p.instructions}`:""}${p.avoid&&p.avoid.length?`\nNOUVELLE VERSION : crée des questions DIFFÉRENTES de celles-ci (même objectif, contenus et phrases nouveaux) :\n- ${p.avoid.slice(0,40).join("\n- ")}`:""}

${this.RULES}

${this.SCHEMA}`;
  },

  async generate(p,opts={}){
    if(!this.provider)throw {code:"no_ai"};
    const raw=await this.provider.json(this.buildPrompt(p),{signal:opts.signal,images:opts.image||undefined});
    const act=this.validate(raw,p);
    if(!act)throw {code:"invalid"};
    return act;
  },

  async addQuestions(act,k,opts={}){
    const p=act.params;
    const prompt=`Tu es expert en didactique (${subj(act.subject).name}, niveau ${act.level}). Voici une activité de gamification existante sur « ${act.theme} » :
${JSON.stringify(this.compact(act))}

Crée ${k} NOUVELLES questions qui ne répètent aucune question existante, de même niveau et même objectif, et indique pour chacune l'étape (numéro à partir de 1) où l'ajouter, en respectant la progression.
${this.RULES}
Réponds UNIQUEMENT avec : {"ajouts":[{"etape":2,"question":{...}}]} où chaque question suit exactement ce format :
${this.SCHEMA.split("Chaque question")[1]}`;
    const raw=await this.provider.json(prompt,{signal:opts.signal});
    const adds=Array.isArray(raw&&raw.ajouts)?raw.ajouts:[];
    let n=0;
    for(const a of adds){const q=this.cleanQ(a&&a.question);const i=Math.min(Math.max(1,parseInt(a&&a.etape)||2),act.stages.length)-1;if(q){act.stages[i].questions.push(q);n++;}}
    if(!n)throw {code:"invalid"};
    return n;
  },

  compact(act){return {titre:act.title,etapes:act.stages.map(s=>({nom:s.name,questions:s.questions.map(q=>q.prompt)}))};},

  /* ---- validation stricte : on ne garde que ce qui est jouable et sans ambiguïté ---- */
  str(x,max){return typeof x==="string"||typeof x==="number"?String(x).trim().slice(0,max):""},
  cleanQ(q){
    if(!q||typeof q!=="object")return null;
    const t=String(q.type||"").toLowerCase();
    const base={id:uid(),type:t,label:this.str(q.consigne,50),prompt:this.str(q.question,400),explanation:this.str(q.explication,500),hint:this.str(q.indice,200)};
    if(!base.prompt)return null;
    if(t==="qcm"){
      let ch=Array.isArray(q.choix)?[...new Set(q.choix.map(c=>this.str(c,160)).filter(Boolean))]:[];
      let ans=this.str(q.reponse,160);
      if(/^\d+$/.test(ans)&&!ch.includes(ans)&&ch[+ans])ans=ch[+ans];
      if(ch.length<2||ch.length>5||!ch.includes(ans))return null;
      return Object.assign(base,{choices:ch,answer:ans});
    }
    if(t==="vf"){
      const r=norm(q.reponse);const ans=["vrai","true","v"].includes(r)?"Vrai":["faux","false","f"].includes(r)?"Faux":"";
      if(!ans)return null;return Object.assign(base,{answer:ans});
    }
    if(t==="saisie"){
      const ans=this.str(q.reponse,80);if(!ans)return null;
      return Object.assign(base,{answer:ans,alts:Array.isArray(q.autres)?q.autres.map(a=>this.str(a,80)).filter(Boolean).slice(0,6):[]});
    }
    if(t==="ordre"){
      let unit=["mots","lettres","elements"].includes(q.unite)?q.unite:"mots";
      let items=Array.isArray(q.elements)?q.elements.map(e=>this.str(e,120)).filter(Boolean):[];
      if(unit==="lettres"&&items.length===1)items=[...items[0]];
      if(items.length<2||items.length>12)return null;
      if(new Set(items.map(norm)).size===1)return null;
      return Object.assign(base,{unit,items});
    }
    if(t==="association"){
      let pairs=Array.isArray(q.paires)?q.paires.filter(p=>Array.isArray(p)&&p.length>=2).map(p=>[this.str(p[0],120),this.str(p[1],120)]).filter(p=>p[0]&&p[1]):[];
      const L=new Set(pairs.map(p=>norm(p[0]))),R=new Set(pairs.map(p=>norm(p[1])));
      if(pairs.length<2||pairs.length>6||L.size!==pairs.length||R.size!==pairs.length)return null;
      return Object.assign(base,{pairs});
    }
    if(t==="classement"){
      const cats=Array.isArray(q.categories)?[...new Set(q.categories.map(c=>this.str(c,60)).filter(Boolean))]:[];
      const items=Array.isArray(q.elements)?q.elements.filter(e=>Array.isArray(e)&&e.length>=2).map(e=>[this.str(e[0],120),this.str(e[1],60)]).filter(e=>e[0]&&cats.includes(e[1])):[];
      if(cats.length<2||cats.length>4||items.length<3||items.length>10)return null;
      return Object.assign(base,{categories:cats,items});
    }
    return null;
  },
  validate(raw,p){
    if(!raw||typeof raw!=="object"||!Array.isArray(raw.etapes))return null;
    const stages=raw.etapes.map((s,i)=>({
      name:this.str(s&&s.nom,40)||STAGE_NAMES[i]||("Étape "+(i+1)),
      goal:this.str(s&&s.but,200),
      timer:Math.max(0,Math.min(120,parseInt(s&&s.chrono)||0)),
      support:this.str(s&&s.texte,2500),
      questions:(Array.isArray(s&&s.questions)?s.questions:[]).map(q=>this.cleanQ(q)).filter(Boolean)
    })).filter(s=>s.questions.length);
    if(!stages.length||stages.reduce((n,s)=>n+s.questions.length,0)<3)return null;
    stages.forEach((s,i)=>s.final=i===stages.length-1);
    return {
      id:uid(),version:1,source:"ia",
      title:this.str(raw.titre,80)||p.theme,
      scenario:this.str(raw.scenario,400),rules:this.str(raw.regles,400),
      objective:this.str(raw.objectif,300),competence:this.str(raw.competence,200),prereq:this.str(raw.prerequis,200),
      subject:p.subject,level:p.level,theme:p.theme,difficulty:p.difficulty,duration:p.duration,gameType:p.gameType,
      stages,params:Object.assign({},p,{avoid:undefined}),
      createdAt:Date.now(),updatedAt:Date.now()
    };
  }
};

function correctText(q){
  if(q.type==="ordre")return q.items.join(q.unit==="lettres"?"":q.unit==="mots"?" ":" → ");
  if(q.type==="association")return q.pairs.map(p=>`${p[0]} = ${p[1]}`).join(" · ");
  if(q.type==="classement")return q.categories.map(c=>`${c} : ${q.items.filter(i=>i[1]===c).map(i=>i[0]).join(", ")}`).join(" · ");
  return q.answer;
}
function promptHTML(p){return esc(p).replace(/_{3,}/g,'<span class="gap"></span>');}
function masteryOf(p){return MASTERY.find(m=>p>=m[0]);}

class Game{
  constructor(act,opts){

    window.scrollTo(0,0);
  }
  quit(){this.destroy();this.o.onQuit&&this.o.onQuit();}
  start(){this.intro();}
  intro(){
    const a=this.act;
    this.shell(`<div class="qcard">
      <div class="tags" style="margin-bottom:10px"><span class="tag">${this.S.em} ${esc(this.S.name)}</span><span class="tag">${esc(a.level)}</span><span class="tag">${this.flat.length} questions</span></div>

      ${a.scenario?`<p style="font-size:1.1rem">${esc(a.scenario)}</p>`:""}
      ${a.rules?`<p class="muted">${esc(a.rules)}</p>`:""}
      <div class="card" style="box-shadow:none;background:var(--surface2);margin:14px 0">
        <b>Barème</b><div class="small muted">+${SCORING.correct} par bonne réponse · +${SCORING.streak} tous les ${SCORING.streakEvery} bonnes réponses d'affilée · +${SCORING.stage} par étape terminée · +${SCORING.final} si le challenge final est réussi · l'indice coûte ${SCORING.hint} points</div></div>
      <div class="tags" style="margin-bottom:16px">${a.stages.map((s,i)=>`<span class="tag">${i+1}. ${esc(s.name)}${s.timer&&this.o.chrono?" ⏱️":""}</span>`).join("")}</div>
      <button class="btn primary big" data-go style="width:100%">Commencer</button></div>`);
    this.root.querySelector("[data-go]").onclick=()=>this.stageIntro();
  }
  stageIntro(){
    const s=this.stage,i=this.st.si;

    this.shell(`<div class="qcard interlude" style="--c:${c}">
      <div class="big">${s.final?"🏆":["🌱","🎯","⭐","🔥","🏆"][Math.min(i,4)]}</div>
      <div class="muted">Étape ${i+1} sur ${this.act.stages.length}</div>
      <h2>${esc(s.name)}</h2>
      ${s.goal?`<p class="muted">${esc(s.goal)}</p>`:""}
      <p><b>${s.questions.length} question${s.questions.length>1?"s":""}</b>${s.timer&&this.o.chrono?` · ⏱️ ${s.timer} secondes par question`:""}</p>
      <button class="btn primary big" data-go>C'est parti</button></div>`);
    this.root.querySelector("[data-go]").onclick=()=>this.ask();

  }
  ask(){

    this.shell(`<div class="stagebanner" style="--c:${c}"><span class="tag">${esc(s.name)} · ${this.st.qi+1}/${s.questions.length}</span>
      <div class="chips"><span class="streak">${this.st.streak>=2?`🔥 ${this.st.streak}`:""}</span><span class="timer hidden" id="tm"></span></div></div>
      <div class="qcard" ${this.S.rtl?'dir="auto"':""}>
        ${s.support?`<div class="support"><b class="small">Texte à lire</b><br>${esc(s.support)}</div>`:""}
        <div class="qtype">${esc(q.label||QTYPES[q.type])}</div>
        <div class="prompt">${promptHTML(q.prompt)}</div>
        <div id="zone"></div>
        <div class="qactions" id="qa">
          <div style="display:flex;gap:8px">${q.hint?`<button class="btn sm" id="hintBtn">💡 Indice (−${SCORING.hint})</button>`:""}<button class="btn sm" id="ttsBtn" aria-label="Lire la question à voix haute">🔊</button></div>
          <div id="qaRight"></div></div>
        <div id="fb"></div></div>`);
    const hb=$("#hintBtn");if(hb)hb.onclick=()=>{if(this.usedHint)return;this.usedHint=true;this.st.hints++;this.st.score=Math.max(0,this.st.score-SCORING.hint);
      hb.outerHTML=`<span class="small muted" style="align-self:center">💡 ${esc(q.hint)}</span>`;this.updScore();};
    $("#ttsBtn").onclick=()=>speak((s.support&&this.st.qi===0?s.support+". ":"")+q.prompt.replace(/_{3,}/g," ... "),this.S.lang);

  startTimer(sec){
    const el=$("#tm");el.classList.remove("hidden");const end=Date.now()+sec*1000;this.st.timed++;
    const tick=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=`⏱️ ${left}s`;el.classList.toggle("low",left<=5);

  }
  onKey(e){
    if(e.target&&["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;
    if(!this.locked&&this.q&&(this.q.type==="qcm"||this.q.type==="vf")){const n=parseInt(e.key);const b=$$("#zone .opt")[n-1];if(b){b.click();}}
  }
  /* ---- rendus par type ---- */
  r_qcm(q,z){
    const ch=shuffle(q.choices);const short=ch.every(c=>c.length<=16)&&ch.length<=4;
    z.innerHTML=`<div class="opts ${short?"two":""}">${ch.map((c,i)=>`<button class="opt" data-v="${esc(c)}"><span class="k">${i+1}</span><span>${esc(c)}</span></button>`).join("")}</div>`;
    z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(this.locked)return;const ok=b.dataset.v===q.answer;
      z.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.v===q.answer)x.classList.add("good");});if(!ok)b.classList.add("bad");

  }
  r_vf(q,z){q=Object.assign({},q,{choices:["Vrai","Faux"]});
    z.innerHTML=`<div class="opts two">${["Vrai","Faux"].map((c,i)=>`<button class="opt" data-v="${c}" style="justify-content:center"><span class="k">${i+1}</span><span>${c==="Vrai"?"✔️ Vrai":"✖️ Faux"}</span></button>`).join("")}</div>`;
    z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(this.locked)return;const ok=b.dataset.v===q.answer;
      z.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.v===q.answer)x.classList.add("good");});if(!ok)b.classList.add("bad");this.finishQ(ok);});
  }
  r_saisie(q,z){
    z.innerHTML=`<input type="text" class="typein" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écris ta réponse" aria-label="Ta réponse" ${this.S.rtl?'dir="auto"':""}>`;

    const inp=$("#tin");if(/^[-\d.,\s]+$/.test(q.answer))inp.inputMode="decimal";
    const go=()=>{if(this.locked)return;const v=inp.value.trim();if(!v){inp.focus();return;}
      const ok=[q.answer,...(q.alts||[])].some(a=>norm(a)===norm(v));inp.disabled=true;
      inp.style.borderColor=ok?"var(--ok)":"var(--bad)";inp.style.background=ok?"var(--ok-bg)":"var(--bad-bg)";
      const gap=this.root.querySelector(".prompt .gap");if(gap)gap.textContent=q.answer;this.finishQ(ok);};
    $("#ok").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go();};setTimeout(()=>inp.focus(),60);
  }
  r_ordre(q,z){
    let pool=q.items.map((t,i)=>({t,i}));let sh;let tries=0;
    do{sh=shuffle(pool);tries++;}while(tries<20&&sh.every((x,k)=>norm(x.t)===norm(q.items[k])));
    const picked=[];const sep=q.unit==="lettres"?"":" ";
    z.innerHTML=`<div class="answerline" id="al" aria-live="polite"><span class="muted small">Touche les ${q.unit==="lettres"?"lettres":q.unit==="mots"?"mots":"éléments"} dans le bon ordre</span></div><div class="tokens" id="tk">${sh.map(x=>`<button class="tok" data-i="${x.i}">${esc(x.t)}</button>`).join("")}</div>`;
    $("#qaRight").innerHTML=`<button class="btn sm" id="clr">Effacer</button> <button class="btn primary" id="ok" disabled>Valider</button>`;
    const draw=()=>{const al=$("#al");al.innerHTML=picked.length?picked.map((x,k)=>`<button class="tok" data-k="${k}">${esc(x.t)}</button>`).join(""):`<span class="muted small">Touche les éléments dans le bon ordre</span>`;
      al.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{if(this.locked)return;const x=picked.splice(+b.dataset.k,1)[0];z.querySelector(`#tk [data-i="${x.i}"]`).disabled=false;draw();});
      $("#ok").disabled=picked.length!==q.items.length;};
    z.querySelectorAll("#tk .tok").forEach(b=>b.onclick=()=>{if(this.locked)return;b.disabled=true;picked.push(pool[+b.dataset.i]);draw();});
    $("#clr").onclick=()=>{if(this.locked)return;picked.length=0;z.querySelectorAll("#tk .tok").forEach(b=>b.disabled=false);draw();};
    $("#ok").onclick=()=>{if(this.locked)return;const ok=picked.every((x,k)=>norm(x.t)===norm(q.items[k]));
      $("#al").classList.add(ok?"good":"bad");z.querySelectorAll(".tok").forEach(b=>b.disabled=true);$("#clr").disabled=true;$("#ok").disabled=true;this.finishQ(ok);};
  }
  r_association(q,z){
    const right=shuffle(q.pairs.map(p=>p[1]));let sel=null,errors=0,done=0;
    z.innerHTML=`<p class="small muted" style="margin-top:-8px">Touche un élément à gauche, puis sa correspondance à droite.</p><div class="pairs"><div class="col">${q.pairs.map((p,i)=>`<button class="opt" data-l="${i}">${esc(p[0])}</button>`).join("")}</div>
      <div class="col">${right.map(r=>`<button class="opt" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>`;
    z.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{if(this.locked||b.classList.contains("done"))return;z.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("pick"));b.classList.add("pick");sel=+b.dataset.l;});
    z.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(this.locked||sel===null||b.classList.contains("done"))return;
      const L=z.querySelector(`[data-l="${sel}"]`);
      if(q.pairs[sel][1]===b.dataset.r){[L,b].forEach(x=>{x.classList.remove("pick");x.classList.add("good","done");x.disabled=true;});done++;sel=null;
        if(done===q.pairs.length)this.finishQ(errors===0,{note:errors?`${errors} erreur${errors>1?"s":""} d'association`:""});}
      else{errors++;b.classList.add("bad");sound(false);setTimeout(()=>b.classList.remove("bad"),400);}});
  }
  r_classement(q,z){
    const items=shuffle(q.items);const pick={};
    z.innerHTML=items.map((it,k)=>`<div class="cls-row"><b>${esc(it[0])}</b><div class="seg" data-k="${k}">${q.categories.map(c=>`<button data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join("")}</div></div>`).join("");
    $("#qaRight").innerHTML=`<button class="btn primary" id="ok" disabled>Valider</button>`;
    z.querySelectorAll(".seg").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(this.locked)return;pick[sg.dataset.k]=b.dataset.c;
      sg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#ok").disabled=Object.keys(pick).length!==items.length;}));
    $("#ok").onclick=()=>{if(this.locked)return;let ok=true;
      z.querySelectorAll(".seg").forEach(sg=>{const it=items[sg.dataset.k];const good=pick[sg.dataset.k]===it[1];if(!good)ok=false;
        sg.querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.dataset.c===it[1]){b.style.background="var(--ok)";b.style.borderColor="var(--ok)";b.style.color="#fff";}
          else if(b.getAttribute("aria-pressed")==="true"){b.style.background="var(--bad)";b.style.borderColor="var(--bad)";b.style.color="#fff";}});});
      $("#ok").disabled=true;this.finishQ(ok);};
  }
  /* ---- correction et points ---- */
  finishQ(ok,extra={}){
    if(this.locked)return;this.locked=true;clearInterval(this.timer);
    const q=this.q,st=this.st,sr=st.stageRes[st.si];let gained=0;const notes=[];
    st.answered++;
    if(ok){st.correct++;sr.correct++;st.streak++;st.best=Math.max(st.best,st.streak);gained+=SCORING.correct;
      if(st.streak%SCORING.streakEvery===0){gained+=SCORING.streak;notes.push(`🔥 Série de ${st.streak} : +${SCORING.streak}`);}
      if(this.o.chrono&&this.stage.timer)st.timedOk++;}
    else{st.streak=0;st.wrong.push({stage:this.stage.name,prompt:q.prompt,answer:correctText(q),explanation:q.explanation});}
    st.score+=gained;sr.points+=gained;
    st.answers[this.idx]=ok?1:0;
    sound(ok);if(gained)this.pop(`+${gained}`);this.updScore();
    $$("#zone input, #zone button, #qaRight button").forEach(b=>b.disabled=true);
    const hb=$("#hintBtn");if(hb)hb.disabled=true;
    const last=this.idx===this.flat.length-1;
    $("#qaRight").innerHTML="";
    $("#fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}" role="status">
      <b class="t">${ok?"✅ "+rnd(CHEERS_OK):extra.timeout?"⏱️ Temps écoulé !":"❌ "+rnd(CHEERS_KO)}</b>
      ${!ok&&(q.type!=="association"||extra.timeout)?`<div><b>Bonne réponse :</b> ${esc(correctText(q))}</div>`:""}
      ${extra.note?`<div>${esc(extra.note)}</div>`:""}
      ${q.explanation?`<div style="margin-top:4px">💡 ${esc(q.explanation)}</div>`:""}
      ${notes.map(n=>`<div style="margin-top:4px;font-weight:700">${n}</div>`).join("")}
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" id="nx">${last?"Voir mes résultats":this.st.qi===this.stage.questions.length-1?"Terminer l'étape":"Question suivante"}</button></div></div>`;
    $("#nx").onclick=()=>this.next();
    setTimeout(()=>{const b=$("#nx");if(b){b.focus({preventScroll:true});b.scrollIntoView({block:"nearest",behavior:"smooth"});}},80);
    this.emit(false);
  }
  pop(t){const p=document.createElement("div");p.className="pop";p.textContent=t;document.body.appendChild(p);setTimeout(()=>p.remove(),1000);}
  next(){
    const s=this.stage;
    if(this.st.qi<s.questions.length-1){this.st.qi++;return this.ask();}
    const sr=this.st.stageRes[this.st.si];let bonus=SCORING.stage,msg=`Étape terminée : +${SCORING.stage}`;
    if(s.final&&pct(sr.correct,sr.total)>=50){bonus+=SCORING.final;msg+=` · Challenge final réussi : +${SCORING.final}`;}
    this.st.score+=bonus;sr.points+=bonus;
    if(this.st.si<this.act.stages.length-1){
      this.st.si++;this.st.qi=0;this.emit(false);this.toastBonus(msg);this.stageIntro();
    }else{this.toastBonus(msg);this.end();}
  }
  toastBonus(m){toast("🎉 "+m);}
  snapshot(finished){const st=this.st;return {score:st.score,correct:st.correct,answered:st.answered,total:this.flat.length,stage:st.si+1,stageName:this.stage.name,answers:this.flat.map((_,i)=>st.answers[i]===undefined?-1:st.answers[i]),finished,streak:st.streak,updatedAt:Date.now()};}

  end(){

    const badges=[];
    if(p===100)badges.push(["💎","Sans faute","Toutes les réponses sont justes."]);
    if(st.best>=5)badges.push(["🔥","Série de feu",`${st.best} bonnes réponses d'affilée.`]);
    if(st.timed>=3&&st.timedOk===st.timed)badges.push(["⏱️","Maître du chrono","Aucune erreur contre la montre."]);
    const fin=st.stageRes[st.stageRes.length-1];if(pct(fin.correct,fin.total)>=50)badges.push(["🏆","Challenge final réussi","Tu as relevé le dernier défi."]);
    if(!st.hints&&p>=70)badges.push(["🧠","Sans indice","Réussi sans aucune aide."]);
    if(!badges.length)badges.push(["🌱","Persévérance","Tu es allé jusqu'au bout : c'est comme ça qu'on progresse."]);
    const r={id:uid(),activityId:this.act.id,title:this.act.title,subject:this.act.subject,score:st.score,correct:st.correct,total:this.flat.length,percent:p,
      mastery:m[1],masteryEm:m[2],bestStreak:st.best,hints:st.hints,seconds:Math.round((Date.now()-st.t0)/1000),stages:st.stageRes,wrong:st.wrong,badges,date:Date.now()};
    this.emit(true);
    this.o.onEnd&&this.o.onEnd(r);
  }
}
function adviceFor(r,act){
  const out=[];
  r.stages.forEach((s,i)=>{const p=pct(s.correct,s.total);const goal=act&&act.stages[i]&&act.stages[i].goal;
    if(p<70)out.push(`<b>${esc(s.name)}</b> (${p} %) : à retravailler${goal?` — ${esc(goal.replace(/\.$/,""))}`:""}.`);});
  if(!out.length)out.push("Toutes les étapes sont réussies. Tu peux passer à un niveau plus difficile !");
  if(r.hints>2)out.push("Tu as utilisé plusieurs indices : relis la règle avant de rejouer, puis essaie sans aide.");
  if(r.bestStreak<3&&r.percent<60)out.push("Prends ton temps : lis la question jusqu'au bout avant de répondre.");
  return out;
}

    <h3 style="margin:20px 0 10px">📊 Résultats par étape</h3>

    <div class="toolbar" style="justify-content:center;margin-top:22px">${actions||""}</div>
  </div></div>`;
}

async function importFile(f){
  const st=$("#fFileSt");if(!f)return;UI.image=null;
  const put=t=>{t=stripText(t).slice(0,30000);FORM.course=(FORM.course?FORM.course+"\n\n":"")+t;$("#fCourse").value=FORM.course;};
  try{
    if(f.type.startsWith("image/")){
      await AI.readyP;
      if(!(AI.on&&AI.provider.images)){st.textContent="Les photos ne sont pas prises en charge ici : collez le texte du cours.";return;}
      UI.image=f;st.textContent=`📷 ${f.name} : l'IA lira cette page.`;return;}
    st.textContent="Lecture du fichier…";
    if(/\.(txt|md)$/i.test(f.name)||f.type.startsWith("text/")){put(await f.text());}
    else if(/\.pdf$/i.test(f.name)){
      await loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
      const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;let out=[];
      for(let i=1;i<=Math.min(pdf.numPages,30);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();out.push(c.items.map(x=>x.str).join(" "));}
      const txt=out.join("\n\n");if(stripText(txt).length<20){st.textContent="Ce PDF ne contient pas de texte lisible (scan ?). Prenez plutôt une photo de la page.";return;}
      put(txt);}
    else if(/\.docx$/i.test(f.name)){
      await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js");
      const r=await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});put(r.value);}
    else{st.textContent="Format non pris en charge : PDF, Word (.docx), texte ou image.";return;}
    st.textContent=`✅ ${f.name} importé dans le cours ci-dessus.`;
  }catch(e){console.warn(e);st.textContent="Impossible de lire ce fichier. Copiez-collez le texte à la place.";}
}
function formParams(){const F=FORM;return {subject:F.subject,level:F.level,theme:F.theme.trim(),course:stripText(F.course).slice(0,30000),difficulty:F.difficulty,duration:F.duration,count:F.count,
  students:F.students?parseInt(F.students):"",gameType:F.gameType,instructions:F.instructions.trim(),chrono:F.chrono};}
async function createFromForm(){
  const p=formParams();
  if(!p.theme&&!p.course&&!UI.image){$("#fErr").textContent="Indiquez au moins un thème ou fournissez un cours.";$("#fTheme").focus();return;}
  if(!p.theme)p.theme=p.course?"Leçon fournie par l'enseignant":"Page de cours photographiée";
  await AI.readyP;
  if(!AI.on){$("#fErr").textContent="L'IA n'est pas connectée ici. Ouvrez Ludika dans Claude, ou testez l'exemple de la Bibliothèque.";return;}
  runAI("create",async signal=>{const a=await AI.generate(Object.assign({},p,{hasImage:!!UI.image}),{signal,image:UI.image});a.chrono=p.chrono;return a;},
    a=>{Store.upsertGame(a);UI.fresh=true;UI.undo=null;preview(a.id);},()=>dash("create"));
}
const GEN_STEPS={
  create:["Analyse de la leçon et du niveau","Choix des formats de jeu","Rédaction des questions et des distracteurs","Vérification des réponses","Construction de la progression et du barème"],
  regen:["Relecture de l'objectif pédagogique","Invention de nouvelles questions","Vérification des réponses","Mise en forme de la nouvelle version"],
  adapt:["Analyse de l'activité actuelle","Ajustement de la difficulté","Réécriture des questions","Vérification des réponses"],
  add:["Relecture des questions existantes","Rédaction de nouvelles questions","Vérification des réponses"]
};
function runAI(kind,job,done,back){
  cleanup();UI.view="gen";const ctl=new AbortController();UI.ctl=ctl;
  const steps=GEN_STEPS[kind];let k=0;
  APP().innerHTML=`<div class="wrap"><header class="topbar">${logoHTML}</header><div class="card gen" style="max-width:560px;margin:20px auto">
    <div class="spin" aria-hidden="true"></div><h2 style="font-size:1.6rem">${kind==="create"?"L'IA crée votre gamification…":"L'IA prépare une nouvelle version…"}</h2>
    <p class="muted">Cela prend en général entre 30 secondes et 2 minutes.</p>
    <ol id="gs">${steps.map((s,i)=>`<li class="${i===0?"on":""}">${s}</li>`).join("")}</ol>
    <button class="btn" id="gStop">Arrêter</button></div></div>`;
  bindHome();
  const iv=setInterval(()=>{k=Math.min(k+1,steps.length-1);$$("#gs li").forEach((li,i)=>li.classList.toggle("on",i===k));},9000);
  $("#gStop").onclick=()=>ctl.abort();
  const stale=()=>UI.ctl!==ctl;
  job(ctl.signal).then(r=>{clearInterval(iv);if(stale())return;UI.ctl=null;done(r);}).catch(e=>{clearInterval(iv);console.warn(e);
    const mine=!stale();if(mine)UI.ctl=null;
    if(e&&(e.code==="cancelled"||e.name==="AbortError")){if(mine){toast("Génération arrêtée.");back();}return;}
    if(!mine)return;
    toast(AI.errorText(e),6000);back();});
}

function editQ(a,si,qi){
  const q=a.stages[si].questions[qi];const box=$(`#eq-${si}-${qi}`);
  let data="";
  if(q.type==="qcm")data=`<label class="small"><b>Choix</b> (un par ligne, la bonne réponse en premier)</label><textarea id="x">${esc([q.answer,...q.choices.filter(c=>c!==q.answer)].join("\n"))}</textarea>`;
  else if(q.type==="vf")data=`<label class="small"><b>Réponse</b></label><select id="x"><option ${q.answer==="Vrai"?"selected":""}>Vrai</option><option ${q.answer==="Faux"?"selected":""}>Faux</option></select>`;
  else if(q.type==="saisie")data=`<label class="small"><b>Réponse</b> (puis autres écritures acceptées, une par ligne)</label><textarea id="x" style="min-height:70px">${esc([q.answer,...(q.alts||[])].join("\n"))}</textarea>`;
  else if(q.type==="ordre")data=`<label class="small"><b>Éléments dans le bon ordre</b> (un par ligne)</label><textarea id="x">${esc(q.items.join("\n"))}</textarea>`;
  else if(q.type==="association")data=`<label class="small"><b>Paires</b> (une par ligne : gauche = droite)</label><textarea id="x">${esc(q.pairs.map(p=>p.join(" = ")).join("\n"))}</textarea>`;
  else if(q.type==="classement")data=`<label class="small"><b>Catégories</b> (séparées par ;)</label><input type="text" id="x2" value="${esc(q.categories.join(" ; "))}"><label class="small"><b>Éléments</b> (un par ligne : élément = catégorie)</label><textarea id="x">${esc(q.items.map(i=>i.join(" = ")).join("\n"))}</textarea>`;
  box.innerHTML=`<div class="qedit"><label class="small"><b>Question</b> (___ pour un trou)</label><input type="text" id="xp" value="${esc(q.prompt)}">${data}
    <label class="small"><b>Explication</b></label><input type="text" id="xe" value="${esc(q.explanation)}"><label class="small"><b>Indice</b></label><input type="text" id="xh" value="${esc(q.hint)}">
    <div class="toolbar" style="margin:4px 0 0"><button class="btn sm primary" id="xs">Valider</button></div><div id="xerr" class="small" style="color:var(--bad)"></div></div>`;
  $("#xs").onclick=()=>{
    const lines=v=>v.split("\n").map(s=>s.trim()).filter(Boolean);
    const raw={type:q.type,consigne:q.label,question:$("#xp").value,explication:$("#xe").value,indice:$("#xh").value};
    const x=$("#x")&&$("#x").value;
    if(q.type==="qcm"){const l=lines(x);raw.choix=l;raw.reponse=l[0];}
    if(q.type==="vf")raw.reponse=x;
    if(q.type==="saisie"){const l=lines(x);raw.reponse=l[0];raw.autres=l.slice(1);}
    if(q.type==="ordre"){raw.unite=q.unit;raw.elements=lines(x);}
    if(q.type==="association")raw.paires=lines(x).map(l=>l.split("=").map(s=>s.trim()));
    if(q.type==="classement"){raw.categories=$("#x2").value.split(";").map(s=>s.trim()).filter(Boolean);raw.elements=lines(x).map(l=>l.split("=").map(s=>s.trim()));}
    const c=AI.cleanQ(raw);if(!c){$("#xerr").textContent="Question incomplète ou ambiguë : vérifiez les réponses (la bonne réponse doit exister, sans doublon).";return;}
    c.id=q.id;a.stages[si].questions[qi]=c;Store.upsertGame(a);toast("Question modifiée");preview(a.id,true);
  };
}
const LV_FLAT=LEVELS.flatMap(g=>g[1]);
function aiTransform(a,cmd){
  AI.readyP.then(()=>{
  if(!AI.on)return toast("L'IA n'est pas connectée ici. Ouvrez Ludika dans Claude pour utiliser cette fonction.",4000);
  const base=Object.assign({},a.params||{},{subject:a.subject,level:a.level,theme:a.theme,difficulty:a.difficulty,duration:a.duration,gameType:a.gameType,count:allQs(a).length});
  const prev=clone(a);
  const keep=n=>{n.id=a.id;n.version=(a.version||1)+1;n.chrono=a.chrono;n.source=a.source==="demo"?"ia":a.source;n.createdAt=a.createdAt;return n;};
  const finish=n=>{UI.undo=prev;Store.upsertGame(n);UI.fresh=false;toast(`Version ${n.version} créée`);preview(n.id);};
  const back=()=>preview(a.id);
  if(cmd==="add")return runAI("add",async signal=>{const c=clone(a);const k=await AI.addQuestions(c,5,{signal});c.version=(a.version||1)+1;toast(`${k} questions ajoutées`);return c;},finish,back);
  const p=Object.assign({},base,{avoid:allQs(a).map(q=>q.prompt)});
  const di=DIFFS.indexOf(a.difficulty);const li=LV_FLAT.indexOf(a.level);
  if(cmd==="easier"){p.difficulty=DIFFS[Math.max(0,di-1)];p.adapt="Rends l'activité nettement plus facile : phrases plus courtes, notions de base, distracteurs moins proches, plus d'indices.";}
  if(cmd==="harder"){p.difficulty=DIFFS[Math.min(2,di+1)];p.adapt="Rends l'activité nettement plus difficile : cas particuliers, pièges fréquents, questions de transfert, chrono plus court.";}
  if(cmd==="lower"){p.level=li>0?LV_FLAT[li-1]:a.level;p.adapt=`Adapte au niveau scolaire inférieur (${p.level}).`;}
  if(cmd==="upper"){p.level=li>=0&&li<LV_FLAT.length-1?LV_FLAT[li+1]:a.level;p.adapt=`Adapte au niveau scolaire supérieur (${p.level}).`;}
  if(cmd==="struggling")p.adapt="Adapte pour des élèves en difficulté : consignes très courtes, vocabulaire simple, une notion à la fois, indices plus guidants, pas de chrono sauf au Challenge final, explications très concrètes.";
  if(cmd==="advanced")p.adapt="Adapte pour des élèves avancés : approfondissement, cas complexes, questions de réflexion et de transfert, chrono plus exigeant.";
  runAI(cmd==="regen"?"regen":"adapt",signal=>AI.generate(p,{signal}).then(keep),finish,back);
  });
}

/* ---------- Jeu (test enseignant ou élève seul) ---------- */
function runGame(act,{back,chrono,onEnd,onProgress,endActions}){
  cleanup();UI.view="play";
  APP().innerHTML="";
  const g=new Game(act,{chrono:chrono!==undefined?chrono:(act.chrono!==false&&Store.settings.chrono),onQuit:back,onProgress,
    onEnd:r=>{UI.game=null;onEnd?onEnd(r):defaultEnd(act,r,back);}});
  UI.game=g;g.start();
}
function defaultEnd(act,r,back){
  APP().innerHTML=resultsHTML(r,act,{actions:`<button class="btn primary" id="rAgain">▶️ Rejouer</button><button class="btn" id="rBack">Retour</button>`});
  $("#rAgain").onclick=()=>runGame(act,{back});$("#rBack").onclick=back;window.scrollTo(0,0);
}
function playTest(id){
  const a=Store.game(id);if(!a)return;
  runGame(a,{back:()=>preview(a.id),onEnd:r=>{
    Store.addPlay(Object.assign({mode:"test"},r));
    APP().innerHTML=resultsHTML(r,a,{actions:`<button class="btn pencil" id="rNew">🔄 Refaire avec de nouvelles questions</button><button class="btn primary" id="rAgain">▶️ Rejouer</button><button class="btn" id="rBack">Retour à l'activité</button>`});
    $("#rAgain").onclick=()=>playTest(a.id);$("#rBack").onclick=()=>preview(a.id);
    $("#rNew").onclick=()=>{AI.readyP.then(()=>{if(!AI.on)return toast("L'IA n'est pas connectée ici.",3500);
      const p=Object.assign({},a.params||{},{subject:a.subject,level:a.level,theme:a.theme,difficulty:a.difficulty,duration:a.duration,gameType:a.gameType,count:allQs(a).length,avoid:allQs(a).map(q=>q.prompt)});
      runAI("regen",signal=>AI.generate(p,{signal}),n=>{n.id=a.id;n.version=(a.version||1)+1;n.chrono=a.chrono;n.createdAt=a.createdAt;UI.undo=clone(a);Store.upsertGame(n);toast("Nouvelles questions prêtes");playTest(n.id);},()=>preview(a.id));});};
    window.scrollTo(0,0);
  }});
}

function sessionStats(players,act){
  const n=players.length,fin=players.filter(p=>p.finished).length;
  const avg=n?Math.round(players.reduce((s,p)=>s+pct(p.correct||0,Math.max(1,p.answered||0)),0)/n):0;
  const qs=act?allQs(act):[];const err=qs.map((q,i)=>{let a=0,w=0;players.forEach(p=>{const v=(p.answers||[])[i];if(v===0||v===1){a++;if(v===0)w++;}});return {q,rate:a?pct(w,a):0,a};})
    .filter(x=>x.a>0).sort((x,y)=>y.rate-x.rate).slice(0,6);
  return {n,fin,avg,err};
}

    UI.unsubs.push(Cloud.watchPlayers(code,ps=>{players=ps;draw();},e=>toast("Suivi en direct interrompu : rechargez la page.")));
    UI.unsubs.push(Cloud.watchSession(code,d=>{if(d){S.status=d.status;S.leaderboard=d.leaderboard;draw();}}));
  }else if(sess.demo&&(S.status==="lobby"||(hw&&S.status==="live"&&!players.length))){
    const names=[["Adam","a2"],["Lina","a1"],["Yasmine","a5"],["Noah","a6"],["Inès","a7"],["Rayan","a4"],["Sara","a3"],["Malik","a9"],["Emma","a8"],["Youssef","a0"]];
    let k=0;const total=act?allQs(act).length:10;
    const add=setInterval(()=>{if(k>=names.length||UI.view!=="live"){clearInterval(add);return;}const [n,av]=names[k++];
      players.push({pseudo:n,avatar:av,score:0,correct:0,answered:0,total,stage:1,finished:false,answers:Array(total).fill(-1),skill:.45+Math.random()*.5});draw();},700);
    UI.unsubs.push(()=>clearInterval(add));
    if(hw){setTimeout(()=>{if(UI.view==="live")simulate();},1500);}
  }
  function simulate(){
    const stages=act?act.stages.map(s=>s.questions.length):[players[0]?players[0].total:10];
    UI.sim=setInterval(()=>{let all=true;players.forEach(p=>{if(p.finished)return;all=false;if(Math.random()<.45){const i=p.answered;const ok=Math.random()<(p.skill||.7);
      p.answers[i]=ok?1:0;p.answered++;if(ok){p.correct++;p.score+=SCORING.correct;}let acc=0,si=0;for(;si<stages.length;si++){acc+=stages[si];if(p.answered<acc)break;}p.stage=Math.min(si+1,stages.length);
      if(p.answered>=p.total){p.finished=true;p.score+=SCORING.stage;}}});draw();if(all){clearInterval(UI.sim);UI.sim=null;persist();}},900);
  }
  draw();
}

function studentSession(code,sess,pseudo,avatar){
  cleanup();UI.view="student";
  const act=sess.activity;const total=allQs(act).length;
  let pid;try{pid=localStorage.getItem("ludika-pid-"+code);}catch(e){}
  if(!pid){pid=uid();try{localStorage.setItem("ludika-pid-"+code,pid);}catch(e){}}
  const base={pseudo,avatar,total,joinedAt:Date.now(),attempts:1,best:0,bestCorrect:0};
  const first=()=>Cloud.writePlayer(code,pid,Object.assign({},base,{score:0,correct:0,answered:0,stage:1,finished:false,answers:Array(total).fill(-1),updatedAt:Date.now()}));
  if(sess.homework){Cloud.getPlayers(code).then(ps=>{const prev=ps.find(p=>p.id===pid);
      if(prev){base.attempts=(prev.attempts||1)+1;base.best=Math.max(prev.best||0,prev.finished?prev.score||0:0);base.bestCorrect=Math.max(prev.bestCorrect||0,prev.finished?prev.correct||0:0);base.joinedAt=prev.joinedAt||base.joinedAt;}
      return first();}).catch(first);}
  else first();
  let started=false,cur=sess,finished=false;
  const hwIntro=()=>{const d=sess.due?new Date(sess.due+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}):"";
    APP().innerHTML=`<div class="lobby"><div class="big">${avHTML(avatar,120)}</div><h2 style="font-size:1.8rem;margin:10px 0">Bonjour ${esc(pseudo)} !</h2>
      <p class="muted">Ton devoir : <b>${esc(act.title)}</b>${d?`<br>À faire avant le ${esc(d)}`:""}.<br>Prends ton temps, tu peux le refaire pour t'améliorer.</p>
      <button class="btn primary big" id="hwGo" style="margin-top:14px">Commencer le devoir</button></div>`;
    $("#hwGo").onclick=start;};
  const lobby=()=>{APP().innerHTML=`<div class="lobby"><div class="big">${avHTML(avatar,120)}</div><h2 style="font-size:1.8rem;margin:10px 0">Bienvenue ${esc(pseudo)} !</h2>
    <p class="muted">Tu as rejoint <b>${esc(act.title)}</b>.<br>La partie commence dès que ton professeur la lance.</p><div class="tag" style="margin-top:10px">Code ${esc(code)}</div></div>`;};
  const start=()=>{if(started)return;started=true;
    const g=new Game(act,{chrono:cur.chrono!==false,
      onQuit:()=>{finished=true;Cloud.writePlayer(code,pid,Object.assign({},base,g.snapshot(false),{left:true}));joinView();},
      onProgress:snap=>Cloud.writePlayer(code,pid,Object.assign({},base,snap)),
      onEnd:async r=>{finished=true;UI.game=null;let rank="";
        if(r.score>(base.best||0)){base.best=r.score;base.bestCorrect=r.correct;}
        Cloud.writePlayer(code,pid,Object.assign({},base,g.snapshot(true)));
        if(cur.leaderboard){try{await Cloud._q[code+"/"+pid];const ps=await Cloud.getPlayers(code);const sorted=ps.sort((a,b)=>(b.score||0)-(a.score||0));const i=sorted.findIndex(p=>p.id===pid);if(i>=0)rank=`${i===0?"1er":(i+1)+"e"} / ${ps.length}`;}catch(e){}}
        APP().innerHTML=resultsHTML(r,act,{title:r.percent>=60?`Bravo ${pseudo} !`:`Bien joué ${pseudo}, continue !`,rank,actions:`<p class="muted" style="text-align:center;width:100%">Tes résultats ont été envoyés à ton professeur.</p>${cur.homework&&cur.status!=="ended"?`<button class="btn primary" id="hwAgain">🔄 Refaire le devoir</button>`:""}`});
        const ag=$("#hwAgain");if(ag)ag.onclick=()=>studentSession(code,cur,pseudo,avatar);window.scrollTo(0,0);}});
    UI.game=g;g.start();};
  UI.unsubs.push(Cloud.watchSession(code,d=>{if(!d)return;cur=d;
    if(d.status==="live"&&!started&&!d.homework)start();
    else if(d.status==="lobby"&&!started)lobby();
    else if(d.status==="ended"&&!finished){if(UI.game){toast("Ton professeur a terminé la partie.",4000);}else if(!started){APP().innerHTML=`<div class="lobby"><div class="big">🏁</div><h2>Partie terminée</h2><p class="muted">Merci d'avoir participé !</p></div>`;}}
  },()=>toast("Connexion perdue. Recharge la page.")));
  if(sess.homework)hwIntro();else if(sess.status==="live")start();else lobby();
}

async function exportCSV(s,rows){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv="\ufeff"+["Rang;Pseudo;Score;Bonnes réponses;Total;Réussite (%);Niveau atteint;Terminé",...rows.map((p,i)=>{const pc=pct(p.correct||0,p.total||1);return [i+1,q(p.pseudo),p.score||0,p.correct||0,p.total||0,pc,q(masteryOf(pc)[1]),p.finished?"oui":"non"].join(";");})].join("\n");
  const name=`ludika-${s.code}-${new Date(s.createdAt).toISOString().slice(0,10)}.csv`;
  try{const dl=window.claude?await claude.use("downloads"):null;if(dl){const r=await dl.save({filename:name,data:new Blob([csv],{type:"text/csv"})});if(r&&r.status==="saved")toast("Fichier CSV enregistré.");return;}}catch(e){if(e&&(e.code==="declined"||e.code==="cancelled"))return;if(e&&e.code==="rate_limited")return toast("Trop d'exports d'affilée, réessayez dans un instant.");}
  try{await navigator.clipboard.writeText(csv);toast("Résultats copiés : collez-les dans un tableur.");}catch(e){toast("Export impossible ici.");}
}

  dashShell("stats",`<div class="phead"><div><h2>${ic("stats",40)}Statistiques</h2><p class="muted" style="margin:4px 0 0">Vue d'ensemble de votre utilisation.</p></div></div>
  <div class="kpis"><div class="card kpi"><b>${G.length}</b><span>gamifications</span></div><div class="card kpi"><b>${S.length}</b><span>parties en classe</span></div>
    <div class="card kpi"><b>${pl.length}</b><span>participations d'élèves</span></div><div class="card kpi"><b>${avg} %</b><span>réussite moyenne</span></div><div class="card kpi"><b>${P.length}</b><span>tests enseignant</span></div></div>
  <div class="grid2"><div class="card"><h3 style="margin-bottom:10px">Par matière</h3>${Object.keys(bySub).length?Object.entries(bySub).map(([k,v])=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${subj(k).em} ${esc(subj(k).name)}</span><b>${v}</b></div><div class="bar"><i style="width:${v/maxS*100}%;background:${subj(k).color}"></i></div></div>`).join(""):`<p class="muted small">—</p>`}</div>
    <div class="card"><h3 style="margin-bottom:10px">Formats de questions</h3>${Object.keys(byType).length?Object.entries(byType).map(([k,v])=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${esc(QTYPES[k])}</span><b>${v}</b></div><div class="bar"><i style="width:${v/maxT*100}%"></i></div></div>`).join(""):`<p class="muted small">—</p>`}</div></div>
  <div class="card" style="margin-top:14px"><h3 style="margin-bottom:8px">Questions les plus difficiles pour vos élèves</h3>${hard.length?hard.slice(0,8).map(x=>`<div class="errbar"><span class="q">${esc(x.q.prompt.replace(/_{3,}/g,"…"))} <span class="muted small">· ${esc(x.title)}</span></span><div class="bar"><i style="width:${x.rate}%"></i></div><b>${x.rate} %</b></div>`).join(""):`<p class="muted small">Lancez une partie en classe pour voir quelles notions posent problème.</p>`}</div>`);
}
function vSettings(){
  const s=Store.settings;
  const sw=(k,t,d)=>`<div class="switch"><span><b>${t}</b>${d?`<br><span class="small muted">${d}</span>`:""}</span><input type="checkbox" data-set="${k}" ${s[k]?"checked":""} aria-label="${t}"></div>`;
  dashShell("settings",`<div class="phead"><div><h2>${ic("settings",40)}Paramètres</h2></div></div>
  <div class="grid2"><div class="card"><div class="field"><label for="sName">Votre nom (affiché en haut)</label><input type="text" id="sName" maxlength="40" value="${esc(s.teacher)}" placeholder="Ex. : Mme Benali"></div>
    ${sw("dys","Mode lecture facilitée","Espacement renforcé, conseillé pour les élèves dyslexiques.")}${sw("big","Texte agrandi")}${sw("chrono","Chronomètre par défaut","Désactivez-le pour laisser plus de temps.")}
    ${sw("leaderboard","Classement visible par défaut","Sinon, les élèves ne voient que leur propre score.")}${sw("sound","Sons")}${sw("tts","Lecture à voix haute")}</div>
  <div class="card"><h3 style="margin-bottom:10px">Connexions</h3>
    <p><b>IA :</b> ${AI.on?`✅ ${esc(AI.provider.name)}`:"❌ non connectée"}</p><p><b>Mode classe en ligne :</b> ${Cloud.on?"✅ disponible":"❌ indisponible (démo simulée)"}</p>
    <p class="small muted"><b>Aucune clé API n'est nécessaire</b> dans Claude : l'IA utilise votre compte Claude. Seulement si vous hébergez un jour Ludika ailleurs : hébergez ce fichier, créez une petite fonction serveur qui appelle l'API d'Anthropic avec votre clé, et indiquez son adresse dans <code>window.LUDIKA_API_URL</code>. La clé ne doit jamais se trouver dans cette page.</p>
    <h3 style="margin:18px 0 8px">Données</h3><p class="small muted">Vos gamifications, classes et réglages sont enregistrés sur cet appareil. Les parties en classe sont partagées avec les élèves connectés. Aucun nom réel ni e-mail d'élève n'est demandé.</p>
    <button class="btn" id="sWipe">🗑️ Effacer toutes mes données</button></div></div>`);
  $("#sName").oninput=e=>{s.teacher=e.target.value;Store.save();};
  $$("[data-set]").forEach(i=>i.onchange=()=>{s[i.dataset.set]=i.checked;Store.save();applySettings();});
  $("#sWipe").onclick=()=>{if(confirm("Effacer toutes vos gamifications, classes et résultats de cet appareil ?")){Store.data=Store.defaults();Store.save();seedDemo();Store.data.seeded=true;Store.save();applySettings();toast("Données effacées");dash("games");}};
}

/* ---------- Démarrage ---------- */
Store.load();
if(!Store.data.seeded){seedDemo();Store.data.seeded=true;Store.save();}
applySettings();
AI.readyP=AI.init();
Cloud.readyP=Cloud.init();
Promise.all([AI.readyP,Cloud.readyP]).then(()=>{if(UI.view==="dash"&&(UI.tab==="create"||UI.tab==="settings"))dash(UI.tab);if(UI.view==="join"&&!$("#jName").value)joinView($("#jCode").value);});
if(/eleve|join/i.test(location.hash))joinView();else landing();
</script>
</body>
</html>
