services:
  - type: web
    name: ludika
    runtime: python
    rootDir: ludika
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 8 --timeout 600 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LUDIKA_ACCESS_CODE
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7

  - type: web
    name: tadriss-maths
    runtime: python
    rootDir: maths
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tadriss-db
          property: connectionString
      - key: BASE_URL
        sync: false
      # E-mail(s) des administrateurs (séparés par des virgules) : accès à /#/admin
      - key: ADMIN_EMAILS
        sync: false
      # Mot de passe oublié : y mettre un nouveau mot de passe (8+ caractères), redéployer, se connecter, puis SUPPRIMER la variable
      - key: ADMIN_RESET_PASSWORD
        sync: false
      # "demo" = paiement simulé. Passer à "chargily" seulement quand les clés sont prêtes.
      - key: PAYMENT_MODE
        value: demo
      - key: CHARGILY_SECRET_KEY
        sync: false
      # "test" = faux paiements. Passer à "live" uniquement pour de vrais paiements.
      - key: CHARGILY_MODE
        value: test

  - type: web
    name: chanson
    runtime: python
    rootDir: chanson
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 8 --timeout 600 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Paroles de la chanson (Claude)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Musique + voix (ElevenLabs Music). Sans cette clé : mode démo (simple mélodie de test)
      - key: ELEVENLABS_API_KEY
        sync: false
      # Facultatif : code demandé avant de créer une chanson (protège vos crédits)
      - key: CHANSON_ACCESS_CODE
        sync: false

databases:
  - name: tadriss-db
    plan: free
    databaseName: tadriss
