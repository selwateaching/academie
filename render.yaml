services:
  - type: web
    name: ludika
    runtime: python
    rootDir: ludika
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 8 --timeout 600 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LUDIKA_ACCESS_CODE
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
