services:
  - type: web
    name: academie-ia
    runtime: python
    plan: free
    rootDir: academie_edu
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CLAUDE_MODEL
        value: "claude-sonnet-4-5"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_LYCEE
        value: "administration@lycee.dz"
      - key: DATABASE_URL
        fromDatabase:
          name: academie-ia-db
          property: connectionString

databases:
  - name: academie-ia-db
    plan: free
