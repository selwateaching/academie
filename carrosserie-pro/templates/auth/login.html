{% extends "base.html" %}
{% block title %}Connexion — Carrosserie Pro{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-shield-shaded" style="font-size:2.2rem; color:#1f3a5f;"></i>
      <h4 class="mt-2 mb-0 fw-bold">Carrosserie<span style="color:#ef6c3c;">Pro</span></h4>
      <p class="text-muted small mb-0">Gestion d'atelier, devis &amp; factures assurance</p>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Adresse email</label>
        <input type="email" class="form-control" name="email" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Mot de passe</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
